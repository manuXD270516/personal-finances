[project]
name = "finance-ml"
version = "0.1.0"
description = "Servicio interno de pronósticos de PFOS (sin estado, sin acceso a datos)."
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "numpy",
  "scipy",
  "pandas",
  "statsmodels",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
]

[dependency-groups]
dev = [
  "pytest",
  "hypothesis",
  "httpx",
  "ruff",
  "mypy",
  "jsonschema",
  "pyyaml",
  "types-pyyaml",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_ml"]

[tool.uv]
# Solo versiones publicadas hace al menos dos semanas (NFR-SEC-013).
exclude-newer = "2026-10-29T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = []

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# `perf` (benchmark nocturno) no corre en el PR: `uv run pytest -m perf`.
addopts = "-m 'not perf'"
markers = ["perf: benchmark de rendimiento (nocturno)"]
