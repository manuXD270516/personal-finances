# Contrato interno del servicio de pronósticos (finance-ml). GENERADO por
# services/ml-forecasting/scripts/export_openapi.py: no se edita a mano (el job `ml` de CI compara).
components:
  schemas:
    BaselineInfo:
      additionalProperties: false
      properties:
        method:
          enum:
          - NAIVE
          - SEASONAL_NAIVE
          - MEAN_LAST_N
          title: Method
          type: string
        n:
          anyOf:
          - type: integer
          - type: 'null'
          title: N
      required:
      - method
      - n
      title: BaselineInfo
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        code:
          enum:
          - INVALID_REQUEST
          - UNAUTHORIZED
          - PAYLOAD_TOO_LARGE
          - BUSY
          - DEADLINE_EXCEEDED
          title: Code
          type: string
        detail:
          title: Detail
          type: string
      required:
      - code
      - detail
      title: ErrorBody
      type: object
    ForecastRequestV1:
      additionalProperties: false
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
        requestId:
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          title: Requestid
          type: string
        schemaVersion:
          const: '1'
          title: Schemaversion
          type: string
        seed:
          maximum: 2147483647.0
          minimum: 0.0
          title: Seed
          type: integer
        series:
          items:
            $ref: '#/components/schemas/SeriesIn'
          maxItems: 400
          minItems: 1
          title: Series
          type: array
      required:
      - schemaVersion
      - requestId
      - seed
      - policy
      - series
      title: ForecastRequestV1
      type: object
    ForecastResponseV1:
      additionalProperties: false
      properties:
        durationMs:
          minimum: 0.0
          title: Durationms
          type: integer
        requestId:
          title: Requestid
          type: string
        results:
          items:
            $ref: '#/components/schemas/ResultOut'
          title: Results
          type: array
        schemaVersion:
          const: '1'
          title: Schemaversion
          type: string
        serviceVersion:
          title: Serviceversion
          type: string
      required:
      - schemaVersion
      - requestId
      - serviceVersion
      - results
      - durationMs
      title: ForecastResponseV1
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ModelFamily:
      additionalProperties: false
      properties:
        name:
          title: Name
          type: string
        version:
          title: Version
          type: string
      required:
      - name
      - version
      title: ModelFamily
      type: object
    ModelInfo:
      additionalProperties: false
      properties:
        name:
          title: Name
          type: string
        selectedBy:
          enum:
          - fixed
          - simple
          title: Selectedby
          type: string
        version:
          title: Version
          type: string
      required:
      - name
      - version
      - selectedBy
      title: ModelInfo
      type: object
    ModelsResponse:
      additionalProperties: false
      properties:
        modelSet:
          title: Modelset
          type: string
        models:
          items:
            $ref: '#/components/schemas/ModelFamily'
          title: Models
          type: array
        serviceVersion:
          title: Serviceversion
          type: string
      required:
      - serviceVersion
      - modelSet
      - models
      title: ModelsResponse
      type: object
    PointOut:
      additionalProperties: false
      properties:
        baselineValue:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Baselinevalue
          type: string
        lower80:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Lower80
          type: string
        lower95:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Lower95
          type: string
        monthsAhead:
          maximum: 12.0
          minimum: 1.0
          title: Monthsahead
          type: integer
        period:
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          title: Period
          type: string
        prediction:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Prediction
          type: string
        upper80:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Upper80
          type: string
        upper95:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Upper95
          type: string
      required:
      - period
      - monthsAhead
      - prediction
      - lower80
      - upper80
      - lower95
      - upper95
      - baselineValue
      title: PointOut
      type: object
    Policy:
      additionalProperties: false
      properties:
        horizonMax:
          maximum: 12.0
          minimum: 1.0
          title: Horizonmax
          type: integer
        intervalLevels:
          items:
            type: number
          maxItems: 2
          minItems: 2
          title: Intervallevels
          type: array
        modelSet:
          const: baseline-v1
          title: Modelset
          type: string
      required:
      - modelSet
      - horizonMax
      - intervalLevels
      title: Policy
      type: object
    ResultOut:
      additionalProperties: false
      properties:
        baseline:
          anyOf:
          - $ref: '#/components/schemas/BaselineInfo'
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        model:
          anyOf:
          - $ref: '#/components/schemas/ModelInfo'
          - type: 'null'
        points:
          items:
            $ref: '#/components/schemas/PointOut'
          title: Points
          type: array
        ref:
          pattern: ^s[1-9][0-9]{0,3}$
          title: Ref
          type: string
        status:
          enum:
          - OK
          - ERROR
          title: Status
          type: string
      required:
      - ref
      - status
      - error
      - model
      - baseline
      - points
      title: ResultOut
      type: object
    SeriesIn:
      additionalProperties: false
      properties:
        currency:
          pattern: ^[A-Z0-9]{2,16}$
          title: Currency
          type: string
        horizon:
          maximum: 12.0
          minimum: 1.0
          title: Horizon
          type: integer
        kind:
          enum:
          - EXPENSE
          - INCOME
          title: Kind
          type: string
        points:
          items:
            $ref: '#/components/schemas/SeriesPoint'
          maxItems: 120
          minItems: 1
          title: Points
          type: array
        readiness:
          enum:
          - MODEL
          - SIMPLE
          title: Readiness
          type: string
        ref:
          pattern: ^s[1-9][0-9]{0,3}$
          title: Ref
          type: string
        scale:
          maximum: 8.0
          minimum: 0.0
          title: Scale
          type: integer
      required:
      - ref
      - kind
      - currency
      - scale
      - readiness
      - horizon
      - points
      title: SeriesIn
      type: object
    SeriesPoint:
      additionalProperties: false
      properties:
        period:
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          title: Period
          type: string
        txCount:
          maximum: 1000000.0
          minimum: 0.0
          title: Txcount
          type: integer
        value:
          maxLength: 40
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          title: Value
          type: string
      required:
      - period
      - value
      - txCount
      title: SeriesPoint
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: Servicio interno de pronósticos. No es la API pública.
  title: PFOS finance-ml
  version: 1.0.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Live
                type: object
          description: Successful Response
      summary: Live
      tags:
      - health
  /health/ready:
    get:
      operationId: ready
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Ready
          description: Successful Response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Service Unavailable
      summary: Ready
      tags:
      - health
  /v1/forecasts:
    post:
      operationId: createForecast
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRequestV1'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponseV1'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Cuerpo inválido.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Sin credencial de servicio o inválida.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Cuerpo demasiado grande.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Servicio ocupado; reintentar.
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Corte interno del cómputo.
      summary: Create Forecast
      tags:
      - forecasts
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Sin credencial de servicio o inválida.
      summary: Models
      tags:
      - forecasts
