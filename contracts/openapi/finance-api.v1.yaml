        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/approve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Imports]
      operationId: approveImport
      summary: Approve the import (the transactions are created asynchronously, in batches)
      description: |
        Rejected with 409 `IMPORT_REVIEW_INCOMPLETE` (`details.pendingDecisions`) while a possible duplicate has no
        decision, and with `ACCOUNT_CLOSED` / `ACCOUNT_ARCHIVED` if the account is no longer active. Approving assigns the
        rows to create to batches of `IMPORT_PERSIST_BATCH_SIZE` (200), links the skipped duplicates with their existing
        movement, moves the import to `APPROVED`, audits it with the approver as actor and publishes
        `imports.ImportApproved.v1` in the same transaction. The worker then creates one POSTED expense or income per row
        (category "Uncategorized" / "Uncategorized income", `source = IMPORT`, its journal entry, audit with origin
        `import` and creation lifecycle step) and the import ends `COMPLETED` or `PARTIALLY_FAILED`; poll `getImport`.
        Costly operation (`x-rate-limit: costly`).
      x-openspec-capability: imports/import-pipeline
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Approved; the persistence runs in the background
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'IMPORT_REVIEW_INCOMPLETE, INVALID_STATUS_TRANSITION, ACCOUNT_CLOSED or ACCOUNT_ARCHIVED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Imports]
      operationId: cancelImport
      summary: Cancel an import that is not approved yet
      description: |
        Only an import waiting for its mapping or in review; it creates no transaction, drops the raw cells of the file and
        is audited. An approved or finished import → 409 `INVALID_STATUS_TRANSITION`.
      x-openspec-capability: imports/import-pipeline
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled import
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Imports]
      operationId: retryImport
      summary: Retry the rows a rejected batch left out
      description: |
        Only a `PARTIALLY_FAILED` import (409 `INVALID_STATUS_TRANSITION` otherwise): the failed rows are persisted again;
        the rows already created are never duplicated (idempotent per row). Publishes `imports.ImportApproved.v1` with the
        next `attempt`. Costly operation (`x-rate-limit: costly`).
      x-openspec-capability: imports/import-pipeline
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Retrying; the persistence runs in the background
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION, ACCOUNT_CLOSED or ACCOUNT_ARCHIVED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/accept-errors:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Imports]
      operationId: acceptImportErrors
      summary: Accept the partial result (the failed rows are not imported)
      description: |
        Only a `PARTIALLY_FAILED` import (409 `INVALID_STATUS_TRANSITION` otherwise): it ends `COMPLETED_WITH_ERRORS`
        keeping the created transactions and the listed failed rows, publishes `imports.ImportCompleted.v1` and is audited.
