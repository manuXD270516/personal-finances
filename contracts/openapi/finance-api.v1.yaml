  # ─────────────────────────────── Audit ───────────────────────────────
  /workspaces/{workspaceId}/audit-log:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Audit]
      operationId: listAuditLog
      summary: Read the audit log (entity history or global search with combinable filters)
      description: |
        Default sort: `occurredAt` (chronological) when `aggregateId` is given (entity history), otherwise
        `-occurredAt` (most recent first). `from`/`to` are business dates in the workspace timezone (inclusive).
        Readable by OWNER and EDITOR only (VIEWER → 403 INSUFFICIENT_ROLE; docs/33 D105).
        VIEWER sees the history of a single transaction through `getTransactionHistory` (D28).
        Global view (add-global-audit-view, FR-AUDIT-006): the filters `actorUserId`, `action`, `aggregateType`,
        `aggregateId`, `origin`, `correlationId`, `category`, `from` and `to` combine with AND. `correlationId` groups
        every record of one operation; in a bulk edit it is the `bulkOperationId`. `category=SECURITY` returns security
        events (sessions, authorization failures, settings changes, exports, period reopenings); `DATA` the rest.
        Without `aggregateId` nor `correlationId` a `from`–`to` range cannot exceed 366 days (VALIDATION_FAILED).
      x-openspec-capability: audit/audit-trail
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditAggregateType'
        - $ref: '#/components/parameters/AuditAggregateId'
        - $ref: '#/components/parameters/AuditActorUserId'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditOriginFilter'
        - $ref: '#/components/parameters/AuditCorrelationId'
        - $ref: '#/components/parameters/AuditCategory'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - name: sort
          in: query
          schema:
            type: string
            enum: [occurredAt, -occurredAt]
      responses:
        '200':
          description: Audit log page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'VALIDATION_FAILED, INVALID_CURSOR, INVALID_FILTER (aggregateId without aggregateType, from > to).'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/audit-log/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Audit]
      operationId: exportAuditLog
      summary: Export the audit log query to CSV (OWNER only)
      description: |
        Synchronous CSV of the same query as `listAuditLog` (same filters, most recent first), up to 50000 records
        (more → 400 VALIDATION_FAILED: narrow the filters). `format=csv`: RFC 4180, UTF-8 with BOM, comma separator,
        instants in the workspace timezone with their offset (e.g. `2026-03-15T23:30:00-04:00`), amounts as decimal
        strings, sensitive fields kept masked and cells that start with `=`, `+`, `-`, `@`, tab or CR neutralized
        against CSV injection. OWNER only (EDITOR → 403 INSUFFICIENT_ROLE; docs/33 D105). Every export is audited
        (`audit.log.exported`, a security event) with the actor and the filters used. At most 10 exports per user and
        minute (429 RATE_LIMITED).
      x-openspec-capability: audit/audit-trail
      x-required-role: OWNER
      x-rate-limit: costly
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv] }
        - $ref: '#/components/parameters/AuditAggregateType'
        - $ref: '#/components/parameters/AuditAggregateId'
        - $ref: '#/components/parameters/AuditActorUserId'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditOriginFilter'
        - $ref: '#/components/parameters/AuditCorrelationId'
        - $ref: '#/components/parameters/AuditCategory'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: >-
            Audit log CSV as an attachment (`Content-Disposition: attachment; filename="audit-<workspace>-<from>-<to>.csv"`).
          headers:
            Content-Disposition:
              description: Always `attachment` with a safe ASCII file name.
              schema: { type: string }
          content:
            text/csv:
              schema:
                type: string
                description: CSV RFC 4180 (comma, CRLF, header) with UTF-8 BOM.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'VALIDATION_FAILED (invalid filter, more than 50000 records), INVALID_FILTER.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
