        currency: { $ref: '#/components/schemas/CurrencyCode' }
    TemplateVersionHeader:
      type: object
      additionalProperties: false
      required: [versionNo, basedOnVersionNo, changeNote, createdAt, createdBy, lineCount]
      properties:
        versionNo: { type: integer, minimum: 1 }
        basedOnVersionNo:
          oneOf:
            - { type: integer, minimum: 1 }
            - type: 'null'
        changeNote:
          oneOf:
            - { type: string }
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Instant' }
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        lineCount: { type: integer, minimum: 0 }
    TemplateVersion:
      type: object
