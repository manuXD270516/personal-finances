      responses:
        '201':
          description: New template (version 1)
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'NAME_TAKEN.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'REFERENCE_NOT_FOUND (versionNo) or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Planning]
      operationId: archiveTemplate
      summary: Archive a template (it stops being the default and cannot be applied)
      description: Idempotent. Versions and the origin recorded by existing plans are kept.
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      responses:
        '200':
          description: Archived template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}/unarchive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Planning]
      operationId: unarchiveTemplate
      summary: Unarchive a template
      description: Idempotent. The name must still be free among the active templates (`NAME_TAKEN`).
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      responses:
        '200':
          description: Active template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'NAME_TAKEN.'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}/set-default:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Planning]
      operationId: setDefaultTemplate
      summary: Make a template the default one applied to every new period
      description: |
        At most one active template is the default; the previous one is unmarked in the same transaction. An archived
        template cannot be the default (`BUDGET_TEMPLATE_ARCHIVED`).
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      responses:
        '200':
          description: Default template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'BUDGET_TEMPLATE_ARCHIVED.'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}/apply:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Planning]
      operationId: applyTemplate
      summary: Create the plan of a period from a version of the template
      description: |
        Shortcut of `createBudget` with `source.kind = TEMPLATE`. Lines whose target is archived or whose currency is not
        the plan currency are omitted and reported in `omittedLines` (the operation does not fail). The plan keeps the
        template and the version it came from.
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateApply' }
      responses:
        '201':
          description: Plan created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'BUDGET_ALREADY_EXISTS, BUDGET_TEMPLATE_ARCHIVED or PERIOD_CLOSED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'REFERENCE_NOT_FOUND (periodId or versionNo) or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/budget-propagations/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Planning]
      operationId: previewBudgetPropagation
      summary: Preview propagating a change to the plans of future draft periods (no effects)
      description: |
        Stateless: nothing is stored. The source is either a full new snapshot of a template (`TEMPLATE`) or lines of a
        plan that came from a template (`BUDGET`; a plan without template origin is rejected with
        `BUDGET_NO_TEMPLATE_ORIGIN`: create a template from its lines instead). Reaches only the plans of that template
        whose periods are `DRAFT` and start after today in the workspace time zone (and after the source plan period).
        Lines edited by hand are reported as conflicts and never overwritten; lines removed from the template are
        removed only where they were not edited. The `token` hashes what the preview saw.
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetPropagationRequest' }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPropagationPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'CONCURRENCY_CONFLICT (baseVersionNo is not the current version), BUDGET_TEMPLATE_ARCHIVED or CATEGORY_ARCHIVED / TAG_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BUDGET_NO_TEMPLATE_ORIGIN, REFERENCE_NOT_FOUND, BUDGET_INVALID_AMOUNTS or the line validation errors of createTemplate.'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/budget-propagations/confirm:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Planning]
      operationId: confirmBudgetPropagation
      summary: 'Confirm a propagation (publish the new template version and update the reached plans)'
      description: |
        Recomputes the preview in one transaction. If the `token` differs (a plan, the template or the scope changed)
        it answers `BUDGET_PROPAGATION_STALE` and changes nothing; otherwise it publishes version N+1 of the template
        and updates only the reached plans (`DRAFT` periods after today), leaving the conflicting lines untouched.
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetPropagationConfirm' }
      responses:
        '200':
          description: Template with its new version and the plans that were updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPropagationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'BUDGET_PROPAGATION_STALE, CONCURRENCY_CONFLICT, BUDGET_TEMPLATE_ARCHIVED or CATEGORY_ARCHIVED / TAG_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BUDGET_NO_TEMPLATE_ORIGIN, REFERENCE_NOT_FOUND, VALIDATION_FAILED (nothing to propagate) or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Reconciliation (Phase 2, add-reconciliation) ─────────────────────────────
  /workspaces/{workspaceId}/reconciliations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reconciliation]
      operationId: listReconciliations
      summary: List reconciliation sessions (newest statement first)
      description: |
        Ordered by `statementDate` descending (ties by id). The list does not compute the live balance of in-progress
        sessions; use `getReconciliation` for it.
      x-openspec-capability: transactions/reconciliation
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: accountId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReconciliationState' }
      responses:
        '200':
          description: Reconciliations page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Reconciliation]
      operationId: startReconciliation
      summary: Start a reconciliation session for an account against a statement date and balance
      description: |
        At most one `IN_PROGRESS` session per account. `statementDate` cannot be after today in the workspace time zone
        nor on or before the statement date of the account's last completed session
        (`RECONCILIATION_STATEMENT_DATE_INVALID`). `statementBalance` is expressed in the account currency and scale
        (liabilities as a positive debt). Archived or closed accounts cannot be reconciled.
      x-openspec-capability: transactions/reconciliation
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationStart' }
      responses:
        '201':
          description: Session in progress
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'RECONCILIATION_IN_PROGRESS, ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'RECONCILIATION_STATEMENT_DATE_INVALID, AMOUNT_SCALE_EXCEEDED, REFERENCE_NOT_FOUND, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reconciliations/{reconciliationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReconciliationId'
    get:
      tags: [Reconciliation]
      operationId: getReconciliation
      summary: Get a reconciliation session with its live cleared balance and difference
      description: |
        `clearedBalance` = opening balance + effect on the account of its `cleared` and `reconciled` transactions dated
        on or before `statementDate`; `difference` = `statementBalance` − `clearedBalance` (liabilities as a positive
        debt). Both are recomputed on every read while `IN_PROGRESS` and frozen once `COMPLETED`; `items[]` lists the
        transactions reconciled (or verified) by a completed session.
      x-openspec-capability: transactions/reconciliation
      x-required-role: VIEWER
      responses:
        '200':
          description: Reconciliation session
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reconciliations/{reconciliationId}/cleared:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReconciliationId'
    post:
      tags: [Reconciliation]
      operationId: toggleReconciliationCleared
      summary: Confirm (or unconfirm) transactions of the account inside the session
      description: |
        Same `CLEAR`/`UNCLEAR` as `markTransactionsCleared` (all-or-nothing, version per item, never touches the
        ledger) limited to transactions of the session account dated on or before the statement date
        (`VALIDATION_FAILED` otherwise). Bumps the session version. Returns the session with the recomputed balances.
      x-openspec-capability: transactions/reconciliation
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClearedMarkRequest' }
      responses:
        '200':
          description: Session with the recomputed cleared balance and difference
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (session not in progress, or a transaction not POSTED/CLEARED), PERIOD_CLOSED, CONCURRENCY_CONFLICT.'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
          description: 'PRECONDITION_FAILED (stale session version, or one `errors[]` entry per stale item).'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reconciliations/{reconciliationId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReconciliationId'
    post:
      tags: [Reconciliation]
      operationId: completeReconciliation
      summary: Complete the session (difference 0, or with a confirmed adjustment)
      description: |
        Evaluates the CURRENT state of the transactions at completion time. Difference 0 → every `cleared` transaction
        of the account dated on or before the statement date becomes `reconciled` (mode `STATEMENT`) and the session
        `COMPLETED`, in one database transaction with audit, lifecycle records and events; the ledger is untouched.
        Difference ≠ 0 → 422 `RECONCILIATION_DIFFERENCE_NOT_ZERO` (extension `difference`) unless `adjustment.reason` is
        given: an `ADJUSTMENT` against `EQUITY:ADJUSTMENTS:<CCY>` dated on the statement date is created, reconciled and
        linked to the session. Transactions marked reconciled without a statement dated on or before the statement date
        and outside closed periods are verified against the statement (mode `STATEMENT`). Any transaction (or the
        adjustment) in a closed period → 409 `PERIOD_CLOSED` with one `errors[]` entry per transaction, nothing changes.
        Publishes `transactions.ReconciliationCompleted.v1`.
      x-openspec-capability: transactions/reconciliation
      x-required-role: EDITOR
      # La transacción del comando se abre SERIALIZABLE con reintento ante conflicto (docs/08 §11, add-reconciliation).
      x-isolation: SERIALIZABLE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationComplete' }
      responses:
        '200':
          description: Completed session
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (not in progress), PERIOD_CLOSED, CONCURRENCY_CONFLICT, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'RECONCILIATION_DIFFERENCE_NOT_ZERO (extension `difference`: Money), IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reconciliations/{reconciliationId}/cancel:
