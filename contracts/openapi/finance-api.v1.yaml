  /workspaces/{workspaceId}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Commitments]
      operationId: listSubscriptions
      summary: List the subscriptions of the workspace
      description: |
        Ordered by next renewal. Without `status` the cancelled subscriptions are excluded; filter by `status=CANCELLED` to
        see them. `nextRenewalOn` is the projection refreshed by every subscription command, by the charge consumer and by
        the hourly subscription job.
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: VIEWER
      parameters:
        - name: status
          in: query
          description: One or more statuses, comma separated.
          schema: { type: string, examples: ['ACTIVE,TRIAL'] }
        - name: counterpartyId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: paymentAccountId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Subscriptions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Commitments]
      operationId: createSubscription
      summary: Register a subscription (creates its recurring definition and its first price)
      description: |
        The provider is an active counterparty, the price is positive in an enabled currency and the first renewal is the
        start of the recurring definition (a managed expense definition, `managedBy = SUBSCRIPTION`). When the price
        currency differs from the payment account currency, every expected charge is estimated with the valuation rate
        of the pair (preferred type, parallel by default) valid when it is generated; without a rate the expected
        charge has no amount (never 1:1). With `trialEndsOn` it starts in `TRIAL` and the first renewal must not precede
        it.
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Created subscription
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'COUNTERPARTY_ARCHIVED, ACCOUNT_ARCHIVED, ACCOUNT_CLOSED or CATEGORY_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            AMOUNT_NOT_POSITIVE, AMOUNT_SCALE_EXCEEDED, CURRENCY_NOT_ENABLED, REFERENCE_NOT_FOUND, VALIDATION_FAILED
            (first renewal before the end of the trial, tolerance or reminder out of range), INVALID_RRULE,
            RECURRING_INVALID_SCHEDULE or CATEGORY_KIND_MISMATCH.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/subscriptions/cost-summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Commitments]
      operationId: getSubscriptionCostSummary
      summary: Monthly and annual cost of the subscriptions in the base currency
      description: |
        Annual = price in force today x renewals per year of the cycle (weekly 52, biweekly 26, twice a month 24,
        monthly 12, bimonthly 6, quarterly 4, semiannual 2, annual 1, daily 365, divided by the interval; a custom
        rule counts the renewals of the next 12 months); monthly = annual / 12. Converted with the valuation rate of
        today (same valuation and window as the Home and the budgets), without intermediate rounding. The total
        includes the `ACTIVE` subscriptions (also those with a scheduled cancellation); `TRIAL` ones are shown apart
        in `afterTrial` with the price of the first renewal; `PAUSED` and `CANCELLED` are excluded. Without a rate the
        part is reported unconverted and the total is incomplete (never 1:1).
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: VIEWER
      responses:
        '200':
          description: Cost summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionCostSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Commitments]
      operationId: getSubscription
      summary: Get a subscription with its price history and pending proposal
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: VIEWER
      responses:
        '200':
          description: Subscription
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Commitments]
      operationId: updateSubscription
      summary: Edit a subscription without altering the past
      description: |
        Name, plan, category, materialization mode, reminder, tolerance and cancellation link are annotations. Changing the
        payment account or the billing cycle needs `effectiveFrom` and applies only to the charges dated on or after it
        (the recurring definition is revised "this and the following"); settled charges and their transactions never
        change. A cancelled subscription cannot be edited (409 `INVALID_STATUS_TRANSITION`).
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: Updated subscription
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (cancelled), ACCOUNT_ARCHIVED, ACCOUNT_CLOSED or CATEGORY_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            VALIDATION_FAILED (account or cycle change without effectiveFrom, tolerance or reminder out of range), INVALID_RRULE, RECURRING_INVALID_SCHEDULE, RECURRING_MODE_NOT_ALLOWED, CATEGORY_KIND_MISMATCH or REFERENCE_NOT_FOUND.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/subscriptions/{subscriptionId}/prices:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Commitments]
      operationId: addSubscriptionPrice
      summary: Register a new price with its effective date
      description: |
        The effective date must be after the last non-superseded entry (422 `SUBSCRIPTION_PRICE_NOT_CHRONOLOGICAL`) and the
        price in the subscription currency (422 `CURRENCY_MISMATCH`). The entry is appended to the immutable history and the
