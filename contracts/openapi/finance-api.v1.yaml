      summary: Historial de cambios de una transacción (visible para VIEWER, D28)
      description: |
        Devuelve solo las entradas de auditoría de esta transacción (y de sus splits y asiento vinculado), en orden cronológico.
        A diferencia de `/audit-log` (EDITOR+), lo puede leer todo miembro que pueda ver la transacción, incluido VIEWER.
      x-openspec-capability: transactions/transaction-recording
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
