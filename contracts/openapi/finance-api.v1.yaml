            - type: 'null'
        changeNote:
          oneOf:
            - { type: string }
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Instant' }
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        lines:
          type: array
          items: { $ref: '#/components/schemas/TemplateLine' }
    TemplateSummary:
      type: object
      additionalProperties: false
