  # ── Imports: importación CSV básica (openspec add-basic-csv-import) ──
  /workspaces/{workspaceId}/imports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Imports]
      operationId: createImport
      summary: Upload a bank statement CSV for one account (creates an import waiting for its column mapping)
      description: |
        `multipart/form-data` with the `file` (CSV, at most `IMPORT_CSV_MAX_BYTES` = 2 MiB: the server stops reading when it
        is exceeded → 413 `UPLOAD_TOO_LARGE`) and the `accountId` (an active account of the workspace: closed → 409
        `ACCOUNT_CLOSED`, archived → 409 `ACCOUNT_ARCHIVED`). The server detects the encoding (UTF-8 with or without BOM, or
        windows-1252) and the delimiter (`,` `;` tab `|`), reads the records (RFC 4180) and returns the import in
        `AWAITING_MAPPING` with the `header` (first record) and up to 20 `sampleRows`; nothing financial is created
        (NFR-DATA-016) and the file itself is NOT stored (only its cells, as untrusted data, until the retention elapses).
        More than `IMPORT_CSV_MAX_ROWS` = 5 000 data rows → 422 `IMPORT_TOO_MANY_ROWS`; binary content, an empty file or
        more than 50 columns → 422 `IMPORT_UNSUPPORTED_FORMAT`. If the exact file (SHA-256) was already imported into the
        same account the import is created with the warning `IMPORT_FILE_ALREADY_IMPORTED` (the date and the previous
        import); row-level idempotency still prevents duplicates. `suggestedMapping` is the mapping of the last import of
        the account when it fits the new file. Costly operation (`x-rate-limit: costly`): at most 10 per user and minute
        (429 `RATE_LIMITED`); an idempotent replay does not consume the quota. The file and the account are part of the
        idempotency payload (same key with another file or account → 422 `IDEMPOTENCY_KEY_REUSED`). Audited.
      x-openspec-capability: imports/import-pipeline
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, accountId]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file (`text/csv`; any name, sanitized before it is stored).
                accountId:
                  allOf:
                    - $ref: '#/components/schemas/Uuid'
                  description: The single target account of the import.
      responses:
        '201':
          description: Import created, waiting for its mapping
          headers:
            Location:
              description: URL of the import (`/api/v1/workspaces/{workspaceId}/imports/{importId}`).
              schema: { type: string }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_CLOSED or ACCOUNT_ARCHIVED.'
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'IMPORT_UNSUPPORTED_FORMAT, IMPORT_TOO_MANY_ROWS, REFERENCE_NOT_FOUND or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Imports]
      operationId: listImports
      summary: List the imports of the workspace (newest first)
      description: |
        Optionally filtered by target account and status. `GET …/imports?accountId=&limit=1` returns the last import of an
        account (the wizard uses its `mapping` to preload the next one).
      x-openspec-capability: imports/import-pipeline
      x-required-role: VIEWER
      parameters:
        - name: accountId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ImportJobStatus' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Imports page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Imports]
      operationId: getImport
      summary: Get one import with its counters, progress and errors
      description: |
        While the import is `APPROVED` or `PERSISTING` the client polls this operation (with `If-None-Match`: 304 when
        nothing changed). `progress` reports the batches done; `counters` the rows by outcome; `errors` the rows that a
        rejected batch left out (a code, the count and the first 100 file lines).
