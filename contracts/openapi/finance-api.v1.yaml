      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Debt]
      operationId: getLoan
      summary: Get a loan with its status
      description: |
        Terms, outstanding principal according to the schedule (principal minus principal paid), balance owed according to the loan account,
        the difference between both (movements of the account not registered as loan payments: `outstandingPrincipal - accountBalance`), the next
        installment, the overdue installments (due before today in the workspace time zone) and the accumulated interest, fees, insurance and
        taxes paid. A draft carries the preview of its schedule.
      x-openspec-capability: [debt/loans]
      x-required-role: VIEWER
      responses:
        '200':
          description: Get a loan with its status
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Debt]
      operationId: updateLoan
      summary: Edit a loan (all terms in draft; name, lender and payment account once active)
      description: |
        Editing the financial terms of a non-draft loan answers 409 `LOAN_TERMS_LOCKED` and leaves schedule version 1 untouched.
      x-openspec-capability: [debt/loans]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanUpdate' }
      responses:
        '200':
          description: Edit a loan (all terms in draft; name, lender and payment account once active)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'LOAN_TERMS_LOCKED, LOAN_NOT_ACTIVE, LOAN_ACCOUNT_IN_USE, LOAN_ACCOUNT_NOT_EMPTY, COUNTERPARTY_ARCHIVED, ACCOUNT_ARCHIVED or ACCOUNT_CLOSED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            VALIDATION_FAILED, AMOUNT_SCALE_EXCEEDED, LOAN_METHOD_NOT_AVAILABLE, LOAN_ACCOUNT_INVALID, CURRENCY_MISMATCH or REFERENCE_NOT_FOUND.
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/loans/{loanId}/disburse:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Debt]
      operationId: disburseLoan
      summary: Disburse a draft loan
      description: |
        In one unit of work: creates the `LOAN_DISBURSEMENT` transaction dated on the disbursement date (increases the destination account by
        the principal minus the retained fee, increases the debt by the full principal and records the retained fee as an expense in the system
        category "Loan fees"), fixes schedule version 1, activates the loan and creates the commitment of its installments.
      x-openspec-capability: [debt/loans]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisburseInput' }
      responses:
        '200':
          description: Disburse a draft loan
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'LOAN_NOT_DRAFT, PERIOD_CLOSED, ACCOUNT_ARCHIVED or ACCOUNT_CLOSED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            VALIDATION_FAILED, AMOUNT_SCALE_EXCEEDED, CURRENCY_MISMATCH or IDEMPOTENCY_KEY_REUSED.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

