  /workspaces/{workspaceId}/recurring/occurrences/{occurrenceId}/materialize:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RecurringOccurrenceId'
    post:
      tags: [Commitments]
      operationId: materializeRecurringOccurrence
      summary: Approve an occurrence (creates its transaction)
      description: |
        Creates the transaction through the public port of Transactions (`source = RECURRING`, `externalRef =
        commitments.occurrence/<id>`) in the same unit of work as the occurrence change. Amount: `FIXED` → the expected
        one; `ESTIMATED` → the given or the expected; `MIN_MAX` → the given (inside the range) or the maximum;
        `VARIABLE` → required (422 `OCCURRENCE_AMOUNT_REQUIRED`). Date: the given one or `min(due date, today)`. Status:
        the given one or `POSTED`. A resolved occurrence → 409 `OCCURRENCE_ALREADY_MATERIALIZED`; a closed period →
        409 `PERIOD_CLOSED` (edit the due date and approve again).
      x-openspec-capability: [commitments/recurrence-engine]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringMaterializeRequest' }
      responses:
        '201':
          description: Approved occurrence and the transaction created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringMaterializeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'OCCURRENCE_ALREADY_MATERIALIZED, PERIOD_CLOSED, ACCOUNT_CLOSED, INVALID_STATUS_TRANSITION.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'OCCURRENCE_AMOUNT_REQUIRED, RECURRING_INVALID_AMOUNT or CURRENCY_MISMATCH.'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

