      - $ref: '#/components/parameters/MatchSuggestionId'
    post:
      tags: [Commitments]
      operationId: confirmMatchSuggestion
      summary: Confirm a suggestion (links the occurrence with the transaction)
      description: |
        Links the occurrence with the transaction with the same rules as the manual link (`matchedBy = SUGGESTION`),
        marks the suggestion `CONFIRMED` and expires (`SUPERSEDED`) the other proposed suggestions of that occurrence and
        of that transaction, in one unit of work. A suggestion that is no longer proposed → 409
        `MATCH_SUGGESTION_NOT_PENDING`; `OCCURRENCE_ALREADY_MATERIALIZED`, `TRANSACTION_ALREADY_LINKED` and
