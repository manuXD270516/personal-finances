      description: |
        Same structure as the public `ReconciliationStatusQuery.getCoverage`. The account is reconciled at the cut-off
        (`asOf`, default today in the workspace time zone) only if it has no `posted` or `cleared` transactions dated on
        or before it and either a completed statement dated on or after it, or a transaction reconciled without a
