        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Planning]
      operationId: publishTemplateVersion
      summary: Publish a new version of a template (full snapshot of its lines)
      description: |
        Every version is an immutable, complete snapshot. `baseVersionNo` must be the current version
        (`CONCURRENCY_CONFLICT` otherwise, nothing is created). Lines identical to those of the base version are kept
        even if their target was archived meanwhile; new or changed lines on archived targets are rejected.
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateVersionCreate' }
      responses:
        '201':
          description: Template with its new current version
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'CONCURRENCY_CONFLICT (baseVersionNo is not the current version), BUDGET_TEMPLATE_ARCHIVED, BUDGET_LINE_DUPLICATE_TARGET, BUDGET_TARGET_OVERLAP or CATEGORY_ARCHIVED / TAG_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BUDGET_INVALID_AMOUNTS, BUDGET_INVALID_LINE_KIND, BUDGET_THRESHOLD_INVALID, CURRENCY_MISMATCH, AMOUNT_SCALE_EXCEEDED, REFERENCE_NOT_FOUND or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}/clone:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Planning]
      operationId: cloneTemplate
      summary: Clone a version of a template as a new independent template
      description: |
        The clone has its own version 1 with the lines of the chosen version (default: the current one) and no link to
        the original afterwards.
