    post:
      tags: [Debt]
      operationId: cancelLoan
      summary: Cancel a draft or an active loan without payments
      description: |
        A draft has no accounting effects. An active loan without active payments voids its disbursement (reversal entry) and ends its commitment. With active payments: 409 `LOAN_HAS_PAYMENTS`.
      x-openspec-capability: [debt/loans]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelInput' }
      responses:
        '200':
          description: Cancel a draft or an active loan without payments
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'LOAN_HAS_PAYMENTS, INVALID_STATUS_TRANSITION or PERIOD_CLOSED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            VALIDATION_FAILED.
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/loans/{loanId}/installments:
