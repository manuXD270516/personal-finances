      summary: Poll a long-running operation (202 + operation pattern)
      description: |
        Asynchronous operations (`202 + Location`, docs/10 §8). Phase 2 has a single kind, `EXPORT` (the workspace
        export of `identity/workspace-portability`, created by `requestWorkspaceExport`): `PENDING → RUNNING → SUCCEEDED |
        FAILED`, with `progressPct`, the `result` (`exportId`, `expiresAt`) or the failure as a problem. OWNER only
        (the same role that requests and downloads the export).
      x-openspec-capability: [platform/api-conventions, identity/workspace-portability]
      x-required-role: OWNER
      responses:
