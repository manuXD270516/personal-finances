        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── Debt: préstamos (openspec add-loans) ──
  /workspaces/{workspaceId}/loans:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Debt]
      operationId: listLoans
      summary: List the loans of the workspace
      description: |
        Newest first. Without `status` every status is returned. `status` accepts a comma separated list of `DRAFT`, `ACTIVE`, `PAID_OFF` and `CANCELLED`.
      x-openspec-capability: [debt/loans]
      x-required-role: VIEWER
      parameters:
        - name: status
          in: query
          schema: { type: string, examples: ['ACTIVE,PAID_OFF'] }
      responses:
        '200':
          description: List the loans of the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Debt]
      operationId: registerLoan
      summary: Register a loan (new in draft, or ongoing and active)
      description: |
        A new loan (`origin = NEW`, default) is stored as a draft with the preview of its French schedule and no ledger entry; `disburseNow`
        disburses it in the same unit of work. An ongoing loan (`origin = EXISTING`) declares the outstanding principal (`principal`) at
        `existing.asOf`, the number of the next installment and the remaining installments (`termInstallments`): it is created active with its
        schedule version 1 and its installment commitment, without a disbursement transaction. The loan account is an existing active `loan`
        account or is created in the same act (`account.create`). Amortization methods other than `FRENCH` answer 422
        `LOAN_METHOD_NOT_AVAILABLE`.
      x-openspec-capability: [debt/loans]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanInput' }
      responses:
        '201':
          description: Register a loan (new in draft, or ongoing and active)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'LOAN_ACCOUNT_IN_USE, LOAN_ACCOUNT_NOT_EMPTY, COUNTERPARTY_ARCHIVED, ACCOUNT_ARCHIVED, ACCOUNT_CLOSED or PERIOD_CLOSED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            VALIDATION_FAILED, AMOUNT_SCALE_EXCEEDED, LOAN_METHOD_NOT_AVAILABLE, LOAN_ACCOUNT_INVALID, LOAN_BALANCE_MISMATCH, CURRENCY_MISMATCH, REFERENCE_NOT_FOUND or IDEMPOTENCY_KEY_REUSED.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/loans/schedule-preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Debt]
      operationId: previewLoanSchedule
      summary: Preview the schedule of some loan terms without saving anything
      description: |
        Same calculator and rules as the schedule fixed on activation (`debt/amortization`): HALF_EVEN per component and the last installment absorbs the residue. Persists nothing; accounts are not required.
      x-openspec-capability: [debt/amortization]
      x-required-role: VIEWER
      x-rate-limit: costly
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanPreviewInput' }
      responses:
