  # ───────────────────────────── Commitments: motor de recurrencia (Phase 3, add-recurrence-engine) ─────────────────────────────
  /workspaces/{workspaceId}/recurring:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Commitments]
      operationId: listRecurringDefinitions
      summary: List the recurring definitions of the workspace
      description: |
        Definitions ordered by name. Each item carries its current version, the next unresolved occurrence and the number
        of occurrences waiting for approval (`pendingApprovalCount`).
      x-openspec-capability: [commitments/recurrence-engine]
      x-required-role: VIEWER
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RecurringStatus' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/RecurringKind' }
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Definitions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringDefinitionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Commitments]
      operationId: createRecurringDefinition
      summary: Create a recurring definition (income, expense or transfer)
      description: |
        Creates version 1 and generates synchronously the occurrences of the first window (from the start of the
        financial period that contains today, or the start date if later, up to today + the generation horizon).
        `LOAN_PAYMENT` and `CARD_PAYMENT` are reserved for Phase 4 → 422 `RECURRING_KIND_NOT_AVAILABLE` (a card payment
        is a `TRANSFER` to the liability account today). The currency is the account currency; a transfer uses one
        currency. `AUTO_CREATE` needs a `FIXED` or `ESTIMATED` amount.
      x-openspec-capability: [commitments/recurrence-engine]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringDefinitionInput' }
      responses:
        '201':
          description: Created definition (with `generatedCount`)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_CLOSED, ACCOUNT_ARCHIVED, CATEGORY_ARCHIVED, COUNTERPARTY_ARCHIVED or TAG_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            RECURRING_KIND_NOT_AVAILABLE, RECURRING_INVALID_SCHEDULE, INVALID_RRULE, RECURRING_INVALID_AMOUNT,
            RECURRING_MODE_NOT_ALLOWED, CURRENCY_MISMATCH, TRANSFER_CURRENCY_MISMATCH, TRANSFER_SAME_ACCOUNT,
            CATEGORY_KIND_MISMATCH or REFERENCE_NOT_FOUND.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/recurring/committed:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Commitments]
      operationId: getCommittedAmount
      summary: Committed amount of a financial period (Q4)
      description: |
        Unresolved expense occurrences (and transfers from a liquid to a non-liquid account) plus pending expense
        transactions whose date falls in the period, without double counting; by currency and consolidated into the base
        currency with the same valuation as the Home (never 1:1 without a rate: the result is then `complete = false`).
