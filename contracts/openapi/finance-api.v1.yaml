        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Reporting ─────────────────────────────
  /workspaces/{workspaceId}/reports/summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reporting]
      operationId: getReportSummary
      summary: Basic dashboard KPIs for a period (income, expenses, net, balances, top expense and income categories)
      description: |
        In Phase 1 the summary is computed from the source of truth (ledger + posted transactions), without read
        models. Figures are reported per currency (`byCurrency`) and consolidated in `reportingCurrency`: the
        consolidated block is always present; when a rate is missing for some currency it has `complete=false` and
        the excluded native amounts are listed in `unconverted[]` (never invented). Stocks (balances, net worth) are
        valued at the query date; flows (income, expense) at the rate of their own date. `meta.approx` is true when
        any consolidated figure uses reference or cross rates.
      x-openspec-capability: [reporting/dashboard, reporting/net-worth]
      x-required-role: VIEWER
      parameters:
        - name: month
          in: query
          description: Calendar month `YYYY-MM`. Mutually exclusive with dateFrom/dateTo. Defaults to the current month.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: dateFrom
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: dateTo
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: reportingCurrency
          in: query
          description: Defaults to the workspace base currency
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: topCategories
          in: query
          schema: { type: integer, minimum: 0, maximum: 20, default: 5 }
        - name: compare
          in: query
          description: Comparison period. `PREVIOUS_PERIOD_TO_DATE` compares with the same number of elapsed days of the previous period.
          schema:
            type: string
            enum: [PREVIOUS_PERIOD_TO_DATE, PREVIOUS_PERIOD, NONE]
            default: PREVIOUS_PERIOD_TO_DATE
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Summary
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CURRENCY_NOT_ENABLED (reportingCurrency).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reports/net-worth/history:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reporting]
      operationId: getNetWorthHistory
      summary: Net worth evolution by financial period (assets, liabilities and net worth at the end of each period)
      description: |
        One point per monthly financial period (`planning/financial-periods`) of the requested range, cut at the end
        of the period (with start day 1, the last day of the month); the period containing today is computed at
        today's date in the workspace time zone and flagged `partial`. Balances are the ledger balances at each cut
        date (including accounts archived or closed since) of the accounts included in net worth (the CURRENT
        `includeInNetWorth` flag applies to every computed point; closed periods use the value frozen in their
        closing snapshot). Each point is valued with the rate in force at its own cut date, with the same selector
        and validity window as `/reports/summary` (REPORTING_RATE_VALIDITY_WINDOW), never with today's rate; a
        currency without a rate in the window leaves the point `complete=false` and its native amount in
        `unconverted[]` (never 1:1). A closed period with a closing snapshot in `reportingCurrency` reports the
        snapshot figures (`source=SNAPSHOT`, `closed=true`); otherwise the point is `COMPUTED`. `change` is the
        difference of the net worth with the previous point of the series (`null` on the first one) and
        `comparable=false` when either point is incomplete. Defaults to the last 12 periods ending at the current
        one; at most 120 months.
      x-openspec-capability: [reporting/net-worth]
      x-required-role: VIEWER
      parameters:
        - name: from
          in: query
          description: First period label `YYYY-MM` (start month of the period). Defaults to 11 months before `to`.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: to
          in: query
          description: Last period label `YYYY-MM`; not after the current period. Defaults to the current period.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: reportingCurrency
          in: query
          description: Defaults to the workspace base currency
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Series
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetWorthHistory' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'VALIDATION_FAILED (future periods, inverted range or more than 120 months).'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CURRENCY_NOT_ENABLED (reportingCurrency).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reports/upcoming-payments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reporting]
      operationId: getUpcomingPayments
      summary: Upcoming payments (simple Phase 3 cash-flow view) with the committed total of the period and projected balances
      description: |
        Answers Home questions Q8 ("which payments are coming?") and Q4 ("how much is committed?") from the source of
        truth, without read models (read-your-writes): the unresolved expense occurrences that Commitments reports
        (`SCHEDULED`, `DUE`, `OVERDUE`; also transfers from a liquid account to a non-liquid one) plus the `PENDING`
        expense transactions, ordered by date and name, without double counting (an occurrence materialized as a pending
        transaction is listed once, as the transaction with its real amount). `days` (default 30, 1 to 90, both ends
        included) counts from today in the workspace time zone; unresolved occurrences older than today are always
        listed first, marked `OVERDUE` with `daysOverdue`. Amounts follow the amount type: `FIXED` exact, `ESTIMATED`
        flagged, `MIN_MAX` with the range and the maximum in the totals, `VARIABLE` without amount and excluded from the
        totals (`withoutAmountCount`; never 0). Totals are reported per currency and consolidated in
        `reportingCurrency` with the rate in force when the query runs (one conversion per currency; no rate within
        `REPORTING_RATE_VALIDITY_WINDOW` means `complete=false`, never 1:1); HALF_EVEN only when presenting.
        `committed` is the committed total of the financial period that contains today (Commitments plus pending
        expenses), with unresolved occurrences overdue from previous periods reported apart (they do not add up);
        `null` when no period covers today. `projectedBalances` is each non-archived account booked balance plus
        pending income minus pending expenses (FR-LEDGER-013); it does not subtract unmaterialized occurrences.
      x-openspec-capability: [reporting/cash-flow-calendar]
      x-required-role: VIEWER
      parameters:
        - name: days
          in: query
          description: Window in days from today, 1 to 90 (otherwise `INVALID_FILTER`). Defaults to 30.
          schema: { type: integer, default: 30 }
        - name: reportingCurrency
          in: query
          description: Defaults to the workspace base currency
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Upcoming payments
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpcomingPayments' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'VALIDATION_FAILED, INVALID_FILTER (days outside 1 to 90).'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CURRENCY_NOT_ENABLED (reportingCurrency).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/reports/surprise-payments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reporting]
      operationId: getSurprisePayments
      summary: Surprise payments of a financial period (SM-07)
      description: |
        Non-voided expense transactions dated in the period that resolved a recurring occurrence (materialized or linked)
        whose generation happened on the same day as the transaction or later, in the workspace time zone: they were not
        in the upcoming list before being paid. Skipped occurrences do not count; a voided transaction frees its
        occurrence and stops counting. A period that has not ended is `partial`. Payments not linked to any commitment
        are not detected (`note`).
      x-openspec-capability: [reporting/cash-flow-calendar]
      x-required-role: VIEWER
      parameters:
        - name: period
          in: query
          description: Financial period label `YYYY-MM` (start month). Defaults to the period that contains today.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Surprise payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurprisePayments' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'RESOURCE_NOT_FOUND (the period does not exist).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Planning (Phase 2) ─────────────────────────────
  /workspaces/{workspaceId}/periods:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Planning]
      operationId: listPeriods
      summary: List the financial periods of the workspace (newest first)
      description: |
        Monthly financial periods computed from the workspace financial month start day (1–28): inclusive business
        date ranges labelled `YYYY-MM` after their start month. `pendingClosure` is derived from today in the workspace
        time zone (ended and not closed). With `containsDate` the page holds the single period that contains that
        business date, or the answer is 404 `RESOURCE_NOT_FOUND` when no period covers it.
      x-openspec-capability: [planning/financial-periods]
      x-required-role: VIEWER
      parameters:
        - name: status
          in: query
          description: Filter by status (repeatable). Mutually exclusive with `containsDate`.
          schema:
            type: array
            items: { $ref: '#/components/schemas/FinancialPeriodStatus' }
          style: form
          explode: true
        - name: containsDate
          in: query
          description: Business date (`YYYY-MM-DD`) whose period is requested. Mutually exclusive with `status`.
          schema: { $ref: '#/components/schemas/LocalDate' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Page size (default 24 periods)
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Periods page, ordered by `periodStart` descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialPeriodPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'RESOURCE_NOT_FOUND (no period contains `containsDate`).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Planning]
      operationId: ensurePeriods
      summary: Ensure that the financial periods up to a date exist (idempotent)
      description: |
        Creates the missing periods up to the one that contains `through` (at most today + 24 months in the workspace
        time zone) with the same idempotent result as the automatic hourly process: periods that already started are
        created `ACTIVE`, future ones `DRAFT`. Repeating the request creates nothing. Returns the periods from the one
        that contains today up to the one that contains `through`.
      x-openspec-capability: [planning/financial-periods]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsurePeriodsRequest' }
      responses:
        '200':
          description: Periods of the requested range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialPeriodList' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'VALIDATION_FAILED (`through` later than today + 24 months).'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    get:
      tags: [Planning]
      operationId: getPeriod
      summary: Get a financial period
      x-openspec-capability: [planning/financial-periods]
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Financial period
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialPeriod' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/activate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    post:
      tags: [Planning]
      operationId: activatePeriod
      summary: Activate a DRAFT period whose start date has arrived in the workspace time zone
      description: |
        Manual activation (the hourly process activates periods automatically). A period whose start date is after
        today in the workspace time zone → 409 `PERIOD_NOT_STARTED`; a period that is not `DRAFT` → 409
        `INVALID_STATUS_TRANSITION`. Publishes `planning.PeriodActivated.v1` (`activation = MANUAL`).
      x-openspec-capability: [planning/financial-periods]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Activated period
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'PERIOD_NOT_STARTED (start date after today) or INVALID_STATUS_TRANSITION (not DRAFT).'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Planning: cierre de mes (Phase 2, add-month-closing) ─────────────────────────────
  /workspaces/{workspaceId}/periods/{periodId}/close-checklist:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    get:
      tags: [Planning]
      operationId: getCloseChecklist
      summary: Pre-close checklist of a period (no side effects)
      description: |
        Items: `PENDING_TRANSACTIONS`, `UNRECONCILED_ACCOUNTS`, `UNRESOLVED_DUPLICATES`, `UNCATEGORIZED`,
        `UNRESOLVED_RECURRING` (`NOT_AVAILABLE` until Phase 3) and the informational `RECONCILED_WITHOUT_STATEMENT`
        (severity `INFO`: never blocks nor requires acknowledgement). Severity of the first five comes from the closing
        policy of the workspace. Consulting it changes nothing and writes no audit entry.
      x-openspec-capability: [planning/month-closing]
      x-required-role: VIEWER
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseChecklist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/close:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    post:
      tags: [Planning]
      operationId: closePeriod
      summary: 'Close a finished period (atomic: state, ledger lock, snapshot, audit, lifecycle, event)'
      description: |
        Only `active`/`reopened` periods that already ended in the workspace time zone (`PERIOD_NOT_ENDED`), in
        chronological order (`PERIOD_PREVIOUS_NOT_CLOSED`), without blocking checklist items
        (`MONTH_CLOSING_BLOCKED`, extension `blockingItems`) and with the warnings explicitly acknowledged
        (`MONTH_CLOSING_WARNINGS_NOT_ACKNOWLEDGED`, extension `warningItems`). In ONE transaction: period `closed`,
        ledger range locked (the first closed period also protects every earlier date), immutable snapshot version
        `closeCount`, audit, lifecycle transition and `planning.MonthClosed.v1`. Responds with the period and the
        `Location` of the snapshot.
      x-openspec-capability: [planning/month-closing]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePeriodRequest' }
      responses:
        '200':
          description: Closed period
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location:
              description: URL of the snapshot just created
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: >-
            MONTH_CLOSING_BLOCKED, MONTH_CLOSING_WARNINGS_NOT_ACKNOWLEDGED, PERIOD_NOT_ENDED,
            PERIOD_PREVIOUS_NOT_CLOSED or INVALID_STATUS_TRANSITION (draft or already closed).
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/reopen:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    post:
      tags: [Planning]
      operationId: reopenPeriod
      summary: Reopen a closed period (OWNER only, with a reason, in reverse order)
      description: |
        Moves the period to `reopened`, removes its ledger lock, audits the reason, records the transition and publishes
        `planning.PeriodReopened.v1` in one transaction. No snapshot is ever modified; closing again creates version n+1.
        The next period closed → 409 `PERIOD_NEXT_CLOSED` (no cascade).
      x-openspec-capability: [planning/month-closing]
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenPeriodRequest' }
      responses:
        '200':
          description: Reopened period
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'PERIOD_NEXT_CLOSED or INVALID_STATUS_TRANSITION (not closed).'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/close-snapshots:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    get:
      tags: [Planning]
      operationId: listCloseSnapshots
      summary: Versions of the close snapshot of a period (oldest first)
      x-openspec-capability: [planning/month-closing]
      x-required-role: VIEWER
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CloseSnapshotSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/close-snapshots/compare:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    get:
      tags: [Planning]
      operationId: compareCloseSnapshots
      summary: Compare two versions of the close snapshot (`to` minus `from`)
      x-openspec-capability: [planning/month-closing]
      x-required-role: VIEWER
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Differences by account, totals and net worth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseSnapshotDiff' }
