          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Edit a transaction
      description: |
        Classification-only changes (description, notes, counterparty, split categories/tags) never touch the ledger.
        Changes to amount, account, date or split amounts on a posted transaction create a reversal entry plus a
        new entry (revision + 1). `splits`, when present, replaces the whole split list. Conversions and transfers
        cannot change kind; conversion pricing is immutable (void and re-create).
      x-openspec-capability: [transactions/transaction-recording, transactions/splits]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated transaction
          headers:
