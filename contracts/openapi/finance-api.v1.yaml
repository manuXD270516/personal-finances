      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description:
          oneOf:
            - { type: string }
            - type: 'null'
        isDefault: { type: boolean }
        status: { $ref: '#/components/schemas/TemplateStatus' }
        currentVersionNo: { type: integer, minimum: 1 }
        lineCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Instant' }
    Template:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - isDefault
        - status
        - currentVersionNo
        - lineCount
        - version
        - createdAt
        - currentVersion
        - versions
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description:
          oneOf:
