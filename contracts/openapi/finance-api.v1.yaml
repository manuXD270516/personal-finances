openapi: 3.1.0
# DRAFT — Phase 0 (DESIGN GATE). Contract-first source of truth for finance-api HTTP surface.
# Conventions: docs/10-api-design.md · Canonical decisions: docs/ARCHITECTURE.md §8 · ADR-0022
info:
  title: PFOS finance-api
  version: 1.0.0-draft.2
  summary: Personal Finance Operating System — REST API v1 (draft)
  description: |
    REST API of the Personal Finance Operating System (PFOS).

    * All business resources live under `/workspaces/{workspaceId}`.
    * Money is always `{ "amount": "<decimal string>", "currency": "<code>" }`. Never JSON numbers.
    * Business dates are `YYYY-MM-DD` (workspace timezone); instants are RFC 3339 UTC with `Z` suffix.
    * Errors are RFC 9457 `application/problem+json` with a stable domain `code` and a `requestId`.
    * Financial `POST` operations require `Idempotency-Key` (missing → 428 `IDEMPOTENCY_KEY_REQUIRED`; reused with a
      different payload → 422 `IDEMPOTENCY_KEY_REUSED`); updates and actions on existing aggregates require `If-Match`.
    * Every operation declares `x-openspec-capability` (OpenSpec taxonomy, ARCHITECTURE §14) and `x-required-role`.
    * Insufficient role → 403 `INSUFFICIENT_ROLE`; not an active member → 403 `WORKSPACE_ACCESS_DENIED`.
    * Deprecated operations answer with `Deprecation` (RFC 9745), `Sunset` (RFC 8594, at least 90 days after the
      announcement) and `Link: <…>; rel="deprecation"`; they are flagged `deprecated: true` with `x-deprecated-at` and `x-sunset` (YYYY-MM-DD).
    * Responses carry `RateLimit` / `RateLimit-Policy` (IETF draft); exceeding the quota returns 429 `RATE_LIMITED`
      with `Retry-After`.

    Only Phase 1 paths are specified. Later-phase resources are listed as tags (description only).
    Phase 1 consolidation: 2026-10-02 (docs/31-phase-1-consolidation-decisions.md).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: PFOS owner
servers:
  - url: /api/v1
    description: Relative base path (served behind the finance-web BFF)
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Current user and workspaces (identity/authentication, identity/workspace-membership). Phase 1.
  - name: Accounts
    description: User accounts (ASSET/LIABILITY) and institutions. Phase 1.
  - name: Transactions
    description: Transactions with legs and splits, transfers and conversions. Phase 1.
  - name: Classification
    description: Categories, category groups, tags and counterparties. Phase 1.
  - name: FX
    description: Currency catalog, manual historical fx-rates and per-pair preferred rate type (Phase 1). Providers in Phase 5.
  - name: Ledger
    description: Read-only views of the internal double-entry ledger (Phase 1, trial balance).
  - name: Audit
    description: "Phase 1: read-only audit log (history by entity and by date range) and session login/logout auditing."
  - name: Reporting
    description: Basic dashboard KPIs (Phase 1). Advanced reports in Phase 7 (see docs/14-reporting.md).
  - name: Platform
    description: Cross-cutting resources such as long-running operations (202 + operation pattern).
  - name: Members
    description: "LATER (Phase 9): workspace members and invitations."
  - name: Reconciliation
    description: "LATER (Phase 2): account reconciliations against statements; bulk edit of classification."
  - name: CustomFields
    description: "LATER (Phase 2): custom field definitions and values on splits."
  - name: Planning
    description: "Phase 2: financial periods, monthly plan, budgets, templates and month closing."
  - name: Notifications
    description: "LATER (Phase 2): in-app/email notifications and preferences."
  - name: Commitments
    description: "LATER (Phase 3): recurring definitions, occurrences and subscriptions."
  - name: Goals
    description: "LATER (Phase 4): savings goals and contributions (transfer or earmark)."
  - name: Debt
    description: "LATER (Phase 4): loans, amortization schedules, installments, credit cards and statements."
  - name: FxRates
    description: "Phase 1 (docs/31 D29, ADR-0025): market rate providers (paralelo.bo primary, bo.dolarapi.com fallback/official), provider status and anomaly review. Manual rates are under FX. More providers, crypto and commodities: Phase 5."
  - name: Documents
    description: "LATER (Phase 6): documents, presigned uploads/downloads and attachment links."
  - name: Imports
    description: "LATER (Phase 6, basic CSV may move to Phase 3): import jobs, staged rows, mapping profiles, connections."
  - name: Rules
    description: "LATER (Phase 6): rules engine (conditions/actions)."
  - name: Forecasts
    description: "LATER (Phase 8): statistical forecasts (async)."
  - name: Assistant
    description: "LATER (Phase 10): read-only AI assistant."

paths:
  # ───────────────────────────── Identity ─────────────────────────────
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Get the authenticated user and their workspace memberships
      x-openspec-capability: identity/authentication
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Identity]
      operationId: updateMe
      summary: Update the authenticated user's profile and preferences
      x-openspec-capability: identity/authentication
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Updated user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'INVALID_TIMEZONE (timezone is not a valid IANA zone).'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/session-events:
    post:
      tags: [Audit]
      operationId: recordSessionEvent
      summary: Audit a login or logout of the caller's BFF session (FR-AUDIT-005)
      description: |
        Called by the finance-web BFF right after a successful login (`STARTED`) and on logout (`ENDED`). The record is
        written in `workspaceId` when the caller is an active member of it, otherwise in the caller's oldest active
        workspace; without any workspace nothing is recorded. User agent and client IP (stored only as an HMAC) come
        from the forwarded request; tokens and cookies are never recorded.
      x-openspec-capability: audit/audit-trail
      x-required-role: AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionEvent' }
      responses:
        '204':
          description: Session event audited (or skipped when the user has no workspace)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces:
    get:
      tags: [Identity]
      operationId: listWorkspaces
      summary: List workspaces where the user is an active member
      x-openspec-capability: identity/workspace-membership
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Workspaces page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Identity]
      operationId: createWorkspace
      summary: Create a workspace (caller becomes OWNER)
      description: |
        The caller becomes OWNER. System categories (and, when `seedDefaultCategories` is true, the default catalog)
        are seeded asynchronously by Classification when it consumes `identity.WorkspaceCreated.v1`; ledger system
        accounts are created on demand at the first posting.
      x-openspec-capability: identity/workspace-membership
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
      responses:
        '201':
          description: Workspace created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Identity]
      operationId: getWorkspace
      summary: Get a workspace
      x-openspec-capability: identity/workspace-membership
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Workspace
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Identity]
      operationId: updateWorkspace
      summary: Update workspace settings (name, timezone, locale, base currency, fiscal month start, liquidity reserve)
      x-openspec-capability: identity/workspace-membership
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdate' }
      responses:
        '200':
          description: Updated workspace
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ─────────────────────── Identity: datos de demostración (add-demo-data, ADR-0026) ───────────────────────
  /workspaces/{workspaceId}/demo-data:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Identity]
      operationId: requestDemoData
      summary: Load demo data into a NEW dedicated demo workspace (owner action, asynchronous)
      description: |
        Creates a dedicated demo workspace (`isDemo = true`, immutable) whose only member is the caller (OWNER) and
        enqueues the asynchronous load of the versioned Demo dataset (docs/29) anchored at "today" in the workspace
        time zone. The current workspace is only the ORIGIN (where the action is audited): no data is ever written into
        it. Disabled by environment ⇒ 403 `DEMO_DATA_DISABLED`; a non-purged demo of the caller already exists ⇒ 409
        `DEMO_WORKSPACE_ALREADY_EXISTS`.
      x-openspec-capability: identity/demo-data
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Demo workspace created; load in progress (`LOADING`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoDataStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Identity]
      operationId: getDemoDataStatus
      summary: Demo data status (on a demo workspace, or the caller's latest demo requested from a real workspace)
      description: |
        On a demo workspace (any member; also while it is being cleaned) returns its load. On a real workspace returns
        the latest demo the caller requested from it (404 if none). `status = PURGED` means it was fully removed.
      x-openspec-capability: identity/demo-data
      x-required-role: VIEWER
      responses:
        '200':
          description: Demo data status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoDataStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/demo-data/cleanup:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Identity]
      operationId: cleanupDemoData
      summary: Clean up a demo workspace (immediate archive + asynchronous full purge)
      description: |
        Only on a demo workspace (`WORKSPACE_NOT_DEMO` otherwise). The demo workspace is archived immediately: it is
        no longer listed and every other route answers as if it did not exist; its physical purge is enqueued. Safe to
        repeat while it is being cleaned (202 without further effects). A demo still `LOADING` ⇒ 409
        `INVALID_STATUS_TRANSITION`.
      x-openspec-capability: identity/demo-data
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Demo workspace archived; purge enqueued (`CLEANING`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoDataStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Accounts ─────────────────────────────
  /workspaces/{workspaceId}/accounts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts with current balances
      x-openspec-capability: accounts/account-management
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: type
          in: query
          description: Filter by account type (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountType' }
          style: form
          explode: true
        - name: currency
          in: query
          description: Filter by currency code (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/CurrencyCode' }
          style: form
          explode: true
        - name: institutionId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: status
          in: query
          description: Filter by status (repeatable). Default `ACTIVE` and `CLOSED` (ARCHIVED only with `includeArchived=true` or an explicit `status=ARCHIVED`).
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountStatus' }
          style: form
          explode: true
        - name: tagId
          in: query
          description: Accounts carrying this tag
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: liquidity
          in: query
          description: Filter by liquidity (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountLiquidity' }
          style: form
          explode: true
        - name: sort
          in: query
          description: Sort keys. Default `displayOrder` (manual order).
          schema:
            type: string
            enum: [displayOrder, name, -name, type, institution, createdAt, -createdAt]
            default: displayOrder
        - name: groupBy
          in: query
          description: When present, the page also returns `groups` (account ids grouped by type or institution).
          schema:
            type: string
            enum: [type, institution]
      responses:
        '200':
          description: Accounts page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account (optionally with an opening balance, which posts an OPENING_BALANCE transaction)
      x-openspec-capability: [accounts/account-management, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_NAME_TAKEN, INSTITUTION_ARCHIVED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CURRENCY_NOT_ENABLED, ACCOUNT_CURRENCY_KIND_MISMATCH, AMOUNT_SCALE_EXCEEDED, REFERENCE_NOT_FOUND, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/order:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [Accounts]
      operationId: reorderAccounts
      summary: Set the manual display order of the accounts
      description: The listed accounts receive `displayOrder` 0..n-1 in the given order; accounts not listed keep their relative order after them.
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountOrder' }
      responses:
        '204':
          description: Order saved
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'REFERENCE_NOT_FOUND (an id is not an account of this workspace).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account with balances
      x-openspec-capability: accounts/account-management
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update account attributes (type is immutable; currency only while the account has no movements)
      description: |
        `type` cannot be changed (`additionalProperties: false` ⇒ 400 VALIDATION_FAILED). `currency` can change only
        while the account has no transactions or journal postings (otherwise 409 ACCOUNT_CURRENCY_IMMUTABLE).
        Closing uses `closeAccount`.
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_CURRENCY_IMMUTABLE, ACCOUNT_NAME_TAKEN, ACCOUNT_ARCHIVED, INSTITUTION_ARCHIVED, CONCURRENCY_CONFLICT.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/{accountId}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccountLifecycle
      summary: Recorrido de una cuenta (apertura, cierre, archivo, reactivación y anotaciones)
      description: |
        Recorrido de la cuenta (docs/31 D37) con la máquina `Account`; la apertura enlaza el asiento del saldo
        inicial. VIEWER+; otro workspace ⇒ 404 idéntico a inexistente.
      x-openspec-capability: audit/lifecycle-timeline
      x-required-role: VIEWER
      responses:
        '200':
          description: Recorrido de la cuenta
          content:
