        `key` is `snake_case`, unique among active definitions and immutable. A `SELECT` needs at least one option; other
        types accept no options. At most 50 active definitions per workspace. Emits
        `classification.CustomFieldDefinitionChanged.v1`.
      x-openspec-capability: classification/custom-fields
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldDefinitionCreate' }
            examples:
              costCenter:
                summary: Cost center of the transactions
                value:
                  key: centro_costo
                  label: Centro de costo
                  dataType: SELECT
                  target: TRANSACTION
                  required: false
                  options:
                    - { key: casa, label: Casa }
                    - { key: oficina, label: Oficina }
      responses:
        '201':
          description: Custom field defined
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'CUSTOM_FIELD_KEY_TAKEN (an active definition uses the key).'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/custom-fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/CustomFieldId'
    get:
      tags: [Classification]
      operationId: getCustomField
      summary: Get a custom field definition
      x-openspec-capability: classification/custom-fields
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Custom field definition
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldDefinition' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Classification]
      operationId: updateCustomField
      summary: Edit a custom field definition
      description: |
        `key` cannot change (not accepted ⇒ 400 VALIDATION_FAILED). While the definition has values its `dataType` and
        `target` are locked (`CUSTOM_FIELD_TYPE_LOCKED`) and an option in use cannot be removed
        (`CUSTOM_FIELD_OPTION_IN_USE`); adding options and renaming labels is always allowed. `options`, when present,
        replaces the whole list (its order sets the position). An archived definition cannot be edited.
      x-openspec-capability: classification/custom-fields
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CustomFieldDefinitionUpdate' }
      responses:
        '200':
          description: Updated custom field definition
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'CUSTOM_FIELD_TYPE_LOCKED, CUSTOM_FIELD_OPTION_IN_USE, CUSTOM_FIELD_ARCHIVED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/custom-fields/{fieldId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/CustomFieldId'
    post:
      tags: [Classification]
      operationId: archiveCustomField
      summary: Archive a custom field definition
      description: |
        Archiving never deletes values: transactions and accounts keep showing them. The definition leaves the forms,
        accepts no new values (`CUSTOM_FIELD_ARCHIVED`) and its key becomes free for a new active definition.
      x-openspec-capability: classification/custom-fields
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived custom field definition
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (already archived).'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/custom-fields/{fieldId}/unarchive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/CustomFieldId'
    post:
      tags: [Classification]
      operationId: unarchiveCustomField
      summary: Unarchive a custom field definition
