      properties:
        templateId: { $ref: '#/components/schemas/Uuid' }
        versionNo: { type: integer, minimum: 1 }
        name: { type: string }
    TemplateLine:
      type: object
      description: Line of an immutable template version; same shape and rules as a plan line, without spent or rollover received.
      additionalProperties: false
      required:
        - id
