        - nature
        - kind
        - planned
        - min
        - max
        - percent
        - incomeBasis
        - rolloverPolicy
        - rolloverCap
        - thresholds
        - currency
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        target: { $ref: '#/components/schemas/BudgetLineTarget' }
        nature: { $ref: '#/components/schemas/BudgetNature' }
        kind: { $ref: '#/components/schemas/BudgetLineKind' }
        planned:
