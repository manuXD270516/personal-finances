          application/json:
            schema: { $ref: '#/components/schemas/DuplicateCheckRequest' }
      responses:
        '200':
          description: Duplicate candidates (possibly empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateCheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'REFERENCE_NOT_FOUND, CURRENCY_MISMATCH, AMOUNT_SCALE_EXCEEDED.'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction (legs, splits and conversion detail inline)
      x-openspec-capability: transactions/transaction-recording
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Transaction
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Edit a transaction
      description: |
        Classification-only changes (description, notes, counterparty, split categories/tags) never touch the ledger.
        Changes to amount, account, date or split amounts on a posted transaction create a reversal entry plus a
        new entry (revision + 1). `splits`, when present, replaces the whole split list. Conversions and transfers
        cannot change kind; conversions are amended with `amendConversion`. A RECONCILED transaction must be
        un-reconciled (`unreconcileTransaction`) before any financial change. `status` changes (POSTED↔CLEARED,
        CLEARED→RECONCILED) cannot be combined with financial fields (VALIDATION_FAILED). Marking a transaction
        RECONCILED directly requires the explicit `reconciliationMode: WITHOUT_STATEMENT` (docs/33 D74; without it
        VALIDATION_FAILED); `STATEMENT` is only reached by completing a reconciliation session. Clearing, un-clearing
        and reconciling a transaction dated in a closed period → 409 `PERIOD_CLOSED`. `systemFlags` is read-only and
        rejected in the request (VALIDATION_FAILED).
      x-openspec-capability: [transactions/transaction-recording, transactions/splits, transactions/reconciliation]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated transaction
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'TRANSACTION_RECONCILED, INVALID_STATUS_TRANSITION, ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, CATEGORY_ARCHIVED, CUSTOM_FIELD_ARCHIVED, PERIOD_CLOSED (also when changing custom field values of a transaction in a closed period, and when clearing, un-clearing or reconciling one), CONCURRENCY_CONFLICT.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CUSTOM_FIELD_VALUE_INVALID, CUSTOM_FIELD_REQUIRED (when editing custom fields or regenerating the splits), CUSTOM_FIELD_TARGET_MISMATCH, VALIDATION_FAILED, REFERENCE_NOT_FOUND, SPLITS_DO_NOT_SUM.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/{transactionId}/history:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      operationId: getTransactionHistory
      summary: Historial de cambios de una transacción (visible para VIEWER, D28)
      description: |
        Devuelve solo las entradas de auditoría de esta transacción (y de sus splits y asiento vinculado), en orden cronológico.
        A diferencia de `/audit-log` (EDITOR+), lo puede leer todo miembro que pueda ver la transacción, incluido VIEWER.
      x-openspec-capability: transactions/transaction-recording
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Historial de la transacción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/transactions/{transactionId}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      operationId: getTransactionLifecycle
      summary: Recorrido de una transacción (máquina de estados, camino y transiciones; visible para VIEWER)
      description: |
        Recorrido completo (docs/31 D37): estado actual, estados visitados, transiciones y anotaciones en orden con
        actor, instante, motivo, revisión, asientos del ledger y eventos publicados, más la definición de la máquina
        `Transaction` y los montos de cada revisión (transferencias: monto y comisión; conversiones: detalle).
        Lo lee todo miembro que pueda ver la transacción, incluido VIEWER (D28); otro workspace ⇒ 404 idéntico a
        inexistente.
      x-openspec-capability: audit/lifecycle-timeline
      x-required-role: VIEWER
      responses:
        '200':
          description: Recorrido de la transacción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionLifecycle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/transactions/{transactionId}/lifecycle/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      operationId: exportTransactionLifecycle
      summary: Exportar el recorrido de una transacción (CSV o PDF)
      description: |
        Descarga síncrona del recorrido (docs/31 D52); el CSV y el PDF incluyen monto y comisión de cada revisión: `format=csv` (RFC 4180, UTF-8 con BOM, fechas
        es-BO en la zona horaria del workspace, montos como decimal string sin cambios, celdas neutralizadas contra
        CSV injection) o `format=pdf` (título, elemento, camino de estados, línea de tiempo, fecha de generación y zona
        horaria). Mismo alcance que el recorrido: VIEWER+; otro workspace ⇒ 404 idéntico a inexistente. La exportación
        queda auditada (`audit.lifecycle.exported`).
      x-openspec-capability: audit/lifecycle-timeline
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/LifecycleExportFormat'
      responses:
        '200':
          $ref: '#/components/responses/LifecycleExport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/transactions/{transactionId}/void:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: voidTransaction
      summary: Void a transaction (reversal entry; never deleted)
      x-openspec-capability: [transactions/transaction-recording, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidRequest' }
      responses:
        '200':
          description: Voided transaction
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (already VOIDED), TRANSACTION_RECONCILED, ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, PERIOD_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'VALIDATION_FAILED (empty reason), IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/{transactionId}/unreconcile:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: unreconcileTransaction
      summary: Move a RECONCILED transaction back to CLEARED (requires a reason; audited)
      description: |
        Clears the reconciliation mode (and the `RECONCILED_WITHOUT_STATEMENT` flag). When the transaction was
        reconciled in a session, the session stays `COMPLETED` with its result and records the later
        un-reconciliation. A transaction dated in a closed period → 409 `PERIOD_CLOSED`.
      x-openspec-capability: transactions/reconciliation
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnreconcileRequest' }
      responses:
        '200':
          description: Un-reconciled transaction (status CLEARED)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (not RECONCILED), PERIOD_CLOSED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'VALIDATION_FAILED (missing or blank reason).'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/{transactionId}/post:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      operationId: postTransaction
      summary: Move a PENDING transaction to POSTED (creates its journal entry)
      x-openspec-capability: [transactions/transaction-recording, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Posted transaction
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (not PENDING), ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, PERIOD_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transfers:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Transactions]
      operationId: createTransfer
      summary: Transfer between two accounts in the same currency (creates a TRANSFER transaction)
      description: |
        Facade over `Transaction`: the response has `kind=TRANSFER`, one `SOURCE` leg (−(amount + fee)) and one
        `TARGET` leg (+amount) and, when a fee is given, a single split in the system category *Fees* (or the given
        expense category). Cross-currency movements must use `/conversions`: a currency mismatch returns 422
        `TRANSFER_CURRENCY_MISMATCH` with `suggestedOperationId: createConversion`. A credit-card payment is a plain
        transfer ASSET → LIABILITY (kind `TRANSFER`).
      x-openspec-capability: [transactions/transfers, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreate' }
            examples:
              samePeriodTransfer:
                summary: 300.00 BOB from Bank A to Bank B
                value:
                  transactionDate: '2026-10-02'
                  fromAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d01
                  toAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d04
                  amount: { amount: '300.00', currency: BOB }
              transferWithFee:
                summary: 1000.00 BOB with a 10.00 BOB fee charged to the source account
                value:
                  transactionDate: '2026-10-02'
                  fromAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d01
                  toAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d04
                  amount: { amount: '1000.00', currency: BOB }
                  fee:
                    amount: { amount: '10.00', currency: BOB }
              creditCardPayment:
                summary: Credit card payment of 350.00 BOB from Bank A (ASSET → LIABILITY)
                value:
                  transactionDate: '2026-10-02'
                  fromAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d01
                  toAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d05
                  amount: { amount: '350.00', currency: BOB }
                  description: Pago tarjeta
      responses:
        '201':
          description: Transfer recorded
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, CATEGORY_ARCHIVED, PERIOD_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'TRANSFER_SAME_ACCOUNT, TRANSFER_CURRENCY_MISMATCH (with suggestedOperationId), AMOUNT_NOT_POSITIVE, AMOUNT_SCALE_EXCEEDED, CATEGORY_KIND_MISMATCH, REFERENCE_NOT_FOUND, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/conversions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Transactions]
      operationId: listConversions
      summary: List conversions with their immutable pricing detail
      x-openspec-capability: [transactions/conversions, fx/conversion-pricing]
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sourceCurrency
          in: query
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: targetCurrency
          in: query
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: dateFrom
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: dateTo
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [transactionDate, -transactionDate, executedAt, -executedAt]
            default: -transactionDate
      responses:
        '200':
          description: Conversions page (transactions of kind CONVERSION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Transactions]
      operationId: createConversion
      summary: Record a currency/crypto conversion (one journal entry balanced via FX_TRADING accounts)
      x-openspec-capability: [transactions/conversions, fx/conversion-pricing, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionCreate' }
            examples:
              usdtToBob:
                summary: Canonical USDT → BOB P2P conversion (ARCHITECTURE §4.2)
                value:
                  transactionDate: '2026-09-30'
                  sourceAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d02
                  targetAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d01
                  sourceAmount: { amount: '100.000000', currency: USDT }
                  targetAmount: { amount: '685.00', currency: BOB }
                  quotedRate: { base: USDT, quote: BOB, value: '6.90' }
                  fees:
                    - type: PROVIDER
                      amount: { amount: '5.00', currency: BOB }
                  provider: { name: Binance P2P }
                  executedAt: '2026-09-30T18:42:00Z'
              usdtToBtcWithTrxNetworkFee:
                summary: USDT → BTC swap with a provider fee in USDT and a network fee paid in TRX (docs/09 §6.15)
                value:
                  transactionDate: '2026-09-30'
                  sourceAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d02
                  targetAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d06
                  sourceAmount: { amount: '1000.000000', currency: USDT }
                  targetAmount: { amount: '0.01600000', currency: BTC }
                  quotedRate: { base: BTC, quote: USDT, value: '62375' }
                  fees:
                    - type: PROVIDER
                      amount: { amount: '2.000000', currency: USDT }
                    - type: NETWORK
                      amount: { amount: '15.000000', currency: TRX }
                      paidFromAccountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d07
                  executedAt: '2026-09-30T20:10:00Z'
      responses:
        '201':
          description: Conversion recorded
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, PERIOD_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CONVERSION_SAME_CURRENCY, CONVERSION_AMOUNTS_INCONSISTENT, AMOUNT_SCALE_EXCEEDED, AMOUNT_NOT_POSITIVE, CURRENCY_MISMATCH, REFERENCE_NOT_FOUND, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/conversions/preview:
    parameters:
