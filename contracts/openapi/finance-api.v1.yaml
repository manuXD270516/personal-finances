      responses:
        '200':
          description: The preview page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/rows/{rowId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
      - $ref: '#/components/parameters/ImportRowId'
    patch:
      tags: [Imports]
      operationId: decideImportRow
      summary: Decide what to do with one row (create it, skip it as a duplicate or exclude it)
      description: |
        `CREATE` imports the row; `SKIP` (only for a possible duplicate) does not import it and links it with the existing
        movement when the import is approved, so a later import recognizes it as already imported; `EXCLUDE` neither
        imports nor links it. An invalid or already imported row has a fixed decision → 409
        `INVALID_STATUS_TRANSITION`; `SKIP` on a new row → 422 `VALIDATION_FAILED`. `If-Match` is the version of the
        IMPORT (every decision changes its counters); the response carries the new version in its ETag.
      x-openspec-capability: imports/import-pipeline
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRowDecisionRequest' }
      responses:
