      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPriceProposalAcceptRequest' }
      responses:
        '200':
          description: Updated subscription
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'SUBSCRIPTION_PROPOSAL_NOT_PENDING.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            SUBSCRIPTION_PRICE_NOT_CHRONOLOGICAL.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/subscriptions/{subscriptionId}/price-proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/SubscriptionProposalId'
    post:
      tags: [Commitments]
      operationId: rejectSubscriptionPriceProposal
      summary: Reject a detected price change
      description: |
