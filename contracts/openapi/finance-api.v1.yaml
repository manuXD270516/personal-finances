              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    get:
      tags: [Planning]
      operationId: getPeriodLifecycle
      summary: Lifecycle of a financial period (create, activate, close, reopen, re-close)
      description: |
        Machine `FINANCIAL_PERIOD_LIFECYCLE` (docs/31 D37). Closing transitions carry `detailRefs.snapshotId` and
        `closeNo`; reopenings carry the reason. Range recalculations of a draft are annotations.
      x-openspec-capability: [audit/lifecycle-timeline]
      x-required-role: VIEWER
      responses:
        '200':
          description: Period lifecycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lifecycle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
