        source: { $ref: '#/components/schemas/BudgetPropagationSource' }
    BudgetPropagationConfirm:
      type: object
      additionalProperties: false
      required: [source, token]
      properties:
        source: { $ref: '#/components/schemas/BudgetPropagationSource' }
        token: { type: string, description: Token returned by the preview. }
        changeNote: { type: string, maxLength: 500 }
    BudgetPropagationPeriod:
      type: object
      additionalProperties: false
      required: [budgetId, periodId, periodLabel]
      properties:
        budgetId: { $ref: '#/components/schemas/Uuid' }
        periodId: { $ref: '#/components/schemas/Uuid' }
        periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
    BudgetPropagationChange:
      type: object
      additionalProperties: false
      required: [budgetId, periodId, periodLabel, action, target, from, to]
      properties:
        budgetId: { $ref: '#/components/schemas/Uuid' }
        periodId: { $ref: '#/components/schemas/Uuid' }
        periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        action: { type: string, enum: [ADD, UPDATE, REMOVE] }
        target: { $ref: '#/components/schemas/BudgetLineTarget' }
        from:
          oneOf:
            - $ref: '#/components/schemas/PropagationLineSpec'
            - type: 'null'
        to:
          oneOf:
            - $ref: '#/components/schemas/PropagationLineSpec'
            - type: 'null'
    BudgetPropagationConflict:
      type: object
      additionalProperties: false
      required: [budgetId, periodId, periodLabel, action, reason, target, current, proposed]
      properties:
        budgetId: { $ref: '#/components/schemas/Uuid' }
        periodId: { $ref: '#/components/schemas/Uuid' }
        periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        action: { type: string, enum: [ADD, UPDATE, REMOVE] }
        reason:
          type: string
          description: >-
            OVERRIDDEN (line edited by hand), MANUAL_LINE (line that is not the template's), TARGET_OVERLAP or
            CURRENCY_MISMATCH. Open set — clients must handle unknown values.
          x-extensible-enum: [OVERRIDDEN, MANUAL_LINE, TARGET_OVERLAP, CURRENCY_MISMATCH]
        target: { $ref: '#/components/schemas/BudgetLineTarget' }
        current:
          oneOf:
            - $ref: '#/components/schemas/PropagationLineSpec'
            - type: 'null'
        proposed:
          oneOf:
            - $ref: '#/components/schemas/PropagationLineSpec'
            - type: 'null'
    BudgetPropagationPreview:
      type: object
      additionalProperties: false
      required: [templateId, baseVersionNo, newVersionPreview, periods, changes, conflicts, token]
      properties:
        templateId: { $ref: '#/components/schemas/Uuid' }
        baseVersionNo: { type: integer, minimum: 1 }
        newVersionPreview:
          type: object
          additionalProperties: false
          required: [versionNo, added, updated, removed, lines]
          properties:
            versionNo: { type: integer, minimum: 2 }
            added: { type: integer, minimum: 0 }
            updated: { type: integer, minimum: 0 }
            removed: { type: integer, minimum: 0 }
            lines:
              type: array
              items: { $ref: '#/components/schemas/TemplateLine' }
        periods:
          type: array
          description: Plans reached (periods in DRAFT starting after today), by period start.
          items: { $ref: '#/components/schemas/BudgetPropagationPeriod' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/BudgetPropagationChange' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/BudgetPropagationConflict' }
        token: { type: string }
    BudgetPropagationResult:
      type: object
      additionalProperties: false
      required: [template, applied]
      properties:
        template: { $ref: '#/components/schemas/Template' }
        applied:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [budgetId, periodId, periodLabel, changes, conflicts]
            properties:
              budgetId: { $ref: '#/components/schemas/Uuid' }
              periodId: { $ref: '#/components/schemas/Uuid' }
              periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
              changes: { type: integer, minimum: 0 }
              conflicts: { type: integer, minimum: 0 }

    # ── Recorrido del ciclo de vida (add-lifecycle-timeline, docs/31 D37) ──
    LifecycleAggregateType:
      type: string
      description: >-
        Tipo de agregado con máquina de estados declarada (docs/31 D37; Category y Counterparty, D52). Open set —
        clients must handle unknown values.
      pattern: '^[A-Z][A-Za-z]{0,63}$'
      # x-extensible-enum (convención reconocida por oasdiff, como ErrorCode): el catálogo de máquinas crece de forma
      # aditiva (Category y Counterparty, decisión del owner D52; FinancialPeriod, add-financial-periods).
      x-extensible-enum: [Transaction, Account, ExchangeRate, Category, Counterparty, FinancialPeriod, Reconciliation, RecurringDefinition, RecurringOccurrence, Subscription, Loan]
    LifecycleAggregateTypeInput:
      type: string
      description: LifecycleAggregateType aceptado en peticiones (conjunto cerrado; las respuestas usan el conjunto abierto).
      enum: [Transaction, Account, ExchangeRate, Category, Counterparty, FinancialPeriod, Reconciliation, RecurringDefinition, RecurringOccurrence, Subscription, Loan]
    LifecycleMachine:
      type: object
      description: Máquina de estados declarada por el contexto dueño (dato puro; `from` vacío = creación desde ∅).
      additionalProperties: false
      required: [aggregateType, machineVersion, states, transitions]
      properties:
        aggregateType: { type: string, examples: [Transaction] }
        machineVersion: { type: integer, minimum: 1 }
        states:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, terminal]
            properties:
              code: { type: string, examples: [POSTED] }
              terminal: { type: boolean }
        transitions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, from, to, guard, events]
            properties:
              code: { type: string, examples: [REVISE] }
              from:
                type: array
                items: { type: string }
              to:
                type: array
                minItems: 1
                items: { type: string }
              guard: { type: string }
              events:
                type: array
                items: { type: string, examples: [transactions.TransferRevised.v1] }
    LifecycleActor:
      type: object
      additionalProperties: false
      required: [type, id, displayName]
      properties:
        type: { $ref: '#/components/schemas/AuditActorType' }
        id: { type: string, description: 'userId (USER) o identificador del proceso (SYSTEM/WORKER)' }
        displayName: { type: [string, 'null'] }
    LifecycleJournalEntries:
      type: object
      description: Asientos del ledger del paso (revertido, su reversa y el nuevo); null si no aplica.
      additionalProperties: false
      required: [reversed, reversal, posted]
      properties:
        reversed: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reversal: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        posted: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    LifecycleTransition:
      type: object
      additionalProperties: false
      required:
        - sequence
        - kind
        - transition
        - fromState
        - toState
        - machineVersion
        - occurredAt
        - actor
        - origin
        - reason
        - revisionFrom
        - revisionTo
        - aggregateVersion
        - journalEntries
        - detailRefs
        - events
        - auditLogId
        - derived
      properties:
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, const: TRANSITION }
        transition: { type: string, examples: [REVISE] }
        fromState: { type: [string, 'null'], description: 'null = creación (∅)' }
        toState: { type: string }
        machineVersion: { type: integer, minimum: 1 }
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actor: { $ref: '#/components/schemas/LifecycleActor' }
        origin: { $ref: '#/components/schemas/AuditOrigin' }
        reason: { type: [string, 'null'] }
        revisionFrom: { type: [integer, 'null'], minimum: 1 }
        revisionTo: { type: [integer, 'null'], minimum: 1 }
        aggregateVersion: { type: [integer, 'null'], minimum: 1 }
        journalEntries: { $ref: '#/components/schemas/LifecycleJournalEntries' }
        detailRefs:
          type: object
          description: Referencias a detalles (`conversionRevision`, `supersededByRateId`, `supersedesRateId`).
          additionalProperties:
            oneOf: [{ type: string }, { type: integer }]
        events:
          type: array
          items: { type: string, examples: [transactions.TransferRevised.v1] }
        auditLogId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        derived:
          type: boolean
          description: true si se reconstruyó desde la auditoría (datos anteriores al registro de transiciones).
    LifecycleAnnotation:
      type: object
      description: Cambio descriptivo (sin cambio de estado ni de ledger) en el recorrido.
      additionalProperties: false
      required:
        - sequence
        - kind
        - occurredAt
        - actor
        - origin
        - changedFields
        - revisionFrom
        - revisionTo
        - aggregateVersion
        - events
        - auditLogId
        - derived
      properties:
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, const: ANNOTATION }
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actor: { $ref: '#/components/schemas/LifecycleActor' }
        origin: { $ref: '#/components/schemas/AuditOrigin' }
        changedFields:
          type: array
          items: { type: string }
        detailRefs:
          type: object
          description: Referencias de la anotación (p. ej. `reconciliationId` de la sesión que cotejó la transacción, `transactionId` en el recorrido de una sesión).
          additionalProperties:
            oneOf: [{ type: string }, { type: integer }]
        revisionFrom: { type: [integer, 'null'], minimum: 1 }
        revisionTo: { type: [integer, 'null'], minimum: 1 }
        aggregateVersion: { type: [integer, 'null'], minimum: 1 }
        events:
          type: array
          items: { type: string }
        auditLogId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        derived: { type: boolean }
    Lifecycle:
      type: object
      description: Recorrido de un elemento (docs/31 D37).
      required: [aggregateType, aggregateId, currentState, path, historyComplete, machine, items]
      properties:
        aggregateType: { $ref: '#/components/schemas/LifecycleAggregateType' }
        aggregateId: { $ref: '#/components/schemas/Uuid' }
        currentState: { type: [string, 'null'] }
        path:
          type: array
          description: Estados visitados en orden (destino de cada transición).
          items: { type: string }
        historyComplete:
          type: boolean
          description: false si el recorrido no arranca en una creación (historia previa sin evidencia).
        machine: { $ref: '#/components/schemas/LifecycleMachine' }
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/LifecycleTransition'
              - $ref: '#/components/schemas/LifecycleAnnotation'
            discriminator:
              propertyName: kind
              mapping:
                TRANSITION: '#/components/schemas/LifecycleTransition'
                ANNOTATION: '#/components/schemas/LifecycleAnnotation'
    LifecycleRevision:
      type: object
      description: Montos de una revisión de la transacción (legs vigentes y reemplazados; detalle de conversión).
      additionalProperties: false
      required: [revision, amount, fee, legs, conversion]
      properties:
        revision: { type: integer, minimum: 1 }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        legs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, role, amount]
            properties:
              accountId: { $ref: '#/components/schemas/Uuid' }
              role: { type: string, enum: [MAIN, SOURCE, TARGET, FEE] }
              amount: { $ref: '#/components/schemas/Money' }
        conversion:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [sourceAccountId, targetAccountId, sourceAmount, targetAmount, effectiveRate, fees]
              properties:
                sourceAccountId: { $ref: '#/components/schemas/Uuid' }
                targetAccountId: { $ref: '#/components/schemas/Uuid' }
                sourceAmount: { $ref: '#/components/schemas/Money' }
                targetAmount: { $ref: '#/components/schemas/Money' }
                effectiveRate: { $ref: '#/components/schemas/Rate' }
                fees:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, amount]
                    properties:
                      type: { $ref: '#/components/schemas/ConversionFeeType' }
                      amount: { $ref: '#/components/schemas/Money' }
    TransactionLifecycle:
      description: Recorrido de una transacción con los montos de cada revisión.
      allOf:
        - $ref: '#/components/schemas/Lifecycle'
        - type: object
          required: [revisions]
          properties:
            revisions:
              type: array
              items: { $ref: '#/components/schemas/LifecycleRevision' }
            reconciliations:
              type: array
              description: |
                Sessions referenced by the transitions and annotations (`detailRefs.reconciliationId`) with the statement
                date and balance they were reconciled or verified against (add-reconciliation).
              items:
                type: object
                additionalProperties: false
                required: [reconciliationId, accountId, statementDate, statementBalance]
                properties:
                  reconciliationId: { $ref: '#/components/schemas/Uuid' }
                  accountId: { $ref: '#/components/schemas/Uuid' }
                  statementDate: { $ref: '#/components/schemas/LocalDate' }
                  statementBalance: { $ref: '#/components/schemas/Money' }

    # ── Reconciliation (Phase 2, add-reconciliation) ──
    ReconciliationMode:
      type: string
      enum: [STATEMENT, WITHOUT_STATEMENT]
      description: How a RECONCILED transaction was reconciled (docs/33 D74).
    SystemFlag:
      type: string
      # Marcas de sistema derivadas y de solo lectura; el conjunto crece de forma aditiva.
      x-extensible-enum: [RECONCILED_WITHOUT_STATEMENT]
      description: Derived read-only transaction flag (docs/33 D111).
    ReconciliationState:
      type: string
      enum: [IN_PROGRESS, COMPLETED, CANCELLED]
    ReconciliationItem:
      type: object
      additionalProperties: false
      required: [transactionId, reconciledAt, verifiedWithoutStatement, unreconciledAt, unreconcileReason]
      properties:
        transactionId: { $ref: '#/components/schemas/Uuid' }
        reconciledAt: { $ref: '#/components/schemas/Instant' }
        verifiedWithoutStatement:
          type: boolean
          description: true when the transaction was already reconciled without a statement and this session verified it.
        unreconciledAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
          description: Later un-reconciliation (the session result is not altered).
        unreconcileReason: { type: [string, 'null'] }
    Reconciliation:
      type: object
      required:
        - id
        - accountId
        - status
        - statementDate
        - statementBalance
        - clearedBalance
        - difference
        - adjustmentTransactionId
        - startedBy
        - startedAt
        - completedAt
        - cancelledAt
        - version
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ReconciliationState' }
        statementDate: { $ref: '#/components/schemas/LocalDate' }
        statementBalance:
          $ref: '#/components/schemas/Money'
          description: Statement balance in the account currency (liabilities as a positive debt).
        clearedBalance:
          description: Live while IN_PROGRESS, frozen when COMPLETED (equal to the statement balance after the adjustment); null when CANCELLED.
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        difference:
          description: statementBalance − clearedBalance; 0 when COMPLETED; null when CANCELLED.
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        adjustmentTransactionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        startedBy: { $ref: '#/components/schemas/Uuid' }
        startedAt: { $ref: '#/components/schemas/Instant' }
        completedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        cancelledAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        version: { $ref: '#/components/schemas/Version' }
        items:
          type: array
          description: Present when COMPLETED.
          items: { $ref: '#/components/schemas/ReconciliationItem' }
    ReconciliationPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Reconciliation' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ReconciliationStart:
      type: object
      additionalProperties: false
      required: [accountId, statementDate, statementBalance]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        statementDate: { $ref: '#/components/schemas/LocalDate' }
        statementBalance:
          $ref: '#/components/schemas/DecimalString'
          description: Statement balance in the account currency and scale (more decimals → 422 AMOUNT_SCALE_EXCEEDED).
    ReconciliationComplete:
      type: object
      additionalProperties: false
      properties:
        adjustment:
          type: object
          additionalProperties: false
          required: [reason]
          description: Explicit confirmation of an adjustment that closes a non-zero difference.
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
    ReconciliationStatus:
      type: object
      description: Reconciliation status of an account at a cut-off date (`ReconciliationStatusQuery.getCoverage`).
      additionalProperties: false
      required:
        - accountId
        - lastCompleted
        - inProgressReconciliationId
        - unreconciledPostedCountThrough
        - unreconciledClearedCountThrough
        - reconciledWithoutStatementCount
        - reconciledThrough
        - reconciliationBasis
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        lastCompleted:
          oneOf:
            - type: object
              additionalProperties: false
              required: [reconciliationId, statementDate, statementBalance, difference, completedAt]
              properties:
                reconciliationId: { $ref: '#/components/schemas/Uuid' }
                statementDate: { $ref: '#/components/schemas/LocalDate' }
                statementBalance: { $ref: '#/components/schemas/Money' }
                difference: { $ref: '#/components/schemas/Money' }
                completedAt: { $ref: '#/components/schemas/Instant' }
            - type: 'null'
        inProgressReconciliationId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        unreconciledPostedCountThrough: { type: integer, minimum: 0 }
        unreconciledClearedCountThrough: { type: integer, minimum: 0 }
        reconciledWithoutStatementCount:
          type: integer
          minimum: 0
          description: Transactions reconciled without a statement dated in `[from, asOf]`.
        reconciledThrough: { type: boolean }
        reconciliationBasis:
          description: null when not reconciled; WITHOUT_STATEMENT when the range holds transactions reconciled without a statement.
          type: [string, 'null']
          enum: [STATEMENT, WITHOUT_STATEMENT, null]
    # ── Planning: cierre de mes (add-month-closing) ──
    ChecklistItemKind:
      type: string
      enum:
        - PENDING_TRANSACTIONS
        - UNRECONCILED_ACCOUNTS
        - UNRESOLVED_DUPLICATES
        - UNCATEGORIZED
        - UNRESOLVED_RECURRING
        - RECONCILED_WITHOUT_STATEMENT
    ChecklistSeverity:
      type: string
      description: '`INFO` only for `RECONCILED_WITHOUT_STATEMENT`; it never appears in `ClosingPolicy`.'
      enum: [BLOCKING, WARNING, INFO]
    CloseChecklistDetail:
      type: object
      additionalProperties: false
      required: [refType, refId, label, date, amount]
      properties:
        refType: { type: string, enum: [TRANSACTION, ACCOUNT, DUPLICATE_CANDIDATE, SPLIT] }
        refId: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }
        date: { oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }] }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
    CloseChecklistItem:
      type: object
      additionalProperties: false
      required: [kind, severity, availability, count, amounts, details, truncated]
      properties:
        kind: { $ref: '#/components/schemas/ChecklistItemKind' }
        severity: { $ref: '#/components/schemas/ChecklistSeverity' }
        availability: { type: string, enum: [AVAILABLE, NOT_AVAILABLE] }
        count: { type: integer, minimum: 0 }
        amounts:
          type: array
          description: Amounts per currency, never converted.
          items: { $ref: '#/components/schemas/Money' }
        details:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CloseChecklistDetail' }
        truncated: { type: boolean }
    CloseChecklist:
      type: object
      additionalProperties: false
      required: [periodId, label, periodStart, periodEnd, evaluatedAt, canClose, requiresAcknowledgement, items]
      properties:
        periodId: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        evaluatedAt: { $ref: '#/components/schemas/Instant' }
        canClose: { type: boolean, description: False when some blocking item has observations }
        requiresAcknowledgement: { type: boolean, description: True when only warnings have observations }
        items:
          type: array
          items: { $ref: '#/components/schemas/CloseChecklistItem' }
    ClosePeriodRequest:
      type: object
      additionalProperties: false
      properties:
        acknowledgeWarnings: { type: boolean, default: false }
        note: { type: string, minLength: 0, maxLength: 500 }
    ReopenPeriodRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CloseSnapshotSummary:
      type: object
      required: [snapshotId, closeNo, closedAt, closedBy, previousSnapshotId, isCurrent]
      properties:
        snapshotId: { $ref: '#/components/schemas/Uuid' }
        closeNo: { type: integer, minimum: 1 }
        closedAt: { $ref: '#/components/schemas/Instant' }
        closedBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        previousSnapshotId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        isCurrent: { type: boolean }
    CloseSnapshotBalance:
      type: object
      additionalProperties: false
      required:
        - accountId
        - accountName
        - ledgerAccountId
        - currency
        - balance
        - presented
        - reconciliation
        - reconciliationBasis
        - reconciledWithoutStatementTransactionIds
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        accountName: { type: string }
        ledgerAccountId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        balance: { $ref: '#/components/schemas/Money' }
        presented: { $ref: '#/components/schemas/Money' }
        reconciliation:
          oneOf:
            - type: object
              additionalProperties: false
              required: [reconciliationId, statementDate, statementBalance]
              properties:
                reconciliationId: { $ref: '#/components/schemas/Uuid' }
                statementDate: { $ref: '#/components/schemas/LocalDate' }
                statementBalance: { $ref: '#/components/schemas/Money' }
            - type: 'null'
        reconciliationBasis:
          description: Null when the account was not reconciled at close (warning acknowledged).
          oneOf:
            - { type: string, enum: [STATEMENT, WITHOUT_STATEMENT] }
            - { type: 'null' }
        reconciledWithoutStatementTransactionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    CloseSnapshotFlows:
      type: object
      additionalProperties: false
      required: [byCurrency, consolidated]
      properties:
        byCurrency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, income, expense, savings]
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              income: { $ref: '#/components/schemas/Money' }
              expense: { $ref: '#/components/schemas/Money' }
              savings: { $ref: '#/components/schemas/Money' }
        consolidated:
          type: object
          additionalProperties: false
          required: [currency, income, expense, savings, savingsRate, complete, unconverted]
          properties:
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            income: { $ref: '#/components/schemas/Money' }
            expense: { $ref: '#/components/schemas/Money' }
            savings: { $ref: '#/components/schemas/Money' }
            savingsRate:
              description: Percentage with one decimal (HALF_EVEN); null without income.
              oneOf: [{ type: string }, { type: 'null' }]
            complete: { type: boolean }
            unconverted:
              type: array
              items: { $ref: '#/components/schemas/Money' }
    CloseSnapshot:
      description: One immutable version of the close snapshot (amounts as decimal text at the currency scale).
      allOf:
        - $ref: '#/components/schemas/CloseSnapshotSummary'
        - type: object
          required:
            - periodId
            - label
            - periodStart
            - periodEnd
            - baseCurrency
            - balances
            - reconciledWithoutStatement
            - flows
            - netWorth
            - budgetVsActual
            - goalContributions
            - checklist
            - acknowledgedWarnings
          properties:
            periodId: { $ref: '#/components/schemas/Uuid' }
            label: { type: string }
            periodStart: { $ref: '#/components/schemas/LocalDate' }
            periodEnd: { $ref: '#/components/schemas/LocalDate' }
            baseCurrency: { $ref: '#/components/schemas/CurrencyCode' }
            balances:
              type: array
              items: { $ref: '#/components/schemas/CloseSnapshotBalance' }
            reconciledWithoutStatement:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [transactionId, accountId, businessDate, amount]
                properties:
                  transactionId: { $ref: '#/components/schemas/Uuid' }
                  accountId: { $ref: '#/components/schemas/Uuid' }
                  businessDate: { $ref: '#/components/schemas/LocalDate' }
                  amount: { $ref: '#/components/schemas/Money' }
            flows: { $ref: '#/components/schemas/CloseSnapshotFlows' }
            netWorth:
              type: object
              additionalProperties: false
              required: [amount, assets, liabilities, complete, unconverted, rates]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                assets: { $ref: '#/components/schemas/Money' }
                liabilities: { $ref: '#/components/schemas/Money' }
                complete: { type: boolean }
                unconverted:
                  type: array
                  items: { $ref: '#/components/schemas/Money' }
                rates:
                  type: array
                  description: Every rate used to value the snapshot, with its source.
                  items: { $ref: '#/components/schemas/ResolvedRate' }
            budgetVsActual:
              description: Null when the period has no monthly plan (not available, no invented amounts).
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [budgetId, currency, lines, totals]
                  properties:
                    budgetId: { $ref: '#/components/schemas/Uuid' }
                    currency: { $ref: '#/components/schemas/CurrencyCode' }
                    lines:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [target, targetName, nature, reference, actual, status]
                        properties:
                          target:
                            type: object
                            additionalProperties: false
                            required: [kind, id]
                            properties:
                              kind: { type: string, enum: [CATEGORY, GROUP, TAG] }
                              id: { $ref: '#/components/schemas/Uuid' }
                          targetName: { type: string }
                          nature: { type: string, enum: [EXPENSE, INCOME] }
                          reference: { $ref: '#/components/schemas/Money' }
                          actual: { $ref: '#/components/schemas/Money' }
                          status: { type: string }
                    totals:
                      type: object
                      additionalProperties: false
                      required: [planned, actual, complete]
                      properties:
                        planned: { $ref: '#/components/schemas/Money' }
                        actual: { $ref: '#/components/schemas/Money' }
                        complete: { type: boolean }
                - type: 'null'
            goalContributions:
              description: Null until goals exist (Phase 4).
              type: 'null'
            checklist:
              type: array
              items: { $ref: '#/components/schemas/CloseChecklistItem' }
            acknowledgedWarnings:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [items, by, at]
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/ChecklistItemKind' }
                    by: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
                    at: { $ref: '#/components/schemas/Instant' }
                - type: 'null'
    CloseSnapshotDiff:
      type: object
      additionalProperties: false
      required: [from, to, balances, flows, netWorth]
      properties:
        from: { type: integer, minimum: 1 }
        to: { type: integer, minimum: 1 }
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, currency, delta]
            properties:
              accountId: { $ref: '#/components/schemas/Uuid' }
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              delta: { $ref: '#/components/schemas/Money' }
        flows:
          type: object
          additionalProperties: false
          required: [byCurrency, consolidated]
          properties:
            byCurrency:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [currency, income, expense, savings]
                properties:
                  currency: { $ref: '#/components/schemas/CurrencyCode' }
                  income: { $ref: '#/components/schemas/Money' }
                  expense: { $ref: '#/components/schemas/Money' }
                  savings: { $ref: '#/components/schemas/Money' }
            consolidated:
              type: object
              additionalProperties: false
              required: [income, expense, savings]
              properties:
                income: { $ref: '#/components/schemas/Money' }
                expense: { $ref: '#/components/schemas/Money' }
                savings: { $ref: '#/components/schemas/Money' }
        netWorth:
          type: object
          additionalProperties: false
          required: [delta]
          properties:
            delta: { $ref: '#/components/schemas/Money' }
    CloseReport:
      type: object
      additionalProperties: false
      required: [snapshot, versions, comparison, comparisonUnavailableReason]
      properties:
        snapshot: { $ref: '#/components/schemas/CloseSnapshot' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/CloseSnapshotSummary' }
        comparison:
          oneOf:
            - type: object
              additionalProperties: false
              required: [previousPeriodId, previousLabel, previousCloseNo, deltas]
              properties:
                previousPeriodId: { $ref: '#/components/schemas/Uuid' }
                previousLabel: { type: string }
                previousCloseNo: { type: integer, minimum: 1 }
                deltas:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [kpi, absolute, percentage]
                    properties:
                      kpi: { type: string, enum: [INCOME, EXPENSE, SAVINGS, SAVINGS_RATE, NET_WORTH] }
                      absolute:
                        description: Money in the base currency; percentage points (text) for SAVINGS_RATE; null without rate.
                        oneOf:
                          - { $ref: '#/components/schemas/Money' }
                          - { type: string }
                          - { type: 'null' }
                      percentage:
                        description: Relative variation with one decimal (HALF_EVEN); null when the previous value is 0.
                        oneOf: [{ type: string }, { type: 'null' }]
            - type: 'null'
        comparisonUnavailableReason:
          oneOf:
            - { type: string, enum: [NO_PREVIOUS_PERIOD, NO_PREVIOUS_SNAPSHOT] }
            - { type: 'null' }
    ClosingPolicySeverities:
      type: object
      description: Severity of each configurable checklist item (the informational item is not part of the policy).
      required:
        - PENDING_TRANSACTIONS
        - UNRECONCILED_ACCOUNTS
        - UNRESOLVED_DUPLICATES
        - UNCATEGORIZED
        - UNRESOLVED_RECURRING
      propertyNames:
        enum:
          - PENDING_TRANSACTIONS
          - UNRECONCILED_ACCOUNTS
          - UNRESOLVED_DUPLICATES
          - UNCATEGORIZED
          - UNRESOLVED_RECURRING
      additionalProperties: { type: string, enum: [BLOCKING, WARNING] }
    ClosingPolicy:
      type: object
      additionalProperties: false
      required: [severities, version, updatedAt, updatedBy]
      properties:
        severities: { $ref: '#/components/schemas/ClosingPolicySeverities' }
        version: { type: integer, minimum: 1 }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        updatedBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    ClosingPolicyUpdate:
      type: object
      additionalProperties: false
      required: [severities]
      properties:
        severities: { $ref: '#/components/schemas/ClosingPolicySeverities' }

    ReconciliationLifecycle:
      description: Lifecycle of a reconciliation session with its balances.
      allOf:
        - $ref: '#/components/schemas/Lifecycle'
        - type: object
          required: [reconciliation]
          properties:
            reconciliation:
              type: object
              additionalProperties: false
              required: [accountId, statementDate, statementBalance, clearedBalance, difference, adjustmentTransactionId]
              properties:
                accountId: { $ref: '#/components/schemas/Uuid' }
                statementDate: { $ref: '#/components/schemas/LocalDate' }
                statementBalance: { $ref: '#/components/schemas/Money' }
                clearedBalance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                difference: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                adjustmentTransactionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }

    # ── Reporting ──
    CurrencyTotals:
      type: object
      required: [currency, income, expense, net]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net:
          $ref: '#/components/schemas/Money'
          description: Savings of the period (income − expense)
        liquidBalance:
          $ref: '#/components/schemas/Money'
          description: Sum of balances of LIQUID accounts in this currency
        savingsRate:
          description: Savings / income in %, 1 decimal; null when income is zero (undefined)
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        assets: { $ref: '#/components/schemas/Money' }
        liabilities: { $ref: '#/components/schemas/Money' }
        netWorth: { $ref: '#/components/schemas/Money' }
    ConsolidatedTotals:
      type: object
      description: Totals in the reporting currency. Always present; `complete=false` when some amount could not be converted.
      required: [currency, income, expense, net, liquidBalance, assets, liabilities, netWorth, complete, unconverted]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        liquidBalance: { $ref: '#/components/schemas/Money' }
        assets: { $ref: '#/components/schemas/Money' }
        liabilities: { $ref: '#/components/schemas/Money' }
        netWorth: { $ref: '#/components/schemas/Money' }
        savingsRate:
          description: Savings / income in %, 1 decimal; null = not defined
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        complete: { type: boolean }
        unconverted:
          type: array
          description: Native amounts per currency excluded for lack of a rate
          items: { $ref: '#/components/schemas/Money' }
    MoneyVariation:
      type: object
      required: [current, previous, deltaAbs, isNew]
      properties:
        current: { $ref: '#/components/schemas/Money' }
        previous: { $ref: '#/components/schemas/Money' }
        deltaAbs: { $ref: '#/components/schemas/Money' }
        deltaPct:
          description: Variation in %, 2 decimals; null when the previous value is zero
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        isNew: { type: boolean, description: True when there was nothing in the previous period }
    PeriodComparison:
      type: object
      required: [mode, previousPeriod, income, expense, savings]
      properties:
        mode:
          type: string
          enum: [PREVIOUS_PERIOD_TO_DATE, PREVIOUS_PERIOD]
        previousPeriod:
          type: object
          required: [from, to]
          properties:
            from: { $ref: '#/components/schemas/LocalDate' }
            to: { $ref: '#/components/schemas/LocalDate' }
        income: { $ref: '#/components/schemas/MoneyVariation' }
        expense: { $ref: '#/components/schemas/MoneyVariation' }
        savings: { $ref: '#/components/schemas/MoneyVariation' }
    AccountBalanceLine:
      type: object
      required: [accountId, name, type, nature, balance, includeInNetWorth, liquid]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        nature:
          type: string
          enum: [ASSET, LIABILITY]
        balance:
          $ref: '#/components/schemas/Money'
          description: Presented balance in the account currency
        convertedBalance:
          description: Balance in the reporting currency; null when no rate is available
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        rate:
          oneOf:
            - $ref: '#/components/schemas/ResolvedRate'
            - type: 'null'
        includeInNetWorth: { type: boolean }
        liquid: { type: boolean }
    NetWorthBreakdown:
      type: object
      required: [assets, liabilities, netWorth, complete, byCurrency, byAccountType, unvalued]
      properties:
        assets: { $ref: '#/components/schemas/Money' }
        liabilities: { $ref: '#/components/schemas/Money' }
        netWorth: { $ref: '#/components/schemas/Money' }
        complete: { type: boolean }
        byCurrency:
          type: array
          items:
            type: object
            required: [currency, assets, liabilities, net, converted]
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              assets: { $ref: '#/components/schemas/Money' }
              liabilities: { $ref: '#/components/schemas/Money' }
              net:
                $ref: '#/components/schemas/Money'
                description: Native currency
              converted:
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
        byAccountType:
          type: array
          items:
            type: object
            required: [type, amount]
            properties:
              type: { $ref: '#/components/schemas/AccountType' }
              amount:
                $ref: '#/components/schemas/Money'
                description: Reporting currency; liabilities negative
        unvalued:
          type: array
          description: Native amounts that could not be valued (no rate)
          items: { $ref: '#/components/schemas/Money' }
    NetWorthPoint:
      type: object
      additionalProperties: false
      required:
        [period, periodId, asOf, assets, liabilities, netWorth, change, comparable, complete, unconverted, source, closed, partial, ratesUsed]
      properties:
        period:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: Financial period label (`YYYY-MM` of its start, docs/33 D59)
        periodId: { $ref: '#/components/schemas/Uuid' }
        asOf:
          $ref: '#/components/schemas/LocalDate'
          description: Cut date, the end of the period (today for the period in progress)
        assets:
          $ref: '#/components/schemas/DecimalString'
          description: In `reportingCurrency`
        liabilities:
          $ref: '#/components/schemas/DecimalString'
          description: In `reportingCurrency`, positive when owed
        netWorth:
          $ref: '#/components/schemas/DecimalString'
          description: In `reportingCurrency` (assets − liabilities)
        change:
          description: Net worth difference with the previous point of the series; null on the first point
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        comparable:
          type: boolean
          description: False on the first point or when this or the previous point is incomplete
        complete: { type: boolean }
        unconverted:
          type: array
          description: Native amounts without a rate in force at the cut date (excluded from the totals)
          items: { $ref: '#/components/schemas/Money' }
        source:
          type: string
          enum: [COMPUTED, SNAPSHOT]
        closed:
          type: boolean
          description: The period is closed and has a closing snapshot
        partial:
          type: boolean
          description: The period is in progress and the point is computed at today's date
        ratesUsed:
          type: array
          description: Rates used to value this point (empty for snapshot points)
          items: { $ref: '#/components/schemas/ResolvedRate' }
    NetWorthHistory:
      type: object
      additionalProperties: false
      required: [reportingCurrency, points, meta]
      properties:
        reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        points:
          type: array
          items: { $ref: '#/components/schemas/NetWorthPoint' }
        meta:
          type: object
          additionalProperties: false
          required: [generatedAt, timeZone, rateWindowDays, ratesUsed, attributions]
          properties:
            generatedAt: { $ref: '#/components/schemas/Instant' }
            timeZone: { type: string }
            rateWindowDays:
              type: integer
              description: Rate validity window (REPORTING_RATE_VALIDITY_WINDOW), the same as `/reports/summary`.
            dataFreshness: { $ref: '#/components/schemas/Instant' }
            ratesUsed:
              type: array
              items: { $ref: '#/components/schemas/ResolvedRate' }
            attributions:
              type: array
              items: { $ref: '#/components/schemas/RateAttribution' }
    ValuedTotal:
      type: object
      additionalProperties: false
      required: [byCurrency, consolidated]
      properties:
        byCurrency:
          type: array
          description: Sum per original currency, not converted.
          items: { $ref: '#/components/schemas/Money' }
        consolidated:
          type: object
          additionalProperties: false
          required: [amount, complete, unconverted]
          properties:
            amount: { $ref: '#/components/schemas/Money' }
            complete:
              type: boolean
              description: false when some aggregate has no rate within the validity window (never converted 1:1).
            unconverted:
              type: array
              items: { $ref: '#/components/schemas/Money' }
    UpcomingPaymentItem:
      type: object
      additionalProperties: false
      required: [kind, name, accountId, accountName, date, status, amountType, amount, estimated, withoutAmount, converted]
      properties:
        kind: { type: string, enum: [OCCURRENCE, PENDING_TRANSACTION] }
        occurrenceId: { type: string, format: uuid }
        definitionId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        name: { type: string }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        date: { $ref: '#/components/schemas/LocalDate' }
        status:
          type: string
          enum: [SCHEDULED, DUE, OVERDUE, PENDING_APPROVAL, PENDING]
        daysOverdue:
          type: integer
          minimum: 1
          description: Days between the due date and today; only on overdue occurrences.
        amountType:
          type: string
          enum: [FIXED, ESTIMATED, MIN_MAX, VARIABLE, ACTUAL]
          description: '`ACTUAL` is the real amount of a pending transaction.'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Null for `VARIABLE` (no amount) and `MIN_MAX` (see `range`).
        range:
          type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min: { $ref: '#/components/schemas/Money' }
            max: { $ref: '#/components/schemas/Money' }
        estimated: { type: boolean }
        withoutAmount: { type: boolean }
        converted:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Amount that adds to the totals, in the reporting currency; null without amount or without rate.
    CommittedBlock:
      type: object
      additionalProperties: false
      required: [periodId, label, from, to, total, fromCommitments, fromPending, withoutAmountCount, overdueFromPreviousPeriods]
      properties:
        periodId: { type: string, format: uuid }
        label: { type: string, description: 'Financial period label YYYY-MM (start month).' }
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        total: { $ref: '#/components/schemas/ValuedTotal' }
        fromCommitments: { $ref: '#/components/schemas/ValuedTotal' }
        fromPending: { $ref: '#/components/schemas/ValuedTotal' }
        withoutAmountCount: { type: integer, minimum: 0 }
        overdueFromPreviousPeriods:
          type: object
          additionalProperties: false
          description: Unresolved occurrences overdue from previous periods; reported apart, not added to `total`.
          required: [count, byCurrency, consolidated]
          properties:
            count: { type: integer, minimum: 0 }
            byCurrency:
              type: array
              items: { $ref: '#/components/schemas/Money' }
            consolidated:
              type: object
              additionalProperties: false
              required: [amount, complete, unconverted]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                complete: { type: boolean }
                unconverted:
                  type: array
                  items: { $ref: '#/components/schemas/Money' }
    ProjectedBalance:
      type: object
      additionalProperties: false
      required: [accountId, accountName, currency, booked, pendingIn, pendingOut, projected]
      properties:
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        booked: { $ref: '#/components/schemas/Money' }
        pendingIn: { $ref: '#/components/schemas/Money' }
        pendingOut: { $ref: '#/components/schemas/Money' }
        projected: { $ref: '#/components/schemas/Money' }
    UpcomingPayments:
      type: object
      additionalProperties: false
      required: [window, items, totals, committed, projectedBalances, hasCommitments, meta]
      properties:
        window:
          type: object
          additionalProperties: false
          required: [from, to, days]
          properties:
            from: { $ref: '#/components/schemas/LocalDate' }
            to: { $ref: '#/components/schemas/LocalDate' }
            days: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/UpcomingPaymentItem' }
        totals:
          type: object
          additionalProperties: false
          required: [byCurrency, consolidated, withoutAmountCount]
          properties:
            byCurrency:
              type: array
              items: { $ref: '#/components/schemas/Money' }
            consolidated:
              type: object
              additionalProperties: false
              required: [amount, complete, unconverted]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                complete: { type: boolean }
                unconverted:
                  type: array
                  items: { $ref: '#/components/schemas/Money' }
            withoutAmountCount: { type: integer, minimum: 0 }
        committed:
          oneOf:
            - $ref: '#/components/schemas/CommittedBlock'
            - type: 'null'
          description: Null when no financial period covers today.
        projectedBalances:
          type: array
          description: booked + pendingIn - pendingOut per account (FR-LEDGER-013); a projection, never the booked balance.
          items: { $ref: '#/components/schemas/ProjectedBalance' }
        hasCommitments:
          type: boolean
          description: At least one active recurring definition or one pending expense (Home Q4/Q8 available).
        meta:
          type: object
          additionalProperties: false
          required: [generatedAt, reportingCurrency, timeZone, rateWindowDays, approx, rates, attributions]
          properties:
            generatedAt: { $ref: '#/components/schemas/Instant' }
            reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
            timeZone: { type: string }
            rateWindowDays:
              type: integer
              description: Rate validity window (REPORTING_RATE_VALIDITY_WINDOW), the same as `/reports/summary`.
            dataFreshness: { $ref: '#/components/schemas/Instant' }
            approx: { type: boolean }
            rates:
              type: array
              description: Rates in force when the query ran (future payments are valued with the rate of today).
              items: { $ref: '#/components/schemas/ResolvedRate' }
            attributions:
              type: array
              items: { $ref: '#/components/schemas/RateAttribution' }
    SurprisePayments:
      type: object
      additionalProperties: false
      required: [periodId, label, from, to, partial, count, items, note]
      properties:
        periodId: { type: string, format: uuid }
        label: { type: string }
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        partial:
          type: boolean
          description: True while the period has not ended.
        count: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [transactionId, date, name, amount, occurrenceId, definitionId, generatedOn]
            properties:
              transactionId: { type: string, format: uuid }
              date: { $ref: '#/components/schemas/LocalDate' }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              occurrenceId: { type: string, format: uuid }
              definitionId: { type: string, format: uuid }
              generatedOn: { $ref: '#/components/schemas/LocalDate' }
        note:
          type: string
          enum: [UNLINKED_PAYMENTS_NOT_DETECTED]
          description: Payments not linked to any commitment are not detected.
    HomeQuestionStatus:
      type: object
      required: [question, status, actionHint]
      properties:
        question:
          type: string
          enum: [Q1, Q2, Q3, Q4, Q5, Q6, Q7, Q8, Q9]
          description: Home questions of docs/00 §6
        status:
          type: string
          enum: [AVAILABLE, NO_DATA, NOT_AVAILABLE_IN_PHASE]
        actionHint:
          type: [string, 'null']
          description: |
            Suggested action code (open set): `CREATE_ACCOUNT`, `CREATE_COMMITMENT` (Q4/Q8 without active recurring
            definitions or pending expenses), `AVAILABLE_IN_PHASE_n`...
    ReportSummary:
      type: object
      required: [period, byCurrency, consolidated, accounts, topExpenseCategories, netWorth, questions, meta]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { $ref: '#/components/schemas/LocalDate' }
            to: { $ref: '#/components/schemas/LocalDate' }
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/CurrencyTotals' }
        consolidated: { $ref: '#/components/schemas/ConsolidatedTotals' }
        comparison:
          description: Null when compare=NONE
          oneOf:
            - $ref: '#/components/schemas/PeriodComparison'
            - type: 'null'
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceLine' }
        topExpenseCategories:
          type: array
          items:
            type: object
            required: [categoryId, name, amount, complete]
            properties:
              categoryId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              amount:
                $ref: '#/components/schemas/Money'
                description: Net expense (expenses − refunds) in the reporting currency; may be negative
              complete: { type: boolean }
              previousAmount:
                description: |
                  Net expense of the same category in the comparison period (`comparison.previousPeriod`), in the
                  reporting currency, converted at the rate of each flow's date (zero if it had no flows there). Null
                  when there is no comparison (compare=NONE) or when some previous amount could not be converted.
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
        topIncomeCategories:
          type: array
          description: |
            Top N income categories of the period (same N, ordering and tie-break as `topExpenseCategories`), by net
            income in the reporting currency (FR-REPORTING-004).
          items:
            type: object
            required: [categoryId, name, amount, complete]
            properties:
              categoryId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              amount:
                $ref: '#/components/schemas/Money'
                description: Net income in the reporting currency; may be negative
              complete: { type: boolean }
              previousAmount:
                description: |
                  Net income of the same category in the comparison period, in the reporting currency (zero if it
                  had no flows there). Null when there is no comparison or some previous amount could not be converted.
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
        netWorth: { $ref: '#/components/schemas/NetWorthBreakdown' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/HomeQuestionStatus' }
        meta:
          type: object
          required: [generatedAt, reportingCurrency, approx, timeZone, rateWindowDays, complete]
          properties:
            generatedAt: { $ref: '#/components/schemas/Instant' }
            reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
            approx: { type: boolean, description: True if any consolidated figure uses reference or cross rates }
            timeZone: { type: string, examples: [America/La_Paz] }
            rateWindowDays: { type: integer, minimum: 0 }
            complete: { type: boolean }
            dataFreshness:
              $ref: '#/components/schemas/Instant'
              description: Instant of the latest data included (Phase 1 reads the ledger directly)
            ratesUsed:
              type: array
              items: { $ref: '#/components/schemas/ResolvedRate' }
            attributions:
              type: array
              description: 'Distinct attributions of the provider rates used (e.g. "Fuente: paralelo.bo", CC BY 4.0); clients must display them'
              items: { $ref: '#/components/schemas/RateAttribution' }

    # ── Platform ──
    Operation:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind:
          type: string
          description: Open set (IMPORT_PARSE, IMPORT_COMMIT, FORECAST, EXPORT, WORKSPACE_DELETE, REBUILD, ...)
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        progressPct: { type: integer, minimum: 0, maximum: 100 }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { $ref: '#/components/schemas/Uuid' }
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }

    # ── Notifications (add-alerts, Phase 2) ──
    NotificationType:
      type: string
      description: Open set; later phases add types (upcoming payments, goals, cards, stale rates, imports, deficit).
      pattern: '^[A-Z][A-Z0-9_]*$'
      examples: [BUDGET_THRESHOLD]
      x-extensible-enum: [BUDGET_THRESHOLD, MONTH_CLOSE_PENDING, RECURRING_PAYMENT_UPCOMING, RECURRING_APPROVAL_REQUIRED, SUBSCRIPTION_RENEWAL, SUBSCRIPTION_TRIAL_ENDING, SUBSCRIPTION_PRICE_CHANGE]
    NotificationSeverity:
      type: string
      description: INFO below 100 % of a budget line; WARNING at 100 % or more and for a month pending close.
      enum: [INFO, WARNING, CRITICAL]
    NotificationStatus:
      type: string
      enum: [UNREAD, READ, ARCHIVED]
    NotificationEmailStatus:
      type: string
      description: |
        Aggregated state of the email delivery. `PENDING` covers queued, in progress and waiting for a retry or for
        the end of the quiet hours; `SUPPRESSED` means the email will never be sent (channel disabled, no verified
        address, preference turned off).
      enum: [PENDING, SENT, FAILED, SUPPRESSED]
    NotificationLink:
      type: object
      description: |
        Resource that originated the notification. The app translates it to a route; if the budget line no longer
        exists the plan of the period shows that it is not available any more (the notification is not modified).
      additionalProperties: false
      required: [kind, periodId, periodLabel]
      properties:
        kind:
          type: string
          x-extensible-enum: [BUDGET_LINE, PERIOD_CLOSE, RECURRING_OCCURRENCE, SUBSCRIPTION]
        occurrenceId:
          description: >-
            Recurring occurrence (only `RECURRING_OCCURRENCE`, add-recurrence-engine): the app opens
            `/recurring/occurrences/{occurrenceId}`. In that kind `periodId` is the financial period of the due date
            (the occurrence id when no period covers it) and `periodLabel` the month of the due date.
          $ref: '#/components/schemas/Uuid'
        subscriptionId:
          description: >-
            Subscription (only `SUBSCRIPTION`, add-subscriptions): the app opens `/recurring/suscripciones/{subscriptionId}`
            (with the pending price proposal when `proposalId` is present); if the subscription no longer exists or was
            cancelled it shows the list with a "no longer available" notice. In that kind `periodId` is the subscription
            id and `periodLabel` the month of the date of the fact.
          $ref: '#/components/schemas/Uuid'
        proposalId: { $ref: '#/components/schemas/Uuid' }
        periodId: { $ref: '#/components/schemas/Uuid' }
        periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        budgetId: { $ref: '#/components/schemas/Uuid' }
        budgetLineId: { $ref: '#/components/schemas/Uuid' }
        targetKind:
          type: string
          enum: [CATEGORY, GROUP, TAG]
        targetId: { $ref: '#/components/schemas/Uuid' }
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, severity, title, body, messageKey, params, link, status, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/NotificationType' }
        severity: { $ref: '#/components/schemas/NotificationSeverity' }
        title:
          type: string
          description: Rendered in the caller's locale (Spanish fallback) from `messageKey` and `params`.
        body: { type: string }
        messageKey:
          type: string
          description: Versioned message key (e.g. `notifications.budget_threshold.v1`).
        params:
          type: object
          description: |
            Facts of the source event (periodLabel, threshold, alsoCrossed, reference and actual as Money, utilization,
            ids); decimals as strings. Never names or free text.
          additionalProperties: true
        link: { $ref: '#/components/schemas/NotificationLink' }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        readAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        emailStatus: { $ref: '#/components/schemas/NotificationEmailStatus' }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { $ref: '#/components/schemas/PageInfo' }
    NotificationUnreadCount:
      type: object
      additionalProperties: false
      required: [unread]
      properties:
        unread: { type: integer, minimum: 0 }
    NotificationReadAllResult:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
    QuietHours:
      type: object
      description: Quiet hours in the user's time zone, `[start, end)`; may cross midnight (22:00–07:00). Start and end differ.
      additionalProperties: false
      required: [start, end]
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['22:00'] }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['07:00'] }
    NotificationTypePreference:
      type: object
      additionalProperties: false
      required: [type, inApp, email]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        inApp: { type: boolean }
        email: { type: boolean }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [types, quietHours, includeDetailsInEmail, version]
      properties:
        types:
          type: array
          description: Every notification type of the catalog with its channels.
          items: { $ref: '#/components/schemas/NotificationTypePreference' }
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/QuietHours'
            - type: 'null'
        includeDetailsInEmail:
          type: boolean
          description: Opt-in to amounts and names in the email body. The in-app content never changes with this option.
        version: { type: integer, minimum: 1 }
    NotificationPreferencesInput:
      type: object
      additionalProperties: false
      required: [types, quietHours, includeDetailsInEmail]
      properties:
        types:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/NotificationTypePreference' }
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/QuietHours'
            - type: 'null'
        includeDetailsInEmail: { type: boolean }

    # ── Commitments: motor de recurrencia (Phase 3, add-recurrence-engine) ──
    RecurringKind:
      type: string
      description: >-
        Kind of a recurring definition. `LOAN_PAYMENT` (loan installments) is created and revised only by the loan that
        manages it (`managedBy = DEBT`, explicit installment schedule, notify-only): it is readable here but a user
        `POST`/`PATCH` of it is still rejected with 422 `RECURRING_KIND_NOT_AVAILABLE`. `CARD_PAYMENT` stays reserved
        for Phase 4 (`debt/*`); today a card payment is a `TRANSFER` to the liability account.
      enum: [INCOME, EXPENSE, TRANSFER, LOAN_PAYMENT, CARD_PAYMENT]
      x-reserved: [CARD_PAYMENT]
      x-managed: [LOAN_PAYMENT]
    RecurringStatus:
      type: string
      enum: [ACTIVE, PAUSED, ENDED]
    RecurringCadence:
      type: string
      description: Predefined cadences (with an interval N) or `CUSTOM` (a subset of RRULE).
      # x-extensible-enum (oasdiff): el calendario explícito (`EXPLICIT`, cuotas de préstamo administradas) se agrega
      # sin romper a los clientes; las peticiones usan `RecurringCadenceInput` (conjunto cerrado, sin `EXPLICIT`).
      x-extensible-enum: [DAILY, WEEKLY, BIWEEKLY, SEMIMONTHLY, MONTHLY, BIMONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, CUSTOM, EXPLICIT]
      x-managed: [EXPLICIT]
    RecurringCadenceInput:
      type: string
      description: Cadence accepted in requests (closed set; `EXPLICIT` is created only by the managing context).
      enum: [DAILY, WEEKLY, BIWEEKLY, SEMIMONTHLY, MONTHLY, BIMONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL, CUSTOM]
    RecurringWeekendAdjustment:
      type: string
      description: Moves only the due date of a weekend nominal date to the previous Friday or the next Monday.
      enum: [NONE, PREVIOUS, NEXT]
    RecurringAmountType:
      type: string
      enum: [FIXED, ESTIMATED, MIN_MAX, VARIABLE]
    RecurringMaterializationMode:
      type: string
      enum: [AUTO_CREATE, PENDING_APPROVAL, NOTIFY_ONLY]
    RecurringOccurrenceStatus:
      type: string
      description: 'UI labels: Programada, Próxima, Atrasada, Creada, Vinculada, Omitida, Cancelada.'
      enum: [SCHEDULED, DUE, OVERDUE, MATERIALIZED, MATCHED, SKIPPED, CANCELLED]
    RecurringSchedule:
      type: object
      additionalProperties: false
      required: [cadence, startDate]
      properties:
        cadence: { $ref: '#/components/schemas/RecurringCadenceInput' }
        interval: { type: integer, minimum: 1, maximum: 120, default: 1 }
        monthDays:
          type: array
          description: >-
            Days of the month (1–31 or -1 for the last). `SEMIMONTHLY` needs exactly two; the monthly family accepts at
            most one (it replaces the day of the start date). A day 29–31 in a shorter month falls on its last day.
          items: { type: integer, minimum: -1, maximum: 31 }
          maxItems: 2
        rrule:
          type: [string, 'null']
          maxLength: 500
          description: 'Subset of RFC 5545 (FREQ, INTERVAL, BYDAY, BYMONTHDAY, BYSETPOS, COUNT, UNTIL); only with `CUSTOM`.'
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        maxOccurrences:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
        weekendAdjustment: { $ref: '#/components/schemas/RecurringWeekendAdjustment' }
    RecurringSchedulePatch:
      type: object
      description: Partial schedule of a revision; omitted fields keep their value (a new cadence or interval restarts the anchor at the effective date).
      additionalProperties: false
      properties:
        cadence: { $ref: '#/components/schemas/RecurringCadenceInput' }
        interval: { type: integer, minimum: 1, maximum: 120 }
        monthDays:
          type: array
          items: { type: integer, minimum: -1, maximum: 31 }
          maxItems: 2
        rrule: { type: [string, 'null'], maxLength: 500 }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        maxOccurrences: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        weekendAdjustment: { $ref: '#/components/schemas/RecurringWeekendAdjustment' }
    RecurringAmount:
      type: object
      description: >-
        Expected amount: `FIXED`/`ESTIMATED` carry `amount`; `MIN_MAX` carries `min` and `max` (projections use the
        maximum); `VARIABLE` carries none (it is entered when approving). Amounts use the scale of the account currency.
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/RecurringAmountType' }
        amount: { $ref: '#/components/schemas/Money' }
        min: { $ref: '#/components/schemas/Money' }
        max: { $ref: '#/components/schemas/Money' }
    RecurringMaterialization:
      type: object
      additionalProperties: false
      properties:
        mode: { $ref: '#/components/schemas/RecurringMaterializationMode' }
        autoCreateStatus:
          oneOf:
            - type: string
              enum: [PENDING, POSTED]
            - type: 'null'
          description: Only with `AUTO_CREATE` (default `PENDING`).
        leadDays: { type: integer, minimum: 0, maximum: 60, default: 3 }
    RecurringTemplate:
      type: object
      description: Template shared by every occurrence of a version.
      additionalProperties: false
      required: [accountId, amount, schedule]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        toAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Destination account (only `TRANSFER`, same currency, different account).
        amount: { $ref: '#/components/schemas/RecurringAmount' }
        categoryId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        counterpartyId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        tagIds:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Uuid' }
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        schedule: { $ref: '#/components/schemas/RecurringSchedule' }
        materialization: { $ref: '#/components/schemas/RecurringMaterialization' }
    RecurringDefinitionInput:
      type: object
      additionalProperties: false
      required: [name, kind, template]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        kind: { $ref: '#/components/schemas/RecurringKind' }
        template: { $ref: '#/components/schemas/RecurringTemplate' }
    RecurringDefinitionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        matching: { $ref: '#/components/schemas/MatchingTolerancesPatch' }
    RecurringTemplateChanges:
      type: object
      description: Fields of the template to change from the effective date; omitted fields keep the current value.
      additionalProperties: false
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        toAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        amount: { $ref: '#/components/schemas/RecurringAmount' }
        categoryId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        counterpartyId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        tagIds:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Uuid' }
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        schedule: { $ref: '#/components/schemas/RecurringSchedulePatch' }
        materialization: { $ref: '#/components/schemas/RecurringMaterialization' }
    RecurringRevisionRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom, changes]
      properties:
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
        changes: { $ref: '#/components/schemas/RecurringTemplateChanges' }
    RecurringEndRequest:
      type: object
      additionalProperties: false
      properties:
        endDate: { $ref: '#/components/schemas/LocalDate' }
    RecurringDefinitionVersion:
      type: object
      additionalProperties: false
      required: [versionNo, effectiveFrom, accountId, toAccountId, currency, amount, categoryId, counterpartyId, tagIds, paymentMethod, schedule, materialization]
      properties:
        versionNo: { type: integer, minimum: 1 }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        toAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        amount: { $ref: '#/components/schemas/RecurringAmount' }
        indexedPrice:
          description: >-
            Only for definitions managed by a subscription whose price is in another currency than the account: the
            price each occurrence is estimated from (`amount` is then `VARIABLE`). Absent otherwise.
          $ref: '#/components/schemas/Money'
        categoryId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        counterpartyId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        tagIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        schedule:
          type: object
          additionalProperties: false
          required: [cadence, interval, monthDays, rrule, startDate, endDate, maxOccurrences, weekendAdjustment]
          properties:
            cadence: { $ref: '#/components/schemas/RecurringCadence' }
            interval: { type: integer, minimum: 1 }
            monthDays:
              type: array
              items: { type: integer }
            rrule: { type: [string, 'null'] }
            startDate: { $ref: '#/components/schemas/LocalDate' }
            endDate:
              oneOf:
                - $ref: '#/components/schemas/LocalDate'
                - type: 'null'
            maxOccurrences: { type: [integer, 'null'] }
            weekendAdjustment: { $ref: '#/components/schemas/RecurringWeekendAdjustment' }
        materialization:
          type: object
          additionalProperties: false
          required: [mode, autoCreateStatus, leadDays]
          properties:
            mode: { $ref: '#/components/schemas/RecurringMaterializationMode' }
            autoCreateStatus:
              oneOf:
                - type: string
                  enum: [PENDING, POSTED]
                - type: 'null'
            leadDays: { type: integer, minimum: 0 }
    RecurringDefinition:
      type: object
      additionalProperties: false
      required: [id, name, description, notes, kind, managedBy, managedRef, status, currentVersionNo, generatedThrough, endDate, version, createdAt, updatedAt, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/RecurringKind' }
        managedBy:
          type: string
          description: Who administers the definition. Only `USER` today; `SUBSCRIPTION` and `DEBT` are reserved.
          enum: [USER, SUBSCRIPTION, DEBT]
        managedRef:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        status: { $ref: '#/components/schemas/RecurringStatus' }
        currentVersionNo: { type: integer, minimum: 1 }
        generatedThrough:
          description: Last nominal date generated (sliding window high-water mark).
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        current: { $ref: '#/components/schemas/RecurringDefinitionVersion' }
        matching: { $ref: '#/components/schemas/MatchingTolerances' }
        versions:
          type: array
          description: Every version, oldest first (only in the detail).
          items: { $ref: '#/components/schemas/RecurringDefinitionVersion' }
        nextOccurrence:
          description: Next unresolved occurrence (only in the list).
          oneOf:
            - type: object
              additionalProperties: false
              required: [occurrenceDate, dueDate]
              properties:
                occurrenceDate: { $ref: '#/components/schemas/LocalDate' }
                dueDate: { $ref: '#/components/schemas/LocalDate' }
            - type: 'null'
        pendingApprovalCount:
          type: integer
          minimum: 0
          description: Occurrences waiting for approval (only in the list).
        generatedCount:
          type: integer
          minimum: 0
          description: Occurrences generated by the request (create, resume).
    # ── Matching sugerido (add-commitment-matching) ──
    MatchingTolerances:
      type: object
      description: >-
        Tolerances of the suggested matching of a definition; `null` = the default of the amount type (`FIXED` 2 %,
        `ESTIMATED` 25 %, `MIN_MAX` 5 % over the range; window 5 days).
      additionalProperties: false
      required: [amountTolerancePercent, dateWindowDays]
      properties:
        amountTolerancePercent:
          oneOf:
            - type: string
              pattern: '^(100([.]00?)?|[0-9]{1,2}([.][0-9]{1,2})?)$'
              examples: ['5.00']
            - type: 'null'
        dateWindowDays:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 15
            - type: 'null'
    MatchingTolerancesPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        amountTolerancePercent:
          oneOf:
            - type: string
              pattern: '^(100([.]00?)?|[0-9]{1,2}([.][0-9]{1,2})?)$'
            - type: 'null'
        dateWindowDays:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 15
            - type: 'null'
    MatchSuggestionStatus:
      type: string
      enum: [PROPOSED, CONFIRMED, DISMISSED, EXPIRED]
    MatchConfidence:
      type: string
      description: '`HIGH` ≥ 80, `MEDIUM` ≥ 60, `LOW` < 60 (the score is explainable: amount 0..50, date 0..30, counterparty 10 or 20).'
      enum: [HIGH, MEDIUM, LOW]
    MatchExpireReason:
      type: string
      enum: [TRANSACTION_VOIDED, OCCURRENCE_RESOLVED, OCCURRENCE_CANCELLED, INCOMPATIBLE, SUPERSEDED]
    MatchSuggestionOccurrence:
      type: object
      additionalProperties: false
      required: [id, definitionId, definitionName, kind, status, dueDate, expected, accountId, toAccountId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        definitionId: { $ref: '#/components/schemas/Uuid' }
        definitionName: { type: string }
        kind: { $ref: '#/components/schemas/RecurringKind' }
        status: { $ref: '#/components/schemas/RecurringOccurrenceStatus' }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        expected: { $ref: '#/components/schemas/RecurringAmount' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        toAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    MatchSuggestionTransaction:
      type: object
      additionalProperties: false
      required: [id, kind, status, businessDate, amount, accountId, toAccountId, counterpartyId, source]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string }
        status: { type: string }
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        amount: { $ref: '#/components/schemas/Money' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        toAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        counterpartyId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        source:
          type: string
          description: Origin of the transaction (`MANUAL`, `IMPORT`, …).
    MatchSuggestionReasons:
      type: object
      description: Why it matches (explainable, no ML).
      additionalProperties: false
      required: [amountDelta, dateDeltaDays, counterparty]
      properties:
        amountDelta:
          description: Absolute difference against the expected amount (distance to the range of a `MIN_MAX`); null for `VARIABLE`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        dateDeltaDays:
          type: integer
          minimum: 0
          maximum: 15
        counterparty:
          type: string
          description: '`MATCH` both have the same counterparty; `UNKNOWN` one of them has none (a different one is never suggested).'
          enum: [MATCH, UNKNOWN]
    MatchSuggestion:
      type: object
      additionalProperties: false
      required: [id, occurrence, transaction, score, confidence, reasons, ambiguous, status, expireReason, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurrence:
          oneOf:
            - $ref: '#/components/schemas/MatchSuggestionOccurrence'
            - type: 'null'
        transaction:
          oneOf:
            - $ref: '#/components/schemas/MatchSuggestionTransaction'
            - type: 'null'
        score:
          type: string
          pattern: '^(100[.]00|[0-9]{1,2}[.][0-9]{2})$'
          examples: ['85.00']
        confidence: { $ref: '#/components/schemas/MatchConfidence' }
        reasons: { $ref: '#/components/schemas/MatchSuggestionReasons' }
        ambiguous:
          type: boolean
          description: The two best candidates of the set have the same score.
        status: { $ref: '#/components/schemas/MatchSuggestionStatus' }
        expireReason:
          oneOf:
            - $ref: '#/components/schemas/MatchExpireReason'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Instant' }
        version: { $ref: '#/components/schemas/Version' }
    MatchSuggestionPage:
      type: object
      additionalProperties: false
      required: [data, page, proposedCount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MatchSuggestion' }
        page: { $ref: '#/components/schemas/PageInfo' }
        proposedCount:
          type: integer
          minimum: 0
          description: Pending (`PROPOSED`) suggestions of the workspace.
    MatchSuggestionConfirmResult:
      type: object
      additionalProperties: false
      required: [suggestion, occurrence]
      properties:
        suggestion: { $ref: '#/components/schemas/MatchSuggestion' }
        occurrence: { $ref: '#/components/schemas/RecurringOccurrence' }
    # ── Imports: importación CSV básica (openspec add-basic-csv-import) ──
    ImportJobStatus:
      type: string
      # x-extensible-enum (convención reconocida por oasdiff, como ErrorCode): Phase 6 agrega los estados del pipeline
      # completo (CREATED, UPLOADED, PARSING, NORMALIZING, VALIDATING, MATCHING, CLASSIFYING, RECONCILING, …).
      x-extensible-enum:
        - AWAITING_MAPPING
        - AWAITING_REVIEW
        - APPROVED
        - PERSISTING
        - COMPLETED
        - PARTIALLY_FAILED
        - COMPLETED_WITH_ERRORS
        - CANCELLED
      description: |
        `AWAITING_MAPPING → AWAITING_REVIEW` (the mapping can be sent again) `→ APPROVED → PERSISTING → COMPLETED |
        PARTIALLY_FAILED`; `PARTIALLY_FAILED → PERSISTING` (retry) `| COMPLETED_WITH_ERRORS` (accept);
        `AWAITING_* → CANCELLED` (user or expiration).
    ImportRowClassification:
      type: string
      enum: [NEW, DUPLICATE_EXACT, DUPLICATE_PROBABLE, INVALID]
      description: >-
        `NEW` (will be created), `DUPLICATE_EXACT` (already imported: the fingerprint is linked to a live transaction),
        `DUPLICATE_PROBABLE` (an existing movement of the account has the same amount, direction and a date within 3
        days: the user decides) or `INVALID` (never imported).
    ImportRowDecision:
      type: string
      enum: [CREATE, SKIP, EXCLUDE]
    ImportRowIssueCode:
      type: string
      x-extensible-enum:
        - IMPORT_INVALID_DATE
        - IMPORT_INVALID_AMOUNT
        - IMPORT_FUTURE_DATE
        - PERIOD_CLOSED
        - ACCOUNT_CLOSED
        - IMPORT_DESCRIPTION_TRUNCATED
    ImportRowIssue:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code: { $ref: '#/components/schemas/ImportRowIssueCode' }
        severity:
          type: string
          enum: [ERROR, WARNING]
          description: An `ERROR` makes the row invalid; a `WARNING` (truncated description) does not block it.
    ImportWarning:
      type: object
      additionalProperties: false
      required: [code, previousImportId, previousImportedAt]
      properties:
        code:
          type: string
          x-extensible-enum: [IMPORT_FILE_ALREADY_IMPORTED]
        previousImportId: { $ref: '#/components/schemas/Uuid' }
        previousImportedAt:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: Business date (workspace timezone) on which the previous import ended.
    ImportCounters:
      type: object
      additionalProperties: false
      required: [rows, newRows, alreadyImported, probableDuplicates, invalid, toCreate, skipped, excluded, created, failed]
      properties:
        rows: { type: integer, minimum: 0, description: Data rows of the file (after the skipped records and the header). }
        newRows: { type: integer, minimum: 0 }
        alreadyImported: { type: integer, minimum: 0 }
        probableDuplicates: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
        toCreate: { type: integer, minimum: 0, description: Rows decided `CREATE`. }
        skipped: { type: integer, minimum: 0, description: Possible duplicates skipped (linked with their existing movement). }
        excluded: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0, description: Transactions created by the persistence. }
        failed: { type: integer, minimum: 0, description: Rows a rejected batch left out. }
    ImportProgress:
      type: object
      additionalProperties: false
      required: [attempt, batchCount, batchesDone]
      properties:
        attempt: { type: integer, minimum: 0, description: '0 before the approval, 1 for the first persistence, +1 per retry.' }
        batchCount: { type: integer, minimum: 0 }
        batchesDone: { type: integer, minimum: 0 }
    ImportErrorGroup:
      type: object
      additionalProperties: false
      required: [code, count, lines]
      properties:
        code: { type: string, description: Domain error code of the rejected batch (e.g. `PERIOD_CLOSED`). }
        count: { type: integer, minimum: 1 }
        lines:
          type: array
          maxItems: 100
          items: { type: integer, minimum: 1 }
          description: First lines of the file affected.
    ImportMapping:
      type: object
      additionalProperties: false
      required: [hasHeader, columns, dateFormat, decimalSeparator]
      description: >-
        `imports.mapping.v1`: the shape of the mapping profiles of docs/13 §5.1 (Phase 6 can save it as a profile).
        Column indexes are 0-based.
      properties:
        hasHeader: { type: boolean }
        skipRows:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
          description: Leading records skipped BEFORE the header (bank preamble).
        columns:
          type: object
          additionalProperties: false
          required: [date, description, amount]
          properties:
            date: { $ref: '#/components/schemas/ImportColumnRef' }
            description: { $ref: '#/components/schemas/ImportColumnRef' }
            amount:
              oneOf:
                - $ref: '#/components/schemas/ImportSignedAmountColumn'
                - $ref: '#/components/schemas/ImportDebitCreditColumns'
              discriminator:
                propertyName: mode
                mapping:
                  SIGNED: '#/components/schemas/ImportSignedAmountColumn'
                  DEBIT_CREDIT: '#/components/schemas/ImportDebitCreditColumns'
        dateFormat:
          type: string
          enum: [dd/MM/yyyy, dd-MM-yyyy, dd/MM/yy, yyyy-MM-dd, MM/dd/yyyy]
          description: Strict format; `dd/MM/yy` uses the pivot 2000–2099.
        decimalSeparator:
          type: string
          enum: [',', '.']
          description: The other character is the optional thousands separator.
    ImportColumnRef:
      type: object
      additionalProperties: false
      required: [index]
      properties:
        index: { type: integer, minimum: 0, maximum: 199 }
    ImportSignedAmountColumn:
      type: object
      additionalProperties: false
      required: [mode, index, signConvention]
      properties:
        mode: { type: string, enum: [SIGNED] }
        index: { type: integer, minimum: 0, maximum: 199 }
        signConvention:
          type: string
          enum: [NEGATIVE_IS_OUTFLOW, POSITIVE_IS_OUTFLOW]
    ImportDebitCreditColumns:
      type: object
      additionalProperties: false
      required: [mode, debitIndex, creditIndex]
      properties:
        mode: { type: string, enum: [DEBIT_CREDIT] }
        debitIndex: { type: integer, minimum: 0, maximum: 199, description: Outflow column. }
        creditIndex: { type: integer, minimum: 0, maximum: 199, description: Inflow column. }
    ImportJob:
      type: object
      required:
        - id
        - accountId
        - status
        - originalName
        - fileSha256
        - fileSizeBytes
        - detected
        - rowCount
        - columnCount
        - header
        - mapping
        - counters
        - progress
        - errors
        - warnings
        - approvedBy
        - approvedAt
        - completedAt
        - cancelledAt
        - cancelledBy
        - expiresAt
        - createdBy
        - createdAt
        - updatedAt
        - version
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ImportJobStatus' }
        originalName:
          type: [string, 'null']
          maxLength: 255
          description: Original file name, sanitized (no path, no control characters). Untrusted text.
        fileSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        fileSizeBytes: { type: integer, minimum: 0 }
        detected:
          type: object
          additionalProperties: false
          required: [encoding, delimiter]
          properties:
            encoding: { type: string, enum: [utf-8, windows-1252] }
            delimiter: { type: string, enum: [',', ';', "\t", '|'] }
        rowCount:
          type: integer
          minimum: 0
          description: Records of the file after the first one (informational; the data rows depend on the mapping).
        columnCount: { type: integer, minimum: 1 }
        header:
          type: array
          items: { type: string }
          description: First record of the file. Untrusted text.
        mapping:
          oneOf:
            - $ref: '#/components/schemas/ImportMapping'
            - type: 'null'
        counters: { $ref: '#/components/schemas/ImportCounters' }
        progress: { $ref: '#/components/schemas/ImportProgress' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportErrorGroup' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ImportWarning' }
        approvedBy:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        approvedAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        cancelledAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        cancelledBy:
          type: [string, 'null']
          description: The user id, or `SYSTEM` when the review expired.
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        version: { $ref: '#/components/schemas/Version' }
    ImportCreated:
      description: The import just created, with the first rows of the file to build the mapping.
      allOf:
        - $ref: '#/components/schemas/ImportJob'
        - type: object
          required: [sampleRows, suggestedMapping]
          properties:
            sampleRows:
              type: array
              maxItems: 20
              items:
                type: array
                items: { type: string }
              description: Up to 20 records after the first one. Untrusted text, always escaped by the UI.
            suggestedMapping:
              oneOf:
                - $ref: '#/components/schemas/ImportMapping'
                - type: 'null'
              description: Mapping of the last import of the account when it fits this file.
    ImportMapped:
      description: The import in review plus the summary of its preview.
      allOf:
        - $ref: '#/components/schemas/ImportJob'
        - type: object
          required: [previewSummary]
          properties:
            previewSummary: { $ref: '#/components/schemas/ImportPreviewSummary' }
    ImportPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ImportJob' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ImportPreviewSummary:
      type: object
      additionalProperties: false
      required: [counts, outflows, inflows, currentBalance, resultingBalance]
      properties:
        counts:
          type: object
          additionalProperties: false
          required:
            [rows, new, alreadyImported, probableDuplicates, invalid, pendingDecisions, toCreate, skipped, excluded]
          properties:
            rows: { type: integer, minimum: 0 }
            new: { type: integer, minimum: 0 }
            alreadyImported: { type: integer, minimum: 0 }
            probableDuplicates: { type: integer, minimum: 0 }
            invalid: { type: integer, minimum: 0 }
            pendingDecisions: { type: integer, minimum: 0, description: Possible duplicates without a decision. }
            toCreate: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
            excluded: { type: integer, minimum: 0 }
        outflows:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Σ of the outflows of the rows to create, in the currency of the account.
        inflows:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Σ of the inflows of the rows to create.
        currentBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Ledger balance of the account (presented; debt positive for a liability).
        resultingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Current balance after the rows to create (assets add inflows and subtract outflows; liabilities the opposite).
    ImportPreviewCandidate:
      type: object
      additionalProperties: false
      required: [transactionId, kind, date, amount, description]
      description: The existing movement of the account (or its leg) that the row would duplicate. Only the id when it can no longer be resolved.
      properties:
        transactionId: { $ref: '#/components/schemas/Uuid' }
        kind:
          type: [string, 'null']
          description: INCOME, EXPENSE, REFUND, ADJUSTMENT, TRANSFER or CONVERSION.
        date:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        description: { type: [string, 'null'] }
    ImportPreviewRow:
      type: object
      required:
        - id
        - lineNumber
        - date
        - description
        - amount
        - direction
        - classification
        - decision
        - issues
        - candidate
        - transactionId
        - failure
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        lineNumber: { type: integer, minimum: 1, description: Line of the file where the record starts. }
        date:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        description:
          type: [string, 'null']
          description: 'Normalized description (untrusted text, the UI always escapes it).'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Always positive; `direction` gives the sense.
        direction:
          type: [string, 'null']
          enum: [IN, OUT, null]
        classification: { $ref: '#/components/schemas/ImportRowClassification' }
        decision:
          oneOf:
            - $ref: '#/components/schemas/ImportRowDecision'
            - type: 'null'
          description: '`null` for a possible duplicate without a decision.'
        issues:
          type: array
          items: { $ref: '#/components/schemas/ImportRowIssue' }
        candidate:
          oneOf:
            - $ref: '#/components/schemas/ImportPreviewCandidate'
            - type: 'null'
        transactionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The transaction created for the row, once persisted.
        failure:
          oneOf:
            - type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
            - type: 'null'
          description: Why the batch of the row was rejected, if it was.
    ImportPreview:
      type: object
      additionalProperties: false
      required: [summary, rows, nextCursor]
      properties:
        summary: { $ref: '#/components/schemas/ImportPreviewSummary' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImportPreviewRow' }
        nextCursor: { type: [string, 'null'] }
    ImportRowDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/ImportRowDecision' }
    ImportRowDecisionResult:
      allOf:
        - $ref: '#/components/schemas/ImportPreviewRow'
        - type: object
          required: [version, counters]
          properties:
            version:
              allOf:
                - $ref: '#/components/schemas/Version'
              description: Version of the IMPORT after the decision (the ETag of the response).
            counters: { $ref: '#/components/schemas/ImportCounters' }
    # ── Suscripciones (add-subscriptions) ──
    SubscriptionStatus:
      type: string
      enum: [TRIAL, ACTIVE, PAUSED, CANCELLED]
      description: >-
        `CANCELLED` is terminal. A cancellation at the end of the paid cycle is the attribute `scheduledCancellationOn`,
        not a status; there is no `expired` status.
    SubscriptionBillingCycle:
      type: object
      additionalProperties: false
      required: [cadence, interval, monthDays, rrule]
      properties:
        cadence: { $ref: '#/components/schemas/RecurringCadence' }
        interval: { type: integer, minimum: 1, maximum: 120 }
        monthDays:
          type: array
          items: { type: integer, minimum: -1, maximum: 31 }
          maxItems: 2
        rrule: { type: [string, 'null'], maxLength: 500 }
    SubscriptionBillingCycleInput:
      type: object
      additionalProperties: false
      required: [cadence]
      properties:
        cadence: { $ref: '#/components/schemas/RecurringCadenceInput' }
        interval: { type: integer, minimum: 1, maximum: 120, default: 1 }
        monthDays:
          type: array
          items: { type: integer, minimum: -1, maximum: 31 }
          maxItems: 2
        rrule: { type: [string, 'null'], maxLength: 500 }
    SubscriptionReminder:
      type: object
      additionalProperties: false
      required: [enabled, daysBefore]
      properties:
        enabled: { type: boolean }
        daysBefore: { type: integer, minimum: 1, maximum: 30 }
    SubscriptionReminderPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        daysBefore: { type: integer, minimum: 1, maximum: 30 }
    SubscriptionPriceTolerance:
      type: string
      pattern: '^[0-9]{1,2}(\.[0-9]{1,2})?$'
      description: Percentage 0.00–50.00 (default 1.00). A charge differs only when it is strictly greater than the tolerance.
      examples: ['1.00']
    SubscriptionPrice:
      type: object
      description: Entry of the immutable price history (append-only).
      additionalProperties: false
      required: [id, effectiveFrom, price, origin, supersedesId, supersededBy, proposalId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
        price: { $ref: '#/components/schemas/Money' }
        origin:
          type: string
          enum: [INITIAL, MANUAL, PROPOSAL, CORRECTION]
        supersedesId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        supersededBy:
          description: Id of the entry that replaces this one (when it was corrected).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        proposalId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    SubscriptionPriceProposal:
      type: object
      additionalProperties: false
      required: [id, chargeId, effectiveFrom, previousPrice, proposedPrice, changePercent, status, decidedAt, decidedBy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        chargeId: { $ref: '#/components/schemas/Uuid' }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
        previousPrice: { $ref: '#/components/schemas/Money' }
        proposedPrice: { $ref: '#/components/schemas/Money' }
        changePercent:
          type: string
          pattern: '^[+-][0-9]+\.[0-9]{2}$'
          examples: ['+20.02']
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, SUPERSEDED, WITHDRAWN]
        decidedAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        decidedBy:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Subscription:
      type: object
      additionalProperties: false
      required:
        - id
        - definitionId
        - counterpartyId
        - providerName
        - name
        - planName
        - status
        - currentPrice
        - billingCycle
        - paymentAccountId
        - paymentAccountName
        - accountCurrency
        - nextRenewalOn
        - trialEndsOn
        - scheduledCancellationOn
        - cancelledOn
        - cancellationReason
        - cancellationUrl
        - reminder
        - priceTolerancePercent
        - version
        - createdAt
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        definitionId: { $ref: '#/components/schemas/Uuid' }
        counterpartyId: { $ref: '#/components/schemas/Uuid' }
        providerName: { type: [string, 'null'] }
        name: { type: string }
        planName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        currentPrice:
          description: Price in force today (before the first renewal, the first entry).
          $ref: '#/components/schemas/Money'
        billingCycle: { $ref: '#/components/schemas/SubscriptionBillingCycle' }
        paymentAccountId: { $ref: '#/components/schemas/Uuid' }
        paymentAccountName: { type: [string, 'null'] }
        accountCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        nextRenewalOn:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        trialEndsOn:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        scheduledCancellationOn:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        cancelledOn:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        cancellationReason: { type: [string, 'null'], maxLength: 500 }
        cancellationUrl: { type: [string, 'null'], maxLength: 500 }
        reminder: { $ref: '#/components/schemas/SubscriptionReminder' }
        priceTolerancePercent: { $ref: '#/components/schemas/SubscriptionPriceTolerance' }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        priceHistory:
          type: array
          description: Every entry, including the superseded ones (only in the detail).
          items: { $ref: '#/components/schemas/SubscriptionPrice' }
        pendingProposal:
          description: The pending price proposal, if any (only in the detail).
          oneOf:
            - $ref: '#/components/schemas/SubscriptionPriceProposal'
            - type: 'null'
        definition:
          type: object
          description: Recurring definition that generates the charges (only in the detail).
          additionalProperties: false
          required: [id, status, materialization, accountId, accountCurrency, categoryId, indexed]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/RecurringStatus' }
            materialization:
              type: object
              additionalProperties: false
              required: [mode, autoCreateStatus, leadDays]
              properties:
                mode: { $ref: '#/components/schemas/RecurringMaterializationMode' }
                autoCreateStatus: { type: [string, 'null'], enum: [PENDING, POSTED, null] }
                leadDays: { type: integer, minimum: 0, maximum: 60 }
            accountId: { $ref: '#/components/schemas/Uuid' }
            accountCurrency: { $ref: '#/components/schemas/CurrencyCode' }
            categoryId:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            indexed:
              type: boolean
              description: True when the price currency differs from the account currency (each charge is estimated with the rate valid when it is generated).
    SubscriptionPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SubscriptionInput:
      type: object
      additionalProperties: false
      required: [counterpartyId, name, price, billingCycle, firstRenewalOn, paymentAccountId]
      properties:
        counterpartyId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        planName: { type: [string, 'null'], maxLength: 120 }
        price: { $ref: '#/components/schemas/PositiveMoney' }
        billingCycle: { $ref: '#/components/schemas/SubscriptionBillingCycleInput' }
        firstRenewalOn: { $ref: '#/components/schemas/LocalDate' }
        paymentAccountId: { $ref: '#/components/schemas/Uuid' }
        materialization: { $ref: '#/components/schemas/RecurringMaterialization' }
        categoryId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        trialEndsOn:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        reminder: { $ref: '#/components/schemas/SubscriptionReminderPatch' }
        priceTolerancePercent: { $ref: '#/components/schemas/SubscriptionPriceTolerance' }
        cancellationUrl: { type: [string, 'null'], maxLength: 500 }
    SubscriptionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        planName: { type: [string, 'null'], maxLength: 120 }
        categoryId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        materialization: { $ref: '#/components/schemas/RecurringMaterialization' }
        reminder: { $ref: '#/components/schemas/SubscriptionReminderPatch' }
        priceTolerancePercent: { $ref: '#/components/schemas/SubscriptionPriceTolerance' }
        cancellationUrl: { type: [string, 'null'], maxLength: 500 }
        paymentAccountId: { $ref: '#/components/schemas/Uuid' }
        billingCycle: { $ref: '#/components/schemas/SubscriptionBillingCycleInput' }
        effectiveFrom:
          description: Required with `paymentAccountId` or `billingCycle`.
          $ref: '#/components/schemas/LocalDate'
    SubscriptionPriceInput:
      type: object
      additionalProperties: false
      required: [price, effectiveFrom]
      properties:
        price: { $ref: '#/components/schemas/PositiveMoney' }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
    SubscriptionPriceSupersedeRequest:
      type: object
      additionalProperties: false
      required: [price]
      properties:
        price: { $ref: '#/components/schemas/PositiveMoney' }
        reason: { type: string, maxLength: 500 }
    SubscriptionPriceProposalAcceptRequest:
      type: object
      additionalProperties: false
      properties:
        effectiveFrom:
          description: Needed only when the proposed date is not after the last price entry.
          $ref: '#/components/schemas/LocalDate'
    SubscriptionCancelRequest:
      type: object
      additionalProperties: false
      properties:
        effectiveOn:
          description: Today or earlier cancels now (default today); a future date schedules the cancellation.
          $ref: '#/components/schemas/LocalDate'
        reason: { type: string, maxLength: 500 }
    SubscriptionChargeUpdate:
      type: object
      additionalProperties: false
      required: [priceCurrencyAmount]
      properties:
        priceCurrencyAmount:
          description: Amount of the statement in the price currency.
          $ref: '#/components/schemas/PositiveMoney'
    SubscriptionCharge:
      type: object
      additionalProperties: false
      required: [id, occurrenceId, occurrenceDate, transactionId, charged, priceCurrencyAmount, expectedPrice, impliedRate, deviationPercent, outcome]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurrenceId: { $ref: '#/components/schemas/Uuid' }
        occurrenceDate: { $ref: '#/components/schemas/LocalDate' }
        transactionId: { $ref: '#/components/schemas/Uuid' }
        charged: { $ref: '#/components/schemas/Money' }
        priceCurrencyAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        expectedPrice: { $ref: '#/components/schemas/Money' }
        impliedRate:
          description: Charged / price, 4 decimals (only when the charge currency differs from the price currency).
          type: [string, 'null']
          examples: ['9.8726']
        deviationPercent:
          type: [string, 'null']
          pattern: '^[+-][0-9]+\.[0-9]{2}$'
        outcome:
          type: string
          enum: [WITHIN_TOLERANCE, PRICE_CHANGE_DETECTED, NOT_COMPARABLE]
    SubscriptionChargePage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionCharge' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SubscriptionCostAmounts:
      type: object
      additionalProperties: false
      required: [native, base]
      properties:
        native: { $ref: '#/components/schemas/Money' }
        base:
          description: In the base currency; null when there is no rate for the pair (never 1:1).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    SubscriptionCostItem:
      type: object
      additionalProperties: false
      required: [subscriptionId, name, status, monthly, annual, complete]
      properties:
        subscriptionId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        monthly: { $ref: '#/components/schemas/SubscriptionCostAmounts' }
        annual: { $ref: '#/components/schemas/SubscriptionCostAmounts' }
        complete: { type: boolean }
    SubscriptionCostSummary:
      type: object
      additionalProperties: false
      required: [baseCurrency, items, totals, afterTrial, meta]
      properties:
        baseCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionCostItem' }
        totals:
          type: object
          additionalProperties: false
          required: [monthly, annual, complete, unconverted]
          properties:
            monthly: { $ref: '#/components/schemas/Money' }
            annual: { $ref: '#/components/schemas/Money' }
            complete: { type: boolean }
            unconverted:
              type: array
              description: The part without rate, in its own currency.
              items:
                type: object
                additionalProperties: false
                required: [monthly, annual]
                properties:
                  monthly: { $ref: '#/components/schemas/Money' }
                  annual: { $ref: '#/components/schemas/Money' }
        afterTrial:
          type: object
          description: Subscriptions in trial, with the price of their first renewal; they are not part of the total.
          additionalProperties: false
          required: [items, monthly, annual, complete]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SubscriptionCostItem' }
            monthly: { $ref: '#/components/schemas/Money' }
            annual: { $ref: '#/components/schemas/Money' }
            complete: { type: boolean }
        meta:
          type: object
          additionalProperties: false
          required: [ratesUsed, rateWindowDays, asOf]
          properties:
            ratesUsed:
              type: array
              items: { $ref: '#/components/schemas/ResolvedRate' }
            rateWindowDays: { type: integer, minimum: 1 }
            asOf: { $ref: '#/components/schemas/Instant' }
    RecurringDefinitionPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RecurringDefinition' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RecurringRevisionResult:
      type: object
      additionalProperties: false
      required: [definition, rewritten, cancelled, created, reinstated, resetOverrides]
      properties:
        definition: { $ref: '#/components/schemas/RecurringDefinition' }
        rewritten: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0 }
        reinstated: { type: integer, minimum: 0 }
        resetOverrides:
          type: integer
          minimum: 0
          description: Occurrences whose individual edits were discarded by the rewrite.
    RecurringOccurrence:
      type: object
      additionalProperties: false
      required:
        - id
        - definitionId
        - definitionName
        - kind
        - managedBy
        - occurrenceDate
        - dueDate
        - definitionVersionNo
        - expected
        - projectedAmount
        - status
        - cancelReason
        - requiresApproval
        - mode
        - overridden
        - accountId
        - toAccountId
        - transactionId
        - resolution
        - matchedBy
        - skipReason
        - lastAutoCreateError
        - version
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        definitionId: { $ref: '#/components/schemas/Uuid' }
        definitionName: { type: string }
        kind: { $ref: '#/components/schemas/RecurringKind' }
        managedBy:
          type: string
          enum: [USER, SUBSCRIPTION, DEBT]
        occurrenceDate:
          description: 'Nominal date (before the weekend adjustment): the idempotency key of the occurrence.'
          $ref: '#/components/schemas/LocalDate'
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        definitionVersionNo: { type: integer, minimum: 1 }
        expected: { $ref: '#/components/schemas/RecurringAmount' }
        projectedAmount:
          description: Amount projections use (the maximum of a `MIN_MAX`); null for `VARIABLE`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status: { $ref: '#/components/schemas/RecurringOccurrenceStatus' }
        cancelReason:
          oneOf:
            - type: string
              enum: [PAUSED, SUPERSEDED, ENDED]
            - type: 'null'
        requiresApproval:
          type: boolean
          description: '`DUE`/`OVERDUE` in a definition with `PENDING_APPROVAL` mode (the approval tray).'
        mode: { $ref: '#/components/schemas/RecurringMaterializationMode' }
        overridden:
          type: boolean
          description: The amount or the due date of this occurrence was edited individually.
        accountId: { $ref: '#/components/schemas/Uuid' }
        toAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        transactionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        resolution:
          oneOf:
            - type: string
              enum: [CREATED, MATCHED, SKIPPED]
            - type: 'null'
        matchedBy:
          oneOf:
            - type: string
              enum: [USER_LINK, SUGGESTION]
            - type: 'null'
        skipReason: { type: [string, 'null'] }
        lastAutoCreateError:
          type: [string, 'null']
          description: Error code of the last automatic creation that Transactions rejected (e.g. `PERIOD_CLOSED`).
        version: { $ref: '#/components/schemas/Version' }
    RecurringOccurrencePage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RecurringOccurrence' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RecurringOccurrenceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        expectedAmount: { $ref: '#/components/schemas/Money' }
        expectedMin: { $ref: '#/components/schemas/Money' }
        expectedMax: { $ref: '#/components/schemas/Money' }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
    RecurringMaterializeRequest:
      type: object
      additionalProperties: false
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        status:
          type: string
          enum: [PENDING, POSTED]
    RecurringMaterializeResult:
      type: object
      additionalProperties: false
      required: [occurrence, transactionId]
      properties:
        occurrence: { $ref: '#/components/schemas/RecurringOccurrence' }
        transactionId: { $ref: '#/components/schemas/Uuid' }
    RecurringSkipRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }
    RecurringLinkRequest:
      type: object
      additionalProperties: false
      required: [transactionId]
      properties:
        transactionId: { $ref: '#/components/schemas/Uuid' }
    CommittedItem:
      type: object
      additionalProperties: false
      required: [source, id, definitionId, name, kind, date, amount, status]
      properties:
        source:
          type: string
          enum: [OCCURRENCE, PENDING]
        id: { $ref: '#/components/schemas/Uuid' }
        definitionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        name: { type: [string, 'null'] }
        kind: { type: string }
        date: { $ref: '#/components/schemas/LocalDate' }
        amount:
          description: Amount that adds up (the maximum of a `MIN_MAX`); null for `VARIABLE`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status:
          oneOf:
            - $ref: '#/components/schemas/RecurringOccurrenceStatus'
            - type: 'null'
    CommittedAmount:
      type: object
      additionalProperties: false
      required: [periodId, periodLabel, periodStart, periodEnd, byCurrency, consolidated, expectedIncome, withoutAmountCount, items, ratesUsed, generatedAt]
      properties:
        periodId: { $ref: '#/components/schemas/Uuid' }
        periodLabel: { type: string }
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        byCurrency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, occurrences, pending, total]
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              occurrences: { $ref: '#/components/schemas/Money' }
              pending: { $ref: '#/components/schemas/Money' }
              total: { $ref: '#/components/schemas/Money' }
        consolidated:
          type: object
          additionalProperties: false
          required: [amount, complete, unconverted]
          properties:
            amount: { $ref: '#/components/schemas/Money' }
            complete:
              type: boolean
              description: False when a part had no valuation rate (it is listed in `unconverted`, never converted 1:1).
            unconverted:
              type: array
              items: { $ref: '#/components/schemas/Money' }
        expectedIncome:
          type: array
          description: Unresolved income occurrences of the period by currency (informative, not subtracted).
          items: { $ref: '#/components/schemas/Money' }
        withoutAmountCount:
          type: integer
          minimum: 0
          description: '`VARIABLE` occurrences that do not add up ("N payments without amount").'
        items:
          type: array
          description: Composition of the total (explainable).
          items: { $ref: '#/components/schemas/CommittedItem' }
        ratesUsed:
          type: array
          items: { $ref: '#/components/schemas/ResolvedRate' }
        generatedAt: { $ref: '#/components/schemas/Instant' }

    # ── Debt: préstamos (openspec add-loans) ──
    LoanStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAID_OFF, CANCELLED]
      x-extensible-enum: true
    LoanMethod:
      type: string
      description: Only `FRENCH` is available in Phase 4; the others answer 422 `LOAN_METHOD_NOT_AVAILABLE`.
      enum: [FRENCH, GERMAN, FIXED_PRINCIPAL, CUSTOM]
    LoanRateType:
      type: string
      enum: [FIXED, VARIABLE]
    LoanDayCount:
      type: string
      description: 30/360 European (default), actual/360 or actual/365.
      enum: [D30_360, ACT_360, ACT_365]
    LoanFrequency:
      type: string
      enum: [MONTHLY, BIMONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL]
    LoanPaymentBreakdown:
      type: object
      additionalProperties: false
      required: [principal, interest, fees, insurance, taxes]
      properties:
        principal: { $ref: '#/components/schemas/Money' }
        interest: { $ref: '#/components/schemas/Money' }
        fees: { $ref: '#/components/schemas/Money' }
        insurance: { $ref: '#/components/schemas/Money' }
        taxes: { $ref: '#/components/schemas/Money' }
    LoanChargeSpec:
      type: object
      description: A per-installment charge. `FIXED`, `value` is the amount per installment in the loan currency; `RATE_ON_BALANCE`, `value` is the MONTHLY rate as a decimal fraction ("0.0004" = 0.0400 %) over the balance at the start of the period.
      additionalProperties: false
      required: [mode, value]
      properties:
        mode: { type: string, enum: [FIXED, RATE_ON_BALANCE] }
        value: { $ref: '#/components/schemas/PositiveDecimalString' }
    LoanCharges:
      type: object
      additionalProperties: false
      properties:
        fees: { $ref: '#/components/schemas/LoanChargeSpec' }
        insurance: { $ref: '#/components/schemas/LoanChargeSpec' }
        taxes: { $ref: '#/components/schemas/LoanChargeSpec' }
    LoanAccountRef:
      type: object
      description: An existing `loan` account (`id`) or an account created in the same act (`create`).
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        create:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            institutionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    LoanExistingInput:
      type: object
      description: Ongoing loan (`origin = EXISTING`) declaration. `principal` is the outstanding principal at `asOf`; `termInstallments` the remaining installments; `firstDueDate` the due date of installment `nextInstallmentNo`.
      additionalProperties: false
      required: [asOf, nextInstallmentNo]
      properties:
        asOf: { $ref: '#/components/schemas/LocalDate' }
        nextInstallmentNo: { type: integer, minimum: 1 }
    LoanPreviewInput:
      type: object
      description: Loan terms; the same fields as `LoanInput` without accounts.
      additionalProperties: false
      required: [name, principal, annualRate, termInstallments, firstDueDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        origin: { type: string, enum: [NEW, EXISTING], default: NEW }
        principal: { $ref: '#/components/schemas/PositiveMoney' }
        annualRate: { $ref: '#/components/schemas/DecimalString' }
        rateType: { $ref: '#/components/schemas/LoanRateType' }
        dayCount: { $ref: '#/components/schemas/LoanDayCount' }
        frequency: { $ref: '#/components/schemas/LoanFrequency' }
        termInstallments: { type: integer, minimum: 1, maximum: 600 }
        method: { $ref: '#/components/schemas/LoanMethod' }
        disbursementDate: { $ref: '#/components/schemas/LocalDate' }
        firstDueDate: { $ref: '#/components/schemas/LocalDate' }
        charges: { $ref: '#/components/schemas/LoanCharges' }
        existing: { $ref: '#/components/schemas/LoanExistingInput' }
    LoanInput:
      type: object
      description: |
        `annualRate` is a decimal fraction between 0 and 1 ("0.115" = 11.50 % nominal annual). New loans need `disbursementDate`; ongoing loans need `existing`
        and take `existing.asOf` as the accrual start. The first due date must be after the disbursement date.
      additionalProperties: false
      required: [name, account, disbursementAccountId, principal, annualRate, termInstallments, firstDueDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        origin: { type: string, enum: [NEW, EXISTING], default: NEW }
        account: { $ref: '#/components/schemas/LoanAccountRef' }
        disbursementAccountId: { $ref: '#/components/schemas/Uuid' }
        paymentAccountId: { $ref: '#/components/schemas/Uuid' }
        lenderCounterpartyId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        principal: { $ref: '#/components/schemas/PositiveMoney' }
        annualRate: { $ref: '#/components/schemas/DecimalString' }
        rateType: { $ref: '#/components/schemas/LoanRateType' }
        dayCount: { $ref: '#/components/schemas/LoanDayCount' }
        frequency: { $ref: '#/components/schemas/LoanFrequency' }
        termInstallments: { type: integer, minimum: 1, maximum: 600 }
        method: { $ref: '#/components/schemas/LoanMethod' }
        disbursementDate: { $ref: '#/components/schemas/LocalDate' }
        firstDueDate: { $ref: '#/components/schemas/LocalDate' }
        charges: { $ref: '#/components/schemas/LoanCharges' }
        existing: { $ref: '#/components/schemas/LoanExistingInput' }
        disburseNow: { type: boolean, default: false }
        retainedFee: { $ref: '#/components/schemas/DecimalString' }
    LoanUpdate:
      type: object
      description: Name, lender and payment account always; the remaining fields only while the loan is a draft (otherwise 409 `LOAN_TERMS_LOCKED`).
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        lenderCounterpartyId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        paymentAccountId: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        disbursementAccountId: { $ref: '#/components/schemas/Uuid' }
        principal: { $ref: '#/components/schemas/PositiveMoney' }
        annualRate: { $ref: '#/components/schemas/DecimalString' }
        rateType: { $ref: '#/components/schemas/LoanRateType' }
        dayCount: { $ref: '#/components/schemas/LoanDayCount' }
        frequency: { $ref: '#/components/schemas/LoanFrequency' }
        termInstallments: { type: integer, minimum: 1, maximum: 600 }
        method: { $ref: '#/components/schemas/LoanMethod' }
        disbursementDate: { $ref: '#/components/schemas/LocalDate' }
        firstDueDate: { $ref: '#/components/schemas/LocalDate' }
        charges: { $ref: '#/components/schemas/LoanCharges' }
    DisburseInput:
      type: object
      additionalProperties: false
      properties:
        retainedFee:
          $ref: '#/components/schemas/DecimalString'
    CancelInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    VoidInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    LoanExisting:
      type: object
      additionalProperties: false
      required: [asOf, outstanding, nextInstallmentNo]
      properties:
        asOf: { $ref: '#/components/schemas/LocalDate' }
        outstanding: { $ref: '#/components/schemas/Money' }
        nextInstallmentNo: { type: integer, minimum: 1 }
    Loan:
      type: object
      required:
        [id, name, status, origin, accountId, disbursementAccountId, paymentAccountId, lenderCounterpartyId, lenderName,
         principal, annualRate, rateType, dayCount, frequency, termInstallments, method, disbursementDate, firstDueDate,
         charges, retainedFee, existing, currentScheduleVersion, recurringDefinitionId, disbursementTransactionId,
         cancelledReason, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        status: { $ref: '#/components/schemas/LoanStatus' }
        origin: { type: string, enum: [NEW, EXISTING] }
        accountId: { $ref: '#/components/schemas/Uuid' }
        disbursementAccountId: { $ref: '#/components/schemas/Uuid' }
        paymentAccountId: { $ref: '#/components/schemas/Uuid' }
        lenderCounterpartyId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lenderName: { type: [string, 'null'] }
        principal: { $ref: '#/components/schemas/Money' }
        annualRate: { $ref: '#/components/schemas/DecimalString' }
        rateType: { $ref: '#/components/schemas/LoanRateType' }
        dayCount: { $ref: '#/components/schemas/LoanDayCount' }
        frequency: { $ref: '#/components/schemas/LoanFrequency' }
        termInstallments: { type: integer }
        method: { $ref: '#/components/schemas/LoanMethod' }
        disbursementDate: { $ref: '#/components/schemas/LocalDate' }
        firstDueDate: { $ref: '#/components/schemas/LocalDate' }
        charges: { $ref: '#/components/schemas/LoanCharges' }
        retainedFee: { $ref: '#/components/schemas/Money' }
        existing: { oneOf: [{ $ref: '#/components/schemas/LoanExisting' }, { type: 'null' }] }
        currentScheduleVersion: { type: [integer, 'null'] }
        recurringDefinitionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        disbursementTransactionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        cancelledReason: { type: [string, 'null'] }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    LoanList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Loan' }
    ScheduleInstallment:
      type: object
      required: [n, dueDate, periodStart, periodEnd, principal, interest, fees, insurance, taxes, total, openingBalance, closingBalance]
      properties:
        n: { type: integer, minimum: 1 }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        principal: { $ref: '#/components/schemas/DecimalString' }
        interest: { $ref: '#/components/schemas/DecimalString' }
        fees: { $ref: '#/components/schemas/DecimalString' }
        insurance: { $ref: '#/components/schemas/DecimalString' }
        taxes: { $ref: '#/components/schemas/DecimalString' }
        total: { $ref: '#/components/schemas/DecimalString' }
        openingBalance: { $ref: '#/components/schemas/DecimalString' }
        closingBalance: { $ref: '#/components/schemas/DecimalString' }
    SchedulePreview:
      type: object
      additionalProperties: false
      required: [currency, installmentAmount, leveled, totalInterest, totalAmount, installments]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        installmentAmount: { $ref: '#/components/schemas/DecimalString' }
        leveled:
          type: boolean
          description: "`true` when the level installment applies (actual/360, actual/365 or an irregular first period): the smallest installment in cents that minimises |last - installment|."
        totalInterest: { $ref: '#/components/schemas/DecimalString' }
        totalAmount: { $ref: '#/components/schemas/DecimalString' }
        installments:
          type: array
          items: { $ref: '#/components/schemas/ScheduleInstallment' }
    LoanNextInstallment:
      type: object
      additionalProperties: false
      required: [n, dueDate, outstanding, overdueDays]
      properties:
        n: { type: integer }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        outstanding: { $ref: '#/components/schemas/Money' }
        overdueDays: { type: integer, minimum: 0 }
    LoanPaidTotals:
      type: object
      additionalProperties: false
      required: [principal, interest, fees, insurance, taxes]
      properties:
        principal: { $ref: '#/components/schemas/Money' }
        interest: { $ref: '#/components/schemas/Money' }
        fees: { $ref: '#/components/schemas/Money' }
        insurance: { $ref: '#/components/schemas/Money' }
        taxes: { $ref: '#/components/schemas/Money' }
    LoanDetail:
      allOf:
        - $ref: '#/components/schemas/Loan'
        - type: object
          required:
            [outstandingPrincipal, accountBalance, unreconciledDifference, installmentAmount, nextInstallment,
             overdueInstallments, paidTotals, preview]
          properties:
            outstandingPrincipal:
              description: Principal pending according to the schedule; null for a draft or a cancelled loan.
              oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
            accountBalance:
              description: Balance owed according to the loan account.
              $ref: '#/components/schemas/Money'
            unreconciledDifference:
              description: Outstanding principal minus the account balance (movements of the account not registered as loan payments).
              oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
            installmentAmount:
              oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
            nextInstallment:
              oneOf: [{ $ref: '#/components/schemas/LoanNextInstallment' }, { type: 'null' }]
            overdueInstallments:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [n, dueDate, outstanding, overdueDays]
                properties:
                  n: { type: integer }
                  dueDate: { $ref: '#/components/schemas/LocalDate' }
                  outstanding: { $ref: '#/components/schemas/Money' }
                  overdueDays: { type: integer, minimum: 0 }
            paidTotals: { $ref: '#/components/schemas/LoanPaidTotals' }
            preview:
              description: Preview of the schedule (draft loans only).
              oneOf: [{ $ref: '#/components/schemas/SchedulePreview' }, { type: 'null' }]
    LoanComponents:
      type: object
      additionalProperties: false
      required: [taxes, insurance, fees, interest, principal]
      properties:
        taxes: { $ref: '#/components/schemas/DecimalString' }
        insurance: { $ref: '#/components/schemas/DecimalString' }
        fees: { $ref: '#/components/schemas/DecimalString' }
        interest: { $ref: '#/components/schemas/DecimalString' }
        principal: { $ref: '#/components/schemas/DecimalString' }
    LoanInstallment:
      allOf:
        - $ref: '#/components/schemas/ScheduleInstallment'
        - type: object
          required: [id, status, overdue, expected, paid, differences, pendingTotal]
          properties:
            id: { type: string }
            status: { type: string, enum: [UNPAID, PARTIALLY_PAID, PAID] }
            overdue: { type: boolean }
            expected: { $ref: '#/components/schemas/LoanComponents' }
            paid: { $ref: '#/components/schemas/LoanComponents' }
            differences: { $ref: '#/components/schemas/LoanComponents' }
            pendingTotal: { $ref: '#/components/schemas/DecimalString' }
    InstallmentList:
      type: object
      additionalProperties: false
      required: [scheduleVersion, data]
      properties:
        scheduleVersion: { type: [integer, 'null'] }
        data:
          type: array
          items: { $ref: '#/components/schemas/LoanInstallment' }
    LoanPaymentBreakdownInput:
      type: object
      description: Explicit breakdown of a payment (one installment). Omitted components are zero; the components must add up to `amount`.
      additionalProperties: false
      properties:
        principal: { $ref: '#/components/schemas/DecimalString' }
        interest: { $ref: '#/components/schemas/DecimalString' }
        fees: { $ref: '#/components/schemas/DecimalString' }
        insurance: { $ref: '#/components/schemas/DecimalString' }
        taxes: { $ref: '#/components/schemas/DecimalString' }
    LoanPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, businessDate]
      properties:
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        accountId:
          description: Payment account; defaults to the usual payment account of the loan.
          $ref: '#/components/schemas/Uuid'
        paymentMethod: { type: [string, 'null'], maxLength: 40 }
        installmentNo: { type: integer, minimum: 1 }
        breakdown: { $ref: '#/components/schemas/LoanPaymentBreakdownInput' }
    LoanPayment:
      type: object
      additionalProperties: false
      required:
        [id, loanId, paymentNo, transactionId, accountId, businessDate, amount, principal, interest, fees, insurance, taxes,
         explicitBreakdown, paymentMethod, status, installmentNos, voidedAt, voidedReason, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        loanId: { $ref: '#/components/schemas/Uuid' }
        paymentNo: { type: integer, minimum: 1 }
        transactionId: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        businessDate: { $ref: '#/components/schemas/LocalDate' }
        amount: { $ref: '#/components/schemas/Money' }
        principal: { $ref: '#/components/schemas/DecimalString' }
        interest: { $ref: '#/components/schemas/DecimalString' }
        fees: { $ref: '#/components/schemas/DecimalString' }
        insurance: { $ref: '#/components/schemas/DecimalString' }
        taxes: { $ref: '#/components/schemas/DecimalString' }
        explicitBreakdown: { type: boolean }
        paymentMethod: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, VOIDED] }
        installmentNos:
          type: array
          items: { type: integer }
        voidedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        voidedReason: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Instant' }
    LoanPaymentResult:
      type: object
      additionalProperties: false
      required: [payment, loan]
      properties:
        payment: { $ref: '#/components/schemas/LoanPayment' }
        loan: { $ref: '#/components/schemas/Loan' }
    LoanPaymentList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LoanPayment' }
    ReferenceColumnMapping:
      type: object
      description: Each field is a 0-based column index or the header name.
      additionalProperties: false
      required: [installmentNo, dueDate, principal, interest]
      properties:
        installmentNo: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        dueDate: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        principal: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        interest: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        fees: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        insurance: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        taxes: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        total: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
        balance: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
    ReferenceManualRow:
      type: object
      additionalProperties: false
      required: [n, dueDate, principal, interest]
      properties:
        n: { type: integer, minimum: 1 }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        principal: { $ref: '#/components/schemas/DecimalString' }
        interest: { $ref: '#/components/schemas/DecimalString' }
        fees: { $ref: '#/components/schemas/DecimalString' }
        insurance: { $ref: '#/components/schemas/DecimalString' }
        taxes: { $ref: '#/components/schemas/DecimalString' }
        total: { $ref: '#/components/schemas/DecimalString' }
        balance: { $ref: '#/components/schemas/DecimalString' }
    ReferenceInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, enum: [CSV, PASTE, MANUAL] }
        text: { type: string, maxLength: 262144 }
        delimiter: { type: string, enum: [',', ';', "\t"] }
        hasHeader: { type: boolean, default: true }
        mapping: { $ref: '#/components/schemas/ReferenceColumnMapping' }
        dateFormat: { type: string, enum: [DD/MM/YYYY, YYYY-MM-DD, MM/DD/YYYY] }
        decimalSeparator: { type: string, enum: [',', '.'] }
        rows:
          type: array
          maxItems: 600
          items: { $ref: '#/components/schemas/ReferenceManualRow' }
    ReferencePreviewInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, maxLength: 262144 }
        delimiter: { type: string, enum: [',', ';', "\t"] }
        hasHeader: { type: boolean, default: true }
    ReferencePreview:
      type: object
      additionalProperties: false
      required: [delimiter, headers, rowCount, preview]
      properties:
        delimiter: { type: string }
        headers:
          type: array
          items: { type: string }
        rowCount: { type: integer }
        preview:
          type: array
          items:
            type: array
            items: { type: string }
    ReferenceSchedule:
      type: object
      required: [id, referenceVersion, source, rowCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        referenceVersion: { type: integer, minimum: 1 }
        source: { type: string, enum: [CSV, PASTE, MANUAL] }
        rowCount: { type: integer }
        createdAt: { $ref: '#/components/schemas/Instant' }
    ReferenceList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReferenceSchedule' }
    ScheduleComparison:
      type: object
      description: Rows and summary as computed by the comparator; `status` is `MATCH` (no differences), `EXPLAINED` or `UNEXPLAINED`.
      additionalProperties: false
      required:
        [referenceId, referenceVersion, scheduleVersion, status, explanation, explainedBy, explainedAt, matched, totalRows,
         firstDifferenceNo, summary, rows, suggestions]
      properties:
        referenceId: { $ref: '#/components/schemas/Uuid' }
        referenceVersion: { type: integer }
        scheduleVersion:
          type: integer
          description: Schedule version compared; 0 is the preview of a draft.
        status: { type: string, enum: [MATCH, UNEXPLAINED, EXPLAINED] }
        explanation: { type: [string, 'null'] }
        explainedBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        explainedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        matched: { type: integer }
        totalRows: { type: integer }
        firstDifferenceNo: { type: [integer, 'null'] }
        summary: { type: object, additionalProperties: true }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        suggestions:
          type: array
          items: { type: object, additionalProperties: true }
    ReferenceUploadResult:
      allOf:
        - $ref: '#/components/schemas/ReferenceSchedule'
        - type: object
          required: [comparison]
          properties:
            comparison: { $ref: '#/components/schemas/ScheduleComparison' }
    ExplainInput:
      type: object
      additionalProperties: false
      required: [explanation]
      properties:
        explanation: { type: string, minLength: 1, maxLength: 1000 }
