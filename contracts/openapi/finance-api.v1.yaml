        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/mapping:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    put:
      tags: [Imports]
      operationId: setImportMapping
      summary: Apply (or replace) the column mapping and compute the preview
      description: |
        The user chooses the date, description and amount columns (one signed column with its sign convention, or a debit
        and a credit column), whether the first record is a header and how many leading records to skip, the date format
        and the decimal separator — always explicit, never guessed per row. The server normalizes and validates every row
        (`IMPORT_INVALID_DATE`, `IMPORT_INVALID_AMOUNT`, `IMPORT_FUTURE_DATE`, `PERIOD_CLOSED`; an amount with more
        decimals than the currency scale is invalid and never rounded), computes the row fingerprints and classifies them
        against previous imports and the existing movements of the account, synchronously (at most 5 000 rows). It can be
        sent again while the import is not approved: the preview is recomputed and the decisions of the rows whose
        fingerprint did not change are kept. A mapping that references missing columns or leaves date, description or
        amount unassigned → 422 `IMPORT_MAPPING_INVALID` and the import stays as it was. Nothing financial is created.
        Costly operation (`x-rate-limit: costly`).
      x-openspec-capability: imports/import-pipeline
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportMapping' }
      responses:
        '200':
          description: The import in review with the summary of the preview
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportMapped' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (the import is already approved, finished or cancelled).'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'IMPORT_MAPPING_INVALID or IMPORT_TOO_MANY_ROWS.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/imports/{importId}/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Imports]
      operationId: getImportPreview
      summary: Preview of the import (rows, counts by classification, totals and resulting balance)
      description: |
        Paginated by cursor (50 rows by default) in file order; `classification` filters the rows. `summary` is computed
        over the whole staging: the counts by classification and decision, the total of outflows and inflows of the rows
        to create and the current and resulting ledger balance of the account in its currency (a liability is presented
        with debt positive). A possible duplicate carries the `candidate` (the existing movement it would duplicate: an
        expense, an income or a leg of a transfer or conversion). Until the approval no transaction, journal entry or
        balance change derives from the file.
      x-openspec-capability: imports/import-pipeline
      x-required-role: VIEWER
      parameters:
        - name: classification
          in: query
          schema: { $ref: '#/components/schemas/ImportRowClassification' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
