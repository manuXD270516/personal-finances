openapi: 3.1.0
# DRAFT — Phase 0 (DESIGN GATE). Contract-first source of truth for finance-api HTTP surface.
# Conventions: docs/10-api-design.md · Canonical decisions: docs/ARCHITECTURE.md §8 · ADR-0022
info:
  title: PFOS finance-api
  version: 1.0.0-draft.2
  summary: Personal Finance Operating System — REST API v1 (draft)
  description: |
    REST API of the Personal Finance Operating System (PFOS).

    * All business resources live under `/workspaces/{workspaceId}`.
    * Money is always `{ "amount": "<decimal string>", "currency": "<code>" }`. Never JSON numbers.
    * Business dates are `YYYY-MM-DD` (workspace timezone); instants are RFC 3339 UTC with `Z` suffix.
    * Errors are RFC 9457 `application/problem+json` with a stable domain `code` and a `requestId`.
    * Financial `POST` operations require `Idempotency-Key` (missing → 428 `IDEMPOTENCY_KEY_REQUIRED`; reused with a
      different payload → 422 `IDEMPOTENCY_KEY_REUSED`); updates and actions on existing aggregates require `If-Match`.
    * Every operation declares `x-openspec-capability` (OpenSpec taxonomy, ARCHITECTURE §14) and `x-required-role`.
    * Insufficient role → 403 `INSUFFICIENT_ROLE`; not an active member → 403 `WORKSPACE_ACCESS_DENIED`.
    * Deprecated operations answer with `Deprecation` (RFC 9745), `Sunset` (RFC 8594, at least 90 days after the
      announcement) and `Link: <…>; rel="deprecation"`; they are flagged `deprecated: true` with `x-deprecated-at` and `x-sunset` (YYYY-MM-DD).
    * Responses carry `RateLimit` / `RateLimit-Policy` (IETF draft); exceeding the quota returns 429 `RATE_LIMITED`
      with `Retry-After`.

    Only Phase 1 paths are specified. Later-phase resources are listed as tags (description only).
    Phase 1 consolidation: 2026-10-02 (docs/31-phase-1-consolidation-decisions.md).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: PFOS owner
servers:
  - url: /api/v1
    description: Relative base path (served behind the finance-web BFF)
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Current user and workspaces (identity/authentication, identity/workspace-membership). Phase 1.
  - name: Accounts
    description: User accounts (ASSET/LIABILITY) and institutions. Phase 1.
  - name: Transactions
    description: Transactions with legs and splits, transfers and conversions. Phase 1.
  - name: Classification
    description: Categories, category groups, tags and counterparties. Phase 1.
  - name: FX
    description: Currency catalog, manual historical fx-rates and per-pair preferred rate type (Phase 1). Providers in Phase 5.
  - name: Ledger
    description: Read-only views of the internal double-entry ledger (Phase 1, trial balance).
  - name: Audit
    description: "Phase 1: read-only audit log (history by entity and by date range) and session login/logout auditing."
  - name: Reporting
    description: Basic dashboard KPIs (Phase 1). Advanced reports in Phase 7 (see docs/14-reporting.md).
  - name: Platform
    description: Cross-cutting resources such as long-running operations (202 + operation pattern).
  - name: Members
    description: "LATER (Phase 9): workspace members and invitations."
  - name: Reconciliation
    description: "Phase 2: account reconciliation sessions against statement balances (add-reconciliation); bulk edit of classification is LATER (add-bulk-edit)."
  - name: CustomFields
    description: "LATER (Phase 2): custom field definitions and values on splits."
  - name: Planning
    description: "Phase 2: financial periods, monthly plan, budgets, templates and month closing."
  - name: Notifications
    description: "Phase 2: in-app notification center, email channel and preferences (budget thresholds, month pending close)."
  - name: Commitments
    description: "LATER (Phase 3): recurring definitions, occurrences and subscriptions."
  - name: Goals
    description: "LATER (Phase 4): savings goals and contributions (transfer or earmark)."
  - name: Debt
    description: "LATER (Phase 4): loans, amortization schedules, installments, credit cards and statements."
  - name: FxRates
    description: "Phase 1 (docs/31 D29, ADR-0025): market rate providers (paralelo.bo primary, bo.dolarapi.com fallback/official), provider status and anomaly review. Manual rates are under FX. More providers, crypto and commodities: Phase 5."
  - name: Documents
    description: "LATER (Phase 6): documents, presigned uploads/downloads and attachment links."
  - name: Imports
    description: "LATER (Phase 6, basic CSV may move to Phase 3): import jobs, staged rows, mapping profiles, connections."
  - name: Rules
    description: "LATER (Phase 6): rules engine (conditions/actions)."
  - name: Forecasts
    description: "LATER (Phase 8): statistical forecasts (async)."
  - name: Assistant
    description: "LATER (Phase 10): read-only AI assistant."

paths:
  # ───────────────────────────── Identity ─────────────────────────────
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Get the authenticated user and their workspace memberships
      x-openspec-capability: identity/authentication
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Identity]
      operationId: updateMe
      summary: Update the authenticated user's profile and preferences
      x-openspec-capability: identity/authentication
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Updated user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'INVALID_TIMEZONE (timezone is not a valid IANA zone).'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/session-events:
    post:
      tags: [Audit]
      operationId: recordSessionEvent
      summary: Audit a login or logout of the caller's BFF session (FR-AUDIT-005)
      description: |
        Called by the finance-web BFF right after a successful login (`STARTED`) and on logout (`ENDED`). The record is
        written in `workspaceId` when the caller is an active member of it, otherwise in the caller's oldest active
        workspace; without any workspace nothing is recorded. User agent and client IP (stored only as an HMAC) come
        from the forwarded request; tokens and cookies are never recorded.
      x-openspec-capability: audit/audit-trail
      x-required-role: AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionEvent' }
      responses:
        '204':
          description: Session event audited (or skipped when the user has no workspace)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces:
    get:
      tags: [Identity]
      operationId: listWorkspaces
      summary: List workspaces where the user is an active member
      x-openspec-capability: identity/workspace-membership
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Workspaces page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Identity]
      operationId: createWorkspace
      summary: Create a workspace (caller becomes OWNER)
      description: |
        The caller becomes OWNER. System categories (and, when `seedDefaultCategories` is true, the default catalog)
        are seeded asynchronously by Classification when it consumes `identity.WorkspaceCreated.v1`; ledger system
        accounts are created on demand at the first posting.
      x-openspec-capability: identity/workspace-membership
      x-required-role: AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
      responses:
        '201':
          description: Workspace created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Identity]
      operationId: getWorkspace
      summary: Get a workspace
      x-openspec-capability: identity/workspace-membership
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Workspace
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Identity]
      operationId: updateWorkspace
      summary: Update workspace settings (name, timezone, locale, base currency, fiscal month start, liquidity reserve)
      x-openspec-capability: identity/workspace-membership
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdate' }
      responses:
        '200':
          description: Updated workspace
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ─────────────────────── Identity: datos de demostración (add-demo-data, ADR-0026) ───────────────────────
  /workspaces/{workspaceId}/demo-data:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Identity]
      operationId: requestDemoData
      summary: Load demo data into a NEW dedicated demo workspace (owner action, asynchronous)
      description: |
        Creates a dedicated demo workspace (`isDemo = true`, immutable) whose only member is the caller (OWNER) and
        enqueues the asynchronous load of the versioned Demo dataset (docs/29) anchored at "today" in the workspace
        time zone. The current workspace is only the ORIGIN (where the action is audited): no data is ever written into
        it. Disabled by environment ⇒ 403 `DEMO_DATA_DISABLED`; a non-purged demo of the caller already exists ⇒ 409
        `DEMO_WORKSPACE_ALREADY_EXISTS`.
      x-openspec-capability: identity/demo-data
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Demo workspace created; load in progress (`LOADING`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoDataStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Identity]
      operationId: getDemoDataStatus
      summary: Demo data status (on a demo workspace, or the caller's latest demo requested from a real workspace)
      description: |
        On a demo workspace (any member; also while it is being cleaned) returns its load. On a real workspace returns
        the latest demo the caller requested from it (404 if none). `status = PURGED` means it was fully removed.
      x-openspec-capability: identity/demo-data
      x-required-role: VIEWER
      responses:
        '200':
          description: Demo data status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoDataStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/demo-data/cleanup:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Identity]
      operationId: cleanupDemoData
      summary: Clean up a demo workspace (immediate archive + asynchronous full purge)
      description: |
        Only on a demo workspace (`WORKSPACE_NOT_DEMO` otherwise). The demo workspace is archived immediately: it is
        no longer listed and every other route answers as if it did not exist; its physical purge is enqueued. Safe to
        repeat while it is being cleaned (202 without further effects). A demo still `LOADING` ⇒ 409
        `INVALID_STATUS_TRANSITION`.
      x-openspec-capability: identity/demo-data
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Demo workspace archived; purge enqueued (`CLEANING`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoDataStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ──────────────── Identity: portabilidad del workspace (add-workspace-export, identity/workspace-portability) ────────────────
  /workspaces/{workspaceId}/exports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Identity]
      operationId: requestWorkspaceExport
      summary: Request the full export of the workspace (OWNER, recent authentication, asynchronous)
      description: |
        Starts the asynchronous export of ALL the workspace data (configuration, accounts, catalogs, transactions with every
        revision, ledger, periods and closings, budgets, reconciliations, audit trail and timelines; never secrets) into a
        single open `pfos-export` v1 archive (ZIP with `manifest.json`, JSON Lines validated by the JSON Schemas of
        `contracts/export/v1` and flat CSV views). The snapshot is consistent (one `REPEATABLE READ` read-only transaction).
        The archive is stored ENCRYPTED (envelope encryption, master key `keyId`), expires after `EXPORT_RETENTION`
        (7 days by default) and is downloaded through the API.

        Only the OWNER (EDITOR/VIEWER ⇒ 403 `INSUFFICIENT_ROLE`) whose authentication (`auth_time` claim) is at most
        `REAUTH_MAX_AGE` (10 min) old; otherwise 403 `REAUTHENTICATION_REQUIRED` and nothing is created. One export in
        progress per workspace (409 `EXPORT_IN_PROGRESS`). At most 10 requests per user and minute (429). The `Location`
        header points to the `EXPORT` operation (`getOperation`). Every step is audited (`identity.export.*`).
      x-openspec-capability: identity/workspace-portability
      x-required-role: OWNER
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Export accepted; poll the operation or the export.
          headers:
            Location:
              description: URL of the `EXPORT` operation (`/api/v1/workspaces/{workspaceId}/operations/{operationId}`).
              schema: { type: string }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Identity]
      operationId: listWorkspaceExports
      summary: List the exports of the workspace (OWNER), most recent first
      description: |
        Up to the 50 most recent exports with their status, size, SHA-256 and expiry. Never returns the archive or a
        download URL: the file is downloaded through `downloadWorkspaceExport`.
      x-openspec-capability: identity/workspace-portability
      x-required-role: OWNER
      responses:
        '200':
          description: Exports
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Identity]
      operationId: getWorkspaceExport
      summary: Read an export (OWNER)
      description: Status, counts per section, size, SHA-256 of the plain archive, retention and failure code.
      x-openspec-capability: identity/workspace-portability
      x-required-role: OWNER
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Identity]
      operationId: downloadWorkspaceExport
      summary: Download a finished export (OWNER, recent authentication)
      description: |
        Streams the DECRYPTED `application/zip` archive. Before sending a single byte the API authenticates the whole
        encrypted object (every block) and checks the SHA-256 recorded at export time: any alteration ⇒ 422
        `EXPORT_FILE_CORRUPTED` with no content delivered. `Repr-Digest: sha-256=:<base64>:` carries the SHA-256 of the
        archive. Not finished ⇒ 409 `EXPORT_NOT_READY`; expired or discarded ⇒ 410 `EXPORT_EXPIRED`. Requires the OWNER role and a
        recent authentication (403 `REAUTHENTICATION_REQUIRED`). Every download is audited (`identity.export.downloaded`).
        There is NO presigned URL: the object is encrypted at application level.
      x-openspec-capability: identity/workspace-portability
      x-required-role: OWNER
      responses:
        '200':
          description: >-
            The export archive as an attachment (`Content-Disposition: attachment; filename="pfos-export-<workspace>-<date>.zip"`).
          headers:
            Content-Disposition:
              description: Always `attachment` with a safe ASCII file name.
              schema: { type: string }
            Repr-Digest:
              description: 'RFC 9530: SHA-256 of the plain archive, `sha-256=:<base64>:`.'
              schema: { type: string }
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/exports/{exportId}/discard:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ExportId'
    post:
      tags: [Identity]
      operationId: discardWorkspaceExport
      summary: Delete the file of a finished export before it expires (OWNER)
      description: |
        Deletes the encrypted object from storage and keeps the export record (dates, size, SHA-256, actor). Later
        downloads answer 410 `EXPORT_EXPIRED`. Idempotent. An export still running or failed ⇒ 409 `EXPORT_NOT_READY`. Audited
        (`identity.export.discarded`).
      x-openspec-capability: identity/workspace-portability
      x-required-role: OWNER
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: The export (status `DISCARDED`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspace-imports:
    post:
      tags: [Identity]
      operationId: requestWorkspaceImport
      summary: Import an export into a NEW workspace (recent authentication, asynchronous)
      description: |
        Uploads a `pfos-export` archive (`multipart/form-data`, field `file`, at most `WORKSPACE_IMPORT_MAX_BYTES` =
        200 MB ⇒ 413 `UPLOAD_TOO_LARGE`) and creates a NEW workspace owned by the caller with all the data under NEW
        identifiers; it never writes into an existing workspace and the source workspace is untouched. The synchronous
        validation (no write on failure) rejects a missing or altered manifest or file (422 `EXPORT_FILE_CORRUPTED`), an
        unsupported format version and the export of a demo workspace (422 `EXPORT_FORMAT_UNSUPPORTED`). The import runs as
        ONE database transaction: balances and the trial balance are verified against the manifest before the workspace
        becomes visible (`EXPORT_VERIFICATION_FAILED` ⇒ nothing is persisted). Requires a recent authentication
        (403 `REAUTHENTICATION_REQUIRED`). One import in progress per user (409 `IMPORT_IN_PROGRESS`). Audited. Costly operation (`x-rate-limit: costly`): at most 10 per user and minute
        (429 `RATE_LIMITED`); an idempotent replay does not consume the quota. The uploaded file is part of the
        idempotency payload (same key with another file ⇒ 422 `IDEMPOTENCY_KEY_REUSED`).
      x-openspec-capability: identity/workspace-portability
      x-required-role: AUTHENTICATED
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The `pfos-export` ZIP archive (`application/zip`).
      responses:
        '202':
          description: Import accepted; poll `getWorkspaceImport`.
          headers:
            Location:
              description: URL of the import (`/api/v1/workspace-imports/{importId}`).
              schema: { type: string }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspace-imports/{importId}:
    parameters:
      - name: importId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [Identity]
      operationId: getWorkspaceImport
      summary: State of an import (the requester only)
      description: |
        `RECEIVED → VALIDATING → IMPORTING → SUCCEEDED | FAILED`. `workspaceId` is the new workspace once `SUCCEEDED`;
        on `FAILED`, `errorCode` is `EXPORT_VERIFICATION_FAILED`, `EXPORT_FILE_CORRUPTED` or `IMPORT_FAILED` and no
        workspace was created.
      x-openspec-capability: identity/workspace-portability
      x-required-role: AUTHENTICATED
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceImport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Accounts ─────────────────────────────
  /workspaces/{workspaceId}/accounts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts with current balances
      x-openspec-capability: accounts/account-management
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: type
          in: query
          description: Filter by account type (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountType' }
          style: form
          explode: true
        - name: currency
          in: query
          description: Filter by currency code (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/CurrencyCode' }
          style: form
          explode: true
        - name: institutionId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: status
          in: query
          description: Filter by status (repeatable). Default `ACTIVE` and `CLOSED` (ARCHIVED only with `includeArchived=true` or an explicit `status=ARCHIVED`).
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountStatus' }
          style: form
          explode: true
        - name: tagId
          in: query
          description: Accounts carrying this tag
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: liquidity
          in: query
          description: Filter by liquidity (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountLiquidity' }
          style: form
          explode: true
        - name: sort
          in: query
          description: Sort keys. Default `displayOrder` (manual order).
          schema:
            type: string
            enum: [displayOrder, name, -name, type, institution, createdAt, -createdAt]
            default: displayOrder
        - name: groupBy
          in: query
          description: When present, the page also returns `groups` (account ids grouped by type or institution).
          schema:
            type: string
            enum: [type, institution]
      responses:
        '200':
          description: Accounts page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account (optionally with an opening balance, which posts an OPENING_BALANCE transaction)
      x-openspec-capability: [accounts/account-management, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_NAME_TAKEN, INSTITUTION_ARCHIVED, CUSTOM_FIELD_ARCHIVED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CURRENCY_NOT_ENABLED, ACCOUNT_CURRENCY_KIND_MISMATCH, AMOUNT_SCALE_EXCEEDED, CUSTOM_FIELD_VALUE_INVALID, CUSTOM_FIELD_REQUIRED, CUSTOM_FIELD_TARGET_MISMATCH, REFERENCE_NOT_FOUND, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/order:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [Accounts]
      operationId: reorderAccounts
      summary: Set the manual display order of the accounts
      description: The listed accounts receive `displayOrder` 0..n-1 in the given order; accounts not listed keep their relative order after them.
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountOrder' }
      responses:
        '204':
          description: Order saved
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'REFERENCE_NOT_FOUND (an id is not an account of this workspace).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account with balances
      x-openspec-capability: accounts/account-management
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update account attributes (type is immutable; currency only while the account has no movements)
      description: |
        `type` cannot be changed (`additionalProperties: false` ⇒ 400 VALIDATION_FAILED). `currency` can change only
        while the account has no transactions or journal postings (otherwise 409 ACCOUNT_CURRENCY_IMMUTABLE).
        Closing uses `closeAccount`.
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_CURRENCY_IMMUTABLE, ACCOUNT_NAME_TAKEN, ACCOUNT_ARCHIVED, INSTITUTION_ARCHIVED, CUSTOM_FIELD_ARCHIVED, CONCURRENCY_CONFLICT.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CUSTOM_FIELD_VALUE_INVALID, CUSTOM_FIELD_REQUIRED (when editing custom fields), CUSTOM_FIELD_TARGET_MISMATCH, VALIDATION_FAILED, REFERENCE_NOT_FOUND.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/{accountId}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccountLifecycle
      summary: Recorrido de una cuenta (apertura, cierre, archivo, reactivación y anotaciones)
      description: |
        Recorrido de la cuenta (docs/31 D37) con la máquina `Account`; la apertura enlaza el asiento del saldo
        inicial. VIEWER+; otro workspace ⇒ 404 idéntico a inexistente.
      x-openspec-capability: audit/lifecycle-timeline
      x-required-role: VIEWER
      responses:
        '200':
          description: Recorrido de la cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lifecycle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/accounts/{accountId}/lifecycle/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: exportAccountLifecycle
      summary: Exportar el recorrido de una cuenta (CSV o PDF)
      description: |
        Descarga síncrona del recorrido (docs/31 D52): `format=csv` (RFC 4180, UTF-8 con BOM, fechas
        es-BO en la zona horaria del workspace, montos como decimal string sin cambios, celdas neutralizadas contra
        CSV injection) o `format=pdf` (título, elemento, camino de estados, línea de tiempo, fecha de generación y zona
        horaria). Mismo alcance que el recorrido: VIEWER+; otro workspace ⇒ 404 idéntico a inexistente. La exportación
        queda auditada (`audit.lifecycle.exported`).
      x-openspec-capability: audit/lifecycle-timeline
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/LifecycleExportFormat'
      responses:
        '200':
          $ref: '#/components/responses/LifecycleExport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/accounts/{accountId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      operationId: archiveAccount
      summary: Archive an account (soft-archive; it stops accepting new postings)
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (already archived).'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/{accountId}/close:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      operationId: closeAccount
      summary: Close an account (balance must be zero; it stops accepting new movements but stays visible)
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountClose' }
      responses:
        '200':
          description: Closed account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_BALANCE_NOT_ZERO, INVALID_STATUS_TRANSITION.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/accounts/{accountId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      operationId: reactivateAccount
      summary: Reactivate a CLOSED or ARCHIVED account (back to ACTIVE)
      x-openspec-capability: accounts/account-management
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Reactivated account
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_NAME_TAKEN (an active account already uses the name), INVALID_STATUS_TRANSITION (already ACTIVE).'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/institutions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Accounts]
      operationId: listInstitutions
      summary: List institutions
      x-openspec-capability: accounts/institutions
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
        - $ref: '#/components/parameters/Query'
        - name: kind
          in: query
          description: Filter by institution kind (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/InstitutionKind' }
          style: form
          explode: true
      responses:
        '200':
          description: Institutions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Accounts]
      operationId: createInstitution
      summary: Create an institution
      x-openspec-capability: accounts/institutions
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionCreate' }
      responses:
        '201':
          description: Institution created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'NAME_TAKEN (an active institution already uses the name).'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/institutions/{institutionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InstitutionId'
    get:
      tags: [Accounts]
      operationId: getInstitution
      summary: Get an institution
      x-openspec-capability: accounts/institutions
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Institution
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Accounts]
      operationId: updateInstitution
      summary: Update an institution
      x-openspec-capability: accounts/institutions
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/InstitutionUpdate' }
      responses:
        '200':
          description: Updated institution
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'NAME_TAKEN, CONCURRENCY_CONFLICT.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/institutions/{institutionId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InstitutionId'
    post:
      tags: [Accounts]
      operationId: archiveInstitution
      summary: Archive an institution
      x-openspec-capability: accounts/institutions
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived institution
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ─────────────────────────── Transactions ───────────────────────────
  /workspaces/{workspaceId}/transactions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions (legs and splits inline)
      description: |
        `q` searches description, notes and counterparty name, case- and accent-insensitive. `categoryId` also matches
        splits in its subcategories. Transfers appear for both accounts when filtering by `accountId`.
      x-openspec-capability: transactions/transaction-recording
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
        - name: accountId
          in: query
          description: Transactions with at least one leg on any of these accounts
          schema:
            type: array
            items: { $ref: '#/components/schemas/Uuid' }
          style: form
          explode: true
        - name: source
          in: query
          description: Filter by origin of the transaction (repeatable)
          schema:
            type: array
            items: { $ref: '#/components/schemas/TransactionSource' }
          style: form
          explode: true
        - name: categoryId
          in: query
          description: Splits in any of these categories or their subcategories
          schema:
            type: array
            items: { $ref: '#/components/schemas/Uuid' }
          style: form
          explode: true
        - name: tagId
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/Uuid' }
          style: form
          explode: true
        - name: paymentMethod
          in: query
          description: Filtra por medio de pago (D27)
          schema:
            type: array
            items: { $ref: '#/components/schemas/PaymentMethod' }
          style: form
          explode: false
        - name: counterpartyId
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/Uuid' }
          style: form
          explode: true
        - name: kind
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/TransactionKind' }
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/TransactionStatus' }
          style: form
          explode: true
        - name: systemFlag
          in: query
          description: |
            Filter by derived system flag (docs/33 D111, repeatable; all given flags must hold). Combines with the other
            filters (`accountId`, dates, `status`). `RECONCILED_WITHOUT_STATEMENT` returns the transactions marked
            reconciled without a statement and still pending review.
          schema:
            type: array
            items: { $ref: '#/components/schemas/SystemFlag' }
          style: form
          explode: true
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: dateFrom
          in: query
          description: Inclusive lower bound on transactionDate
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: dateTo
          in: query
          description: Inclusive upper bound on transactionDate
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: amountMin
          in: query
          description: Inclusive lower bound on the transaction amount magnitude
          schema: { $ref: '#/components/schemas/PositiveDecimalString' }
        - name: amountMax
          in: query
          description: Inclusive upper bound on the transaction amount magnitude
          schema: { $ref: '#/components/schemas/PositiveDecimalString' }
        - name: customField
          in: query
          description: |
            Filter by custom field value of the splits, by field key (`style: deepObject`). Equality for every type:
            `customField[centro_costo]=oficina`. Range for NUMBER, DECIMAL and DATE: `customField[litros][gte]=10` and/or
            `customField[litros][lte]=40`. Decimals and numbers are exact decimal strings; booleans `true`/`false`; dates
            `YYYY-MM-DD`. An unknown key matches nothing; a value invalid for the field type is a 400.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  properties:
                    gte: { type: string }
                    lte: { type: string }
        - name: sort
          in: query
          description: Default `-transactionDate` (ties broken by id).
          schema:
            type: string
            enum: [transactionDate, -transactionDate, amount, -amount, createdAt, -createdAt]
            default: -transactionDate
      responses:
        '200':
          description: Transactions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record an income, expense, refund or adjustment with splits
      description: |
        Transfers and conversions have dedicated endpoints. Amounts in commands are positive magnitudes;
        direction is given by `kind`. If `splits` is omitted a single split in the system category
        UNCATEGORIZED (UNCATEGORIZED_INCOME for income) is created. Non-PENDING transactions are posted to the
        ledger in the same DB transaction.

        * `REFUND` may reference the original expense (`refundOfTransactionId`); a refund larger than the
          non-refunded remainder is rejected with `REFUND_EXCEEDS_ORIGINAL` unless `confirmRefundExceedsOriginal=true`.
        * `ADJUSTMENT` requires `direction` and `reason`, never accepts `splits` in Phase 1 and its amount must be > 0.
        * The response may carry non-blocking `warnings` (e.g. `POSSIBLE_DUPLICATE`); the transaction is still recorded.
      x-openspec-capability: [transactions/transaction-recording, transactions/splits, transactions/duplicate-detection, ledger/journal-posting]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
            examples:
              splitExpense:
                summary: Supermarket expense split in two categories
                value:
                  kind: EXPENSE
                  transactionDate: '2026-09-30'
                  accountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d01
                  amount: { amount: '350.00', currency: BOB }
                  description: Hipermaxi
                  splits:
                    - amount: { amount: '300.00', currency: BOB }
                      categoryId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d11
                    - amount: { amount: '50.00', currency: BOB }
                      categoryId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d12
                      tagIds: [0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d21]
              refund:
                summary: Partial refund of a previous expense
                value:
                  kind: REFUND
                  transactionDate: '2026-10-02'
                  accountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d01
                  amount: { amount: '50.00', currency: BOB }
                  refundOfTransactionId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9e01
                  description: Devolución Hipermaxi
              adjustment:
                summary: Balance adjustment (decrease)
                value:
                  kind: ADJUSTMENT
                  direction: DECREASE
                  transactionDate: '2026-10-02'
                  accountId: 0192f3c4-7b2e-7c1a-9d8e-3f2a1b0c9d03
                  amount: { amount: '12.50', currency: BOB }
                  reason: Diferencia de arqueo de caja
      responses:
        '201':
          description: Transaction recorded (with non-blocking warnings)
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionCreateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'ACCOUNT_ARCHIVED, ACCOUNT_CLOSED, CATEGORY_ARCHIVED, TAG_ARCHIVED, COUNTERPARTY_ARCHIVED, CUSTOM_FIELD_ARCHIVED, PERIOD_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'CURRENCY_MISMATCH, SPLITS_DO_NOT_SUM, AMOUNT_SCALE_EXCEEDED, AMOUNT_NOT_POSITIVE, REFUND_EXCEEDS_ORIGINAL, CATEGORY_KIND_MISMATCH, CUSTOM_FIELD_VALUE_INVALID, CUSTOM_FIELD_REQUIRED, CUSTOM_FIELD_TARGET_MISMATCH, REFERENCE_NOT_FOUND, VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/mark-cleared:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Transactions]
      operationId: markTransactionsCleared
      summary: Mark (or unmark) several posted transactions as cleared in one atomic operation
      description: |
        All-or-nothing: every item carries the expected `version`; any mismatch fails the whole request with 412 and
        one entry per stale item in `errors[]` (`code: PRECONDITION_FAILED`). Never touches the ledger. Each change
        publishes `transactions.TransactionCleared.v1` (docs/31 D47) in addition to `TransactionUpdated.v1`; an item
        dated in a closed period → 409 `PERIOD_CLOSED`.
      x-openspec-capability: transactions/reconciliation
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClearedMarkRequest' }
      responses:
        '200':
          description: Updated transactions
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClearedMarkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION, TRANSACTION_RECONCILED, PERIOD_CLOSED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
          description: 'PRECONDITION_FAILED, with one `errors[]` entry per stale item.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/bulk-edit/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Transactions]
      operationId: previewBulkEditTransactions
      summary: Preview a bulk edit (no side effects)
      description: |
        Resolves the selection (explicit ids or the same filters as `listTransactions`, at most 500 transactions) and
        reports, per transaction, its current `version` (the one the execution must send), whether the requested
        changes are applicable and, when not, the error codes that would reject it (`BULK_EDIT_NOT_APPLICABLE`,
        `PERIOD_CLOSED`, `TRANSACTION_RECONCILED`, `INVALID_STATUS_TRANSITION`, `CATEGORY_ARCHIVED`,
        `CATEGORY_KIND_MISMATCH`, `CUSTOM_FIELD_VALUE_INVALID`, `RESOURCE_NOT_FOUND`…). `truncated` is true when the
        filter matches more than 500 transactions (only the first 500 are reported). Safe to repeat, so no
        `Idempotency-Key`; writes nothing, not even audit.
      x-openspec-capability: transactions/bulk-edit
      x-required-role: EDITOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkEditPreviewRequest' }
      responses:
        '200':
          description: Scope of the bulk edit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEditPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/bulk-edit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Transactions]
      operationId: bulkEditTransactions
      summary: Edit the classification and cleared state of up to 500 transactions in one atomic operation
      description: |
        ALL_OR_NOTHING (the only mode in Phase 2, docs/33 D94). Every item carries the expected `version` (the
        per-item equivalent of `If-Match`); every item is evaluated and the response lists **all** the failures in
        `errors[]` (`pointer: /items/<i>`, `code` per item). The HTTP status is the one of the highest-priority
        error: 404 > 403 > 412 > 409 > 422. Nothing changes if any item fails.

        Never accepts amounts, accounts, dates, currency, splits, statuses other than `cleared` or `systemFlags`
        (unknown `changes` properties → 400 `VALIDATION_FAILED`) and never touches the ledger (INV-033). `categoryId`
        applies only to income/expense/refund transactions with exactly one split; tags and custom fields apply to
        every split. In a closed period category, tags, counterparty, custom fields and `cleared` are rejected with
        `PERIOD_CLOSED` (docs/33 D65); `notes` are allowed.

        Each changed transaction gets its own audit record plus one aggregate record
        (`transactions.transaction.bulk_edited`, aggregate `TransactionBulkOperation`); all of them, the lifecycle
        records and the events carry `bulkOperationId` as their `correlationId`. There is no automatic undo: revert
        with another bulk edit using the audit trail filtered by `bulkOperationId` (docs/33 D95).
        Costly operation (`x-rate-limit: costly`): at most 10 per user and minute (429 `RATE_LIMITED`); an idempotent
        replay does not consume the quota.
      x-openspec-capability: transactions/bulk-edit
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkEditRequest' }
      responses:
        '200':
          description: Updated transactions, in the order of the request
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEditResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'RESOURCE_NOT_FOUND for an item that does not exist in the workspace (same as one of another workspace).'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'PERIOD_CLOSED, TRANSACTION_RECONCILED, INVALID_STATUS_TRANSITION, CATEGORY_ARCHIVED, TAG_ARCHIVED, COUNTERPARTY_ARCHIVED, CUSTOM_FIELD_ARCHIVED, CONCURRENCY_CONFLICT, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
          description: 'PRECONDITION_FAILED, with one `errors[]` entry per stale item.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BULK_EDIT_NOT_APPLICABLE, CATEGORY_KIND_MISMATCH, CUSTOM_FIELD_VALUE_INVALID, CUSTOM_FIELD_REQUIRED, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/transactions/duplicate-check:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Transactions]
      operationId: checkTransactionDuplicates
      summary: Find possible duplicates of a transaction being entered (no side effects)
      description: Same account, same amount and a business date within ±3 days; safe to repeat, so no `Idempotency-Key`.
      x-openspec-capability: transactions/duplicate-detection
      x-required-role: EDITOR
      requestBody:
        required: true
