        min:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        max:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        percent:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        incomeBasis:
          oneOf:
            - $ref: '#/components/schemas/BudgetIncomeBasis'
            - type: 'null'
        rolloverPolicy: { $ref: '#/components/schemas/BudgetRolloverPolicy' }
        rolloverCap:
          oneOf:
            - $ref: '#/components/schemas/Money'
