        payment allocations; each installment shows the expected, paid and difference per component (`paid - expected`).
      x-openspec-capability: [debt/loans]
      x-required-role: VIEWER
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: List the installments of a schedule version with their payment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallmentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/loans/{loanId}/payments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Debt]
      operationId: listLoanPayments
      summary: List the payments of a loan
      description: |
        Oldest first, including voided payments.
      x-openspec-capability: [debt/loans]
      x-required-role: VIEWER
      responses:
        '200':
          description: List the payments of a loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPaymentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Debt]
      operationId: recordLoanPayment
      summary: Register a payment of a loan with its breakdown
      description: |
        Creates, in one unit of work, a `LOAN_PAYMENT` transaction that withdraws the amount from the payment account, reduces the debt by the
        principal and records interest, fees, insurance and taxes as expenses. Without `breakdown` the amount is allocated to the unpaid
        installments in order and, within each one, taxes, insurance, fees, interest and principal. With `breakdown` (for one installment,
        `installmentNo` required) the components must add up to the amount. A payment account in another currency than the loan answers 422
        `CURRENCY_MISMATCH` (no implicit conversion).
      x-openspec-capability: [debt/loans]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
