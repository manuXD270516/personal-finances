  # ───────────────────────────── Planning: presupuestos (Phase 2, add-budgets) ─────────────────────────────
  /workspaces/{workspaceId}/budgets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Planning]
      operationId: listBudgets
      summary: List the monthly plans of the workspace (newest period first) with their summaries
      description: |
        One plan per financial period, in the workspace base currency. The summary computes planned, spent, remaining and
        available-to-spend on every read from the posted transactions (never stored, INV-034). `periodFrom` / `periodTo`
        are inclusive period labels (`YYYY-MM`).
      x-openspec-capability: [planning/budgets]
      x-required-role: VIEWER
      parameters:
        - name: periodFrom
          in: query
          description: First period label to include (`YYYY-MM`).
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        - name: periodTo
          in: query
          description: Last period label to include (`YYYY-MM`).
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Page size (default 24 plans)
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Plans page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Planning]
      operationId: createBudget
      summary: Create the monthly plan of a financial period
      description: |
        At most one plan per period (`BUDGET_ALREADY_EXISTS`), in the workspace base currency. A closed period does not
        admit a new plan (`PERIOD_CLOSED`). Publishes `planning.BudgetCreated.v1`. `source.kind` is `EMPTY`, `TEMPLATE`
        (a version of a template; archived template => `BUDGET_TEMPLATE_ARCHIVED`) or `CLONE_PREVIOUS` (the plan of the
        previous period; none => `REFERENCE_NOT_FOUND`). New periods get their plan automatically from the default
        template, if any.
      x-openspec-capability: [planning/budgets, planning/budget-templates]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetCreate' }
      responses:
        '201':
          description: Plan created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'BUDGET_ALREADY_EXISTS (the period already has a plan), PERIOD_CLOSED or BUDGET_TEMPLATE_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'REFERENCE_NOT_FOUND (periodId, templateId, versionNo or no plan to clone) or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/budgets/{budgetId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    get:
      tags: [Planning]
      operationId: getBudget
      summary: Get a plan with the progress of each line
      description: |
        Planned (effective, with rollover), spent, remaining, usage %, linear projection (only `MAXIMUM`, `RANGE` and
        `PERCENT_OF_INCOME`; `FIXED` and `MINIMUM` show pending/met without projection), status, crossed thresholds and
        the available-to-spend total. The spent amount is derived on every read from the posted, cleared and reconciled
        transactions of the period (net of refunds, by business date in the workspace time zone) and converted to the
        plan currency with the same valuation rules as `/reports/summary`; a movement without a rate in the window is
        reported unconverted (`actualComplete = false`), never 1:1.
      x-openspec-capability: [planning/budgets]
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Plan
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Planning]
      operationId: updateBudget
      summary: Switch the zero-based mode of a plan
      x-openspec-capability: [planning/budgets]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/BudgetUpdate' }
      responses:
        '200':
          description: Updated plan
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'PERIOD_CLOSED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/budgets/{budgetId}/history:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    get:
      tags: [Planning]
      operationId: getBudgetHistory
      summary: Change history of a plan and its lines (visible for VIEWER)
      description: |
        Audit entries of the plan and of every line change (actor, line, before and after values), oldest first. Unlike
        `/audit-log` (EDITOR+), any member who can see the plan can read it, VIEWER included. Budgets have no
        lifecycle state machine (docs/33 D110): the history lives in the audit log.
      x-openspec-capability: [planning/budgets]
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Plan history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/periods/{periodId}/budget:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PeriodId'
    get:
      tags: [Planning]
      operationId: getBudgetByPeriod
      summary: Get the plan of a financial period
      description: 404 `RESOURCE_NOT_FOUND` when the period does not exist or has no plan.
      x-openspec-capability: [planning/budgets]
      x-required-role: VIEWER
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Plan of the period
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/budgets/{budgetId}/lines:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    post:
      tags: [Planning]
      operationId: addBudgetLine
      summary: Add a line to a plan
      description: |
        Expense lines target a category (with its subcategories), a group or a tag; income lines target an income
        category and only admit the `FIXED` kind, without thresholds. A plan cannot repeat a target
        (`BUDGET_LINE_DUPLICATE_TARGET`) nor overlap a category with its subcategory or a group with one of its
        categories (`BUDGET_TARGET_OVERLAP`). Expense lines of kind `FIXED`, `MAXIMUM`, `RANGE` and `PERCENT_OF_INCOME`
        get the default thresholds 50, 75, 90 and 100 % unless `thresholds` is given; `MINIMUM` lines have none. The
        thresholds of the new line are evaluated in the same transaction. Per kind: `FIXED` and `MAXIMUM` need `planned`,
        `MINIMUM` needs `min`, `RANGE` needs `min` and `max`, `PERCENT_OF_INCOME` needs `percent` (and optionally
        `incomeBasis`).
      x-openspec-capability: [planning/budgets]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetLineCreate' }
      responses:
        '201':
          description: Line created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'BUDGET_LINE_DUPLICATE_TARGET, BUDGET_TARGET_OVERLAP, PERIOD_CLOSED or CATEGORY_ARCHIVED / TAG_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BUDGET_INVALID_AMOUNTS, BUDGET_INVALID_LINE_KIND, BUDGET_THRESHOLD_INVALID, CURRENCY_MISMATCH, AMOUNT_SCALE_EXCEEDED or REFERENCE_NOT_FOUND.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/budgets/{budgetId}/lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/BudgetLineId'
    patch:
      tags: [Planning]
      operationId: updateBudgetLine
      summary: Change the amounts, kind, thresholds or rollover of a line
      description: |
        Merge patch over the current line, validated as a whole. A `null` removes a value (for example `thresholds: null`
        restores the defaults). Changing the planned amount or the thresholds re-evaluates the thresholds with the current
        spent amount in the same transaction and publishes `planning.BudgetThresholdReached.v1` for the thresholds that
        end up crossed for the first time. The plan of a closed period is read-only (`PERIOD_CLOSED`).
      x-openspec-capability: [planning/budgets]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/BudgetLineUpdate' }
      responses:
        '200':
          description: Updated line
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'PERIOD_CLOSED.'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BUDGET_INVALID_AMOUNTS, BUDGET_INVALID_LINE_KIND, BUDGET_THRESHOLD_INVALID, CURRENCY_MISMATCH or AMOUNT_SCALE_EXCEEDED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Planning]
      operationId: removeBudgetLine
      summary: Remove a line from a plan
      description: |
        Removing and re-adding the line of the same target does not re-alert: the crossed thresholds are recorded per
        period and target. The plan of a closed period is read-only (`PERIOD_CLOSED`).
      x-openspec-capability: [planning/budgets]
      x-required-role: EDITOR
      responses:
        '204':
          description: Line removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'PERIOD_CLOSED.'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Planning: templates de presupuesto (Phase 2, add-budget-templates) ─────────────────────────────
  /workspaces/{workspaceId}/templates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Planning]
      operationId: listTemplates
      summary: List the budget templates of the workspace (default first, then by name)
      description: |
        Templates are never deleted: archived ones stay listed under `status=ARCHIVED`. Each item carries its current
        version number and line count; `getTemplate` returns the lines and the version history.
      x-openspec-capability: [planning/budget-templates]
      x-required-role: VIEWER
      parameters:
        - name: status
          in: query
          description: Only templates in this status (default all).
          schema: { $ref: '#/components/schemas/TemplateStatus' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Page size (default 50)
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Templates page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Planning]
      operationId: createTemplate
      summary: Create a budget template with its version 1
      description: |
        Same line format and rules as the lines of a plan (amounts in the workspace base currency, kinds, thresholds,
        unique and non-overlapping targets; archived targets are rejected). The name is unique among the active templates
        of the workspace, ignoring case (`NAME_TAKEN`).
      x-openspec-capability: [planning/budget-templates]
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '201':
          description: Template created (version 1)
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'NAME_TAKEN, BUDGET_LINE_DUPLICATE_TARGET, BUDGET_TARGET_OVERLAP or CATEGORY_ARCHIVED / TAG_ARCHIVED.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'BUDGET_INVALID_AMOUNTS, BUDGET_INVALID_LINE_KIND, BUDGET_THRESHOLD_INVALID, CURRENCY_MISMATCH, AMOUNT_SCALE_EXCEEDED, REFERENCE_NOT_FOUND or IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/templates/{templateId}:
