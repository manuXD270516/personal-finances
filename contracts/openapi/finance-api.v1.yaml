          items: { $ref: '#/components/schemas/BudgetPropagationPeriod' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/BudgetPropagationChange' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/BudgetPropagationConflict' }
        token: { type: string }
    BudgetPropagationResult:
      type: object
      additionalProperties: false
      required: [template, applied]
      properties:
        template: { $ref: '#/components/schemas/Template' }
        applied:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [budgetId, periodId, periodLabel, changes, conflicts]
            properties:
              budgetId: { $ref: '#/components/schemas/Uuid' }
              periodId: { $ref: '#/components/schemas/Uuid' }
              periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
              changes: { type: integer, minimum: 0 }
              conflicts: { type: integer, minimum: 0 }

    # ── Recorrido del ciclo de vida (add-lifecycle-timeline, docs/31 D37) ──
    LifecycleAggregateType:
      type: string
      description: >-
        Tipo de agregado con máquina de estados declarada (docs/31 D37; Category y Counterparty, D52). Open set —
        clients must handle unknown values.
      pattern: '^[A-Z][A-Za-z]{0,63}$'
      # x-extensible-enum (convención reconocida por oasdiff, como ErrorCode): el catálogo de máquinas crece de forma
      # aditiva (Category y Counterparty, decisión del owner D52; FinancialPeriod, add-financial-periods).
      x-extensible-enum: [Transaction, Account, ExchangeRate, Category, Counterparty, FinancialPeriod, Reconciliation]
    LifecycleAggregateTypeInput:
      type: string
      description: LifecycleAggregateType aceptado en peticiones (conjunto cerrado; las respuestas usan el conjunto abierto).
      enum: [Transaction, Account, ExchangeRate, Category, Counterparty, FinancialPeriod, Reconciliation]
    LifecycleMachine:
      type: object
      description: Máquina de estados declarada por el contexto dueño (dato puro; `from` vacío = creación desde ∅).
      additionalProperties: false
      required: [aggregateType, machineVersion, states, transitions]
      properties:
        aggregateType: { type: string, examples: [Transaction] }
        machineVersion: { type: integer, minimum: 1 }
        states:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, terminal]
            properties:
              code: { type: string, examples: [POSTED] }
              terminal: { type: boolean }
        transitions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, from, to, guard, events]
            properties:
              code: { type: string, examples: [REVISE] }
              from:
                type: array
                items: { type: string }
              to:
                type: array
                minItems: 1
                items: { type: string }
              guard: { type: string }
              events:
                type: array
                items: { type: string, examples: [transactions.TransferRevised.v1] }
    LifecycleActor:
      type: object
      additionalProperties: false
      required: [type, id, displayName]
      properties:
        type: { $ref: '#/components/schemas/AuditActorType' }
        id: { type: string, description: 'userId (USER) o identificador del proceso (SYSTEM/WORKER)' }
        displayName: { type: [string, 'null'] }
    LifecycleJournalEntries:
      type: object
      description: Asientos del ledger del paso (revertido, su reversa y el nuevo); null si no aplica.
      additionalProperties: false
      required: [reversed, reversal, posted]
      properties:
        reversed: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reversal: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        posted: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    LifecycleTransition:
      type: object
      additionalProperties: false
      required:
        - sequence
        - kind
        - transition
        - fromState
        - toState
        - machineVersion
        - occurredAt
        - actor
        - origin
        - reason
        - revisionFrom
        - revisionTo
        - aggregateVersion
        - journalEntries
        - detailRefs
        - events
        - auditLogId
        - derived
      properties:
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, const: TRANSITION }
        transition: { type: string, examples: [REVISE] }
        fromState: { type: [string, 'null'], description: 'null = creación (∅)' }
        toState: { type: string }
        machineVersion: { type: integer, minimum: 1 }
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actor: { $ref: '#/components/schemas/LifecycleActor' }
        origin: { $ref: '#/components/schemas/AuditOrigin' }
        reason: { type: [string, 'null'] }
        revisionFrom: { type: [integer, 'null'], minimum: 1 }
        revisionTo: { type: [integer, 'null'], minimum: 1 }
        aggregateVersion: { type: [integer, 'null'], minimum: 1 }
        journalEntries: { $ref: '#/components/schemas/LifecycleJournalEntries' }
        detailRefs:
          type: object
          description: Referencias a detalles (`conversionRevision`, `supersededByRateId`, `supersedesRateId`).
          additionalProperties:
            oneOf: [{ type: string }, { type: integer }]
        events:
          type: array
          items: { type: string, examples: [transactions.TransferRevised.v1] }
        auditLogId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        derived:
          type: boolean
          description: true si se reconstruyó desde la auditoría (datos anteriores al registro de transiciones).
    LifecycleAnnotation:
      type: object
      description: Cambio descriptivo (sin cambio de estado ni de ledger) en el recorrido.
      additionalProperties: false
      required:
        - sequence
        - kind
        - occurredAt
        - actor
        - origin
        - changedFields
        - revisionFrom
        - revisionTo
        - aggregateVersion
        - events
        - auditLogId
        - derived
      properties:
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, const: ANNOTATION }
        occurredAt: { $ref: '#/components/schemas/Instant' }
        actor: { $ref: '#/components/schemas/LifecycleActor' }
        origin: { $ref: '#/components/schemas/AuditOrigin' }
        changedFields:
          type: array
          items: { type: string }
        detailRefs:
          type: object
          description: Referencias de la anotación (p. ej. `reconciliationId` de la sesión que cotejó la transacción, `transactionId` en el recorrido de una sesión).
          additionalProperties:
            oneOf: [{ type: string }, { type: integer }]
        revisionFrom: { type: [integer, 'null'], minimum: 1 }
        revisionTo: { type: [integer, 'null'], minimum: 1 }
        aggregateVersion: { type: [integer, 'null'], minimum: 1 }
        events:
          type: array
          items: { type: string }
        auditLogId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        derived: { type: boolean }
    Lifecycle:
      type: object
      description: Recorrido de un elemento (docs/31 D37).
      required: [aggregateType, aggregateId, currentState, path, historyComplete, machine, items]
      properties:
        aggregateType: { $ref: '#/components/schemas/LifecycleAggregateType' }
        aggregateId: { $ref: '#/components/schemas/Uuid' }
        currentState: { type: [string, 'null'] }
        path:
          type: array
          description: Estados visitados en orden (destino de cada transición).
          items: { type: string }
        historyComplete:
          type: boolean
          description: false si el recorrido no arranca en una creación (historia previa sin evidencia).
        machine: { $ref: '#/components/schemas/LifecycleMachine' }
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/LifecycleTransition'
              - $ref: '#/components/schemas/LifecycleAnnotation'
            discriminator:
              propertyName: kind
              mapping:
                TRANSITION: '#/components/schemas/LifecycleTransition'
                ANNOTATION: '#/components/schemas/LifecycleAnnotation'
    LifecycleRevision:
      type: object
      description: Montos de una revisión de la transacción (legs vigentes y reemplazados; detalle de conversión).
      additionalProperties: false
      required: [revision, amount, fee, legs, conversion]
      properties:
        revision: { type: integer, minimum: 1 }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        legs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, role, amount]
            properties:
              accountId: { $ref: '#/components/schemas/Uuid' }
              role: { type: string, enum: [MAIN, SOURCE, TARGET, FEE] }
              amount: { $ref: '#/components/schemas/Money' }
        conversion:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [sourceAccountId, targetAccountId, sourceAmount, targetAmount, effectiveRate, fees]
              properties:
                sourceAccountId: { $ref: '#/components/schemas/Uuid' }
                targetAccountId: { $ref: '#/components/schemas/Uuid' }
                sourceAmount: { $ref: '#/components/schemas/Money' }
                targetAmount: { $ref: '#/components/schemas/Money' }
                effectiveRate: { $ref: '#/components/schemas/Rate' }
                fees:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, amount]
                    properties:
                      type: { $ref: '#/components/schemas/ConversionFeeType' }
                      amount: { $ref: '#/components/schemas/Money' }
    TransactionLifecycle:
      description: Recorrido de una transacción con los montos de cada revisión.
      allOf:
        - $ref: '#/components/schemas/Lifecycle'
        - type: object
          required: [revisions]
          properties:
            revisions:
              type: array
              items: { $ref: '#/components/schemas/LifecycleRevision' }
            reconciliations:
              type: array
              description: |
                Sessions referenced by the transitions and annotations (`detailRefs.reconciliationId`) with the statement
                date and balance they were reconciled or verified against (add-reconciliation).
              items:
                type: object
                additionalProperties: false
                required: [reconciliationId, accountId, statementDate, statementBalance]
                properties:
                  reconciliationId: { $ref: '#/components/schemas/Uuid' }
                  accountId: { $ref: '#/components/schemas/Uuid' }
                  statementDate: { $ref: '#/components/schemas/LocalDate' }
                  statementBalance: { $ref: '#/components/schemas/Money' }

    # ── Reconciliation (Phase 2, add-reconciliation) ──
    ReconciliationMode:
      type: string
      enum: [STATEMENT, WITHOUT_STATEMENT]
      description: How a RECONCILED transaction was reconciled (docs/33 D74).
    SystemFlag:
      type: string
      # Marcas de sistema derivadas y de solo lectura; el conjunto crece de forma aditiva.
      x-extensible-enum: [RECONCILED_WITHOUT_STATEMENT]
      description: Derived read-only transaction flag (docs/33 D111).
    ReconciliationState:
      type: string
      enum: [IN_PROGRESS, COMPLETED, CANCELLED]
    ReconciliationItem:
      type: object
      additionalProperties: false
      required: [transactionId, reconciledAt, verifiedWithoutStatement, unreconciledAt, unreconcileReason]
      properties:
        transactionId: { $ref: '#/components/schemas/Uuid' }
        reconciledAt: { $ref: '#/components/schemas/Instant' }
        verifiedWithoutStatement:
          type: boolean
          description: true when the transaction was already reconciled without a statement and this session verified it.
        unreconciledAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
          description: Later un-reconciliation (the session result is not altered).
        unreconcileReason: { type: [string, 'null'] }
    Reconciliation:
      type: object
      required:
        - id
        - accountId
        - status
        - statementDate
        - statementBalance
        - clearedBalance
        - difference
        - adjustmentTransactionId
        - startedBy
        - startedAt
        - completedAt
        - cancelledAt
        - version
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ReconciliationState' }
        statementDate: { $ref: '#/components/schemas/LocalDate' }
        statementBalance:
          $ref: '#/components/schemas/Money'
          description: Statement balance in the account currency (liabilities as a positive debt).
        clearedBalance:
          description: Live while IN_PROGRESS, frozen when COMPLETED (equal to the statement balance after the adjustment); null when CANCELLED.
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        difference:
          description: statementBalance − clearedBalance; 0 when COMPLETED; null when CANCELLED.
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        adjustmentTransactionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        startedBy: { $ref: '#/components/schemas/Uuid' }
        startedAt: { $ref: '#/components/schemas/Instant' }
        completedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        cancelledAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        version: { $ref: '#/components/schemas/Version' }
        items:
          type: array
          description: Present when COMPLETED.
          items: { $ref: '#/components/schemas/ReconciliationItem' }
    ReconciliationPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Reconciliation' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ReconciliationStart:
      type: object
      additionalProperties: false
      required: [accountId, statementDate, statementBalance]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        statementDate: { $ref: '#/components/schemas/LocalDate' }
        statementBalance:
          $ref: '#/components/schemas/DecimalString'
          description: Statement balance in the account currency and scale (more decimals → 422 AMOUNT_SCALE_EXCEEDED).
    ReconciliationComplete:
      type: object
      additionalProperties: false
      properties:
        adjustment:
          type: object
          additionalProperties: false
          required: [reason]
          description: Explicit confirmation of an adjustment that closes a non-zero difference.
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
    ReconciliationStatus:
      type: object
      description: Reconciliation status of an account at a cut-off date (`ReconciliationStatusQuery.getCoverage`).
      additionalProperties: false
      required:
        - accountId
        - lastCompleted
        - inProgressReconciliationId
        - unreconciledPostedCountThrough
        - unreconciledClearedCountThrough
        - reconciledWithoutStatementCount
        - reconciledThrough
        - reconciliationBasis
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        lastCompleted:
          oneOf:
            - type: object
              additionalProperties: false
              required: [reconciliationId, statementDate, statementBalance, difference, completedAt]
              properties:
                reconciliationId: { $ref: '#/components/schemas/Uuid' }
                statementDate: { $ref: '#/components/schemas/LocalDate' }
                statementBalance: { $ref: '#/components/schemas/Money' }
                difference: { $ref: '#/components/schemas/Money' }
                completedAt: { $ref: '#/components/schemas/Instant' }
            - type: 'null'
        inProgressReconciliationId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        unreconciledPostedCountThrough: { type: integer, minimum: 0 }
        unreconciledClearedCountThrough: { type: integer, minimum: 0 }
        reconciledWithoutStatementCount:
          type: integer
          minimum: 0
          description: Transactions reconciled without a statement dated in `[from, asOf]`.
        reconciledThrough: { type: boolean }
        reconciliationBasis:
          description: null when not reconciled; WITHOUT_STATEMENT when the range holds transactions reconciled without a statement.
          type: [string, 'null']
          enum: [STATEMENT, WITHOUT_STATEMENT, null]
    # ── Planning: cierre de mes (add-month-closing) ──
    ChecklistItemKind:
      type: string
      enum:
        - PENDING_TRANSACTIONS
        - UNRECONCILED_ACCOUNTS
        - UNRESOLVED_DUPLICATES
        - UNCATEGORIZED
        - UNRESOLVED_RECURRING
        - RECONCILED_WITHOUT_STATEMENT
    ChecklistSeverity:
      type: string
      description: '`INFO` only for `RECONCILED_WITHOUT_STATEMENT`; it never appears in `ClosingPolicy`.'
      enum: [BLOCKING, WARNING, INFO]
    CloseChecklistDetail:
      type: object
      additionalProperties: false
      required: [refType, refId, label, date, amount]
      properties:
        refType: { type: string, enum: [TRANSACTION, ACCOUNT, DUPLICATE_CANDIDATE, SPLIT] }
        refId: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }
        date: { oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }] }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
    CloseChecklistItem:
      type: object
      additionalProperties: false
      required: [kind, severity, availability, count, amounts, details, truncated]
      properties:
        kind: { $ref: '#/components/schemas/ChecklistItemKind' }
        severity: { $ref: '#/components/schemas/ChecklistSeverity' }
        availability: { type: string, enum: [AVAILABLE, NOT_AVAILABLE] }
        count: { type: integer, minimum: 0 }
        amounts:
          type: array
          description: Amounts per currency, never converted.
          items: { $ref: '#/components/schemas/Money' }
        details:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CloseChecklistDetail' }
        truncated: { type: boolean }
    CloseChecklist:
      type: object
      additionalProperties: false
      required: [periodId, label, periodStart, periodEnd, evaluatedAt, canClose, requiresAcknowledgement, items]
      properties:
        periodId: { $ref: '#/components/schemas/Uuid' }
        label: { type: string }
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        evaluatedAt: { $ref: '#/components/schemas/Instant' }
        canClose: { type: boolean, description: False when some blocking item has observations }
        requiresAcknowledgement: { type: boolean, description: True when only warnings have observations }
        items:
          type: array
          items: { $ref: '#/components/schemas/CloseChecklistItem' }
    ClosePeriodRequest:
      type: object
      additionalProperties: false
      properties:
        acknowledgeWarnings: { type: boolean, default: false }
        note: { type: string, minLength: 0, maxLength: 500 }
    ReopenPeriodRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CloseSnapshotSummary:
      type: object
      required: [snapshotId, closeNo, closedAt, closedBy, previousSnapshotId, isCurrent]
      properties:
        snapshotId: { $ref: '#/components/schemas/Uuid' }
        closeNo: { type: integer, minimum: 1 }
        closedAt: { $ref: '#/components/schemas/Instant' }
        closedBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        previousSnapshotId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        isCurrent: { type: boolean }
    CloseSnapshotBalance:
      type: object
      additionalProperties: false
      required:
        - accountId
        - accountName
        - ledgerAccountId
        - currency
        - balance
        - presented
        - reconciliation
        - reconciliationBasis
        - reconciledWithoutStatementTransactionIds
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        accountName: { type: string }
        ledgerAccountId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        balance: { $ref: '#/components/schemas/Money' }
        presented: { $ref: '#/components/schemas/Money' }
        reconciliation:
          oneOf:
            - type: object
              additionalProperties: false
              required: [reconciliationId, statementDate, statementBalance]
              properties:
                reconciliationId: { $ref: '#/components/schemas/Uuid' }
                statementDate: { $ref: '#/components/schemas/LocalDate' }
                statementBalance: { $ref: '#/components/schemas/Money' }
            - type: 'null'
        reconciliationBasis:
          description: Null when the account was not reconciled at close (warning acknowledged).
          oneOf:
            - { type: string, enum: [STATEMENT, WITHOUT_STATEMENT] }
            - { type: 'null' }
        reconciledWithoutStatementTransactionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    CloseSnapshotFlows:
      type: object
      additionalProperties: false
      required: [byCurrency, consolidated]
      properties:
        byCurrency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, income, expense, savings]
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              income: { $ref: '#/components/schemas/Money' }
              expense: { $ref: '#/components/schemas/Money' }
              savings: { $ref: '#/components/schemas/Money' }
        consolidated:
          type: object
          additionalProperties: false
          required: [currency, income, expense, savings, savingsRate, complete, unconverted]
          properties:
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            income: { $ref: '#/components/schemas/Money' }
            expense: { $ref: '#/components/schemas/Money' }
            savings: { $ref: '#/components/schemas/Money' }
            savingsRate:
              description: Percentage with one decimal (HALF_EVEN); null without income.
              oneOf: [{ type: string }, { type: 'null' }]
            complete: { type: boolean }
            unconverted:
              type: array
              items: { $ref: '#/components/schemas/Money' }
    CloseSnapshot:
      description: One immutable version of the close snapshot (amounts as decimal text at the currency scale).
      allOf:
        - $ref: '#/components/schemas/CloseSnapshotSummary'
        - type: object
          required:
            - periodId
            - label
            - periodStart
            - periodEnd
            - baseCurrency
            - balances
            - reconciledWithoutStatement
            - flows
            - netWorth
            - budgetVsActual
            - goalContributions
            - checklist
            - acknowledgedWarnings
          properties:
            periodId: { $ref: '#/components/schemas/Uuid' }
            label: { type: string }
            periodStart: { $ref: '#/components/schemas/LocalDate' }
            periodEnd: { $ref: '#/components/schemas/LocalDate' }
            baseCurrency: { $ref: '#/components/schemas/CurrencyCode' }
            balances:
              type: array
              items: { $ref: '#/components/schemas/CloseSnapshotBalance' }
            reconciledWithoutStatement:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [transactionId, accountId, businessDate, amount]
                properties:
                  transactionId: { $ref: '#/components/schemas/Uuid' }
                  accountId: { $ref: '#/components/schemas/Uuid' }
                  businessDate: { $ref: '#/components/schemas/LocalDate' }
                  amount: { $ref: '#/components/schemas/Money' }
            flows: { $ref: '#/components/schemas/CloseSnapshotFlows' }
            netWorth:
              type: object
              additionalProperties: false
              required: [amount, assets, liabilities, complete, unconverted, rates]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                assets: { $ref: '#/components/schemas/Money' }
                liabilities: { $ref: '#/components/schemas/Money' }
                complete: { type: boolean }
                unconverted:
                  type: array
                  items: { $ref: '#/components/schemas/Money' }
                rates:
                  type: array
                  description: Every rate used to value the snapshot, with its source.
                  items: { $ref: '#/components/schemas/ResolvedRate' }
            budgetVsActual:
              description: Null when the period has no monthly plan (not available, no invented amounts).
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [budgetId, currency, lines, totals]
                  properties:
                    budgetId: { $ref: '#/components/schemas/Uuid' }
                    currency: { $ref: '#/components/schemas/CurrencyCode' }
                    lines:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [target, targetName, nature, reference, actual, status]
                        properties:
                          target:
                            type: object
                            additionalProperties: false
                            required: [kind, id]
                            properties:
                              kind: { type: string, enum: [CATEGORY, GROUP, TAG] }
                              id: { $ref: '#/components/schemas/Uuid' }
                          targetName: { type: string }
                          nature: { type: string, enum: [EXPENSE, INCOME] }
                          reference: { $ref: '#/components/schemas/Money' }
                          actual: { $ref: '#/components/schemas/Money' }
                          status: { type: string }
                    totals:
                      type: object
                      additionalProperties: false
                      required: [planned, actual, complete]
                      properties:
                        planned: { $ref: '#/components/schemas/Money' }
                        actual: { $ref: '#/components/schemas/Money' }
                        complete: { type: boolean }
                - type: 'null'
            goalContributions:
              description: Null until goals exist (Phase 4).
              type: 'null'
            checklist:
              type: array
              items: { $ref: '#/components/schemas/CloseChecklistItem' }
            acknowledgedWarnings:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [items, by, at]
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/ChecklistItemKind' }
                    by: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
                    at: { $ref: '#/components/schemas/Instant' }
                - type: 'null'
    CloseSnapshotDiff:
      type: object
      additionalProperties: false
      required: [from, to, balances, flows, netWorth]
      properties:
        from: { type: integer, minimum: 1 }
        to: { type: integer, minimum: 1 }
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, currency, delta]
            properties:
              accountId: { $ref: '#/components/schemas/Uuid' }
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              delta: { $ref: '#/components/schemas/Money' }
        flows:
          type: object
          additionalProperties: false
          required: [byCurrency, consolidated]
          properties:
            byCurrency:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [currency, income, expense, savings]
                properties:
                  currency: { $ref: '#/components/schemas/CurrencyCode' }
                  income: { $ref: '#/components/schemas/Money' }
                  expense: { $ref: '#/components/schemas/Money' }
                  savings: { $ref: '#/components/schemas/Money' }
            consolidated:
              type: object
              additionalProperties: false
              required: [income, expense, savings]
              properties:
                income: { $ref: '#/components/schemas/Money' }
                expense: { $ref: '#/components/schemas/Money' }
                savings: { $ref: '#/components/schemas/Money' }
        netWorth:
          type: object
          additionalProperties: false
          required: [delta]
          properties:
            delta: { $ref: '#/components/schemas/Money' }
    CloseReport:
      type: object
      additionalProperties: false
      required: [snapshot, versions, comparison, comparisonUnavailableReason]
      properties:
        snapshot: { $ref: '#/components/schemas/CloseSnapshot' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/CloseSnapshotSummary' }
        comparison:
          oneOf:
            - type: object
              additionalProperties: false
              required: [previousPeriodId, previousLabel, previousCloseNo, deltas]
              properties:
                previousPeriodId: { $ref: '#/components/schemas/Uuid' }
                previousLabel: { type: string }
                previousCloseNo: { type: integer, minimum: 1 }
                deltas:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [kpi, absolute, percentage]
                    properties:
                      kpi: { type: string, enum: [INCOME, EXPENSE, SAVINGS, SAVINGS_RATE, NET_WORTH] }
                      absolute:
                        description: Money in the base currency; percentage points (text) for SAVINGS_RATE; null without rate.
                        oneOf:
                          - { $ref: '#/components/schemas/Money' }
                          - { type: string }
                          - { type: 'null' }
                      percentage:
                        description: Relative variation with one decimal (HALF_EVEN); null when the previous value is 0.
                        oneOf: [{ type: string }, { type: 'null' }]
            - type: 'null'
        comparisonUnavailableReason:
          oneOf:
            - { type: string, enum: [NO_PREVIOUS_PERIOD, NO_PREVIOUS_SNAPSHOT] }
            - { type: 'null' }
    ClosingPolicySeverities:
      type: object
      description: Severity of each configurable checklist item (the informational item is not part of the policy).
      required:
        - PENDING_TRANSACTIONS
        - UNRECONCILED_ACCOUNTS
        - UNRESOLVED_DUPLICATES
        - UNCATEGORIZED
        - UNRESOLVED_RECURRING
      propertyNames:
        enum:
          - PENDING_TRANSACTIONS
          - UNRECONCILED_ACCOUNTS
          - UNRESOLVED_DUPLICATES
          - UNCATEGORIZED
          - UNRESOLVED_RECURRING
      additionalProperties: { type: string, enum: [BLOCKING, WARNING] }
    ClosingPolicy:
      type: object
      additionalProperties: false
      required: [severities, version, updatedAt, updatedBy]
      properties:
        severities: { $ref: '#/components/schemas/ClosingPolicySeverities' }
        version: { type: integer, minimum: 1 }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        updatedBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    ClosingPolicyUpdate:
      type: object
      additionalProperties: false
      required: [severities]
      properties:
        severities: { $ref: '#/components/schemas/ClosingPolicySeverities' }

    ReconciliationLifecycle:
      description: Lifecycle of a reconciliation session with its balances.
      allOf:
        - $ref: '#/components/schemas/Lifecycle'
        - type: object
          required: [reconciliation]
          properties:
            reconciliation:
              type: object
              additionalProperties: false
              required: [accountId, statementDate, statementBalance, clearedBalance, difference, adjustmentTransactionId]
              properties:
                accountId: { $ref: '#/components/schemas/Uuid' }
                statementDate: { $ref: '#/components/schemas/LocalDate' }
                statementBalance: { $ref: '#/components/schemas/Money' }
                clearedBalance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                difference: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                adjustmentTransactionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }

    # ── Reporting ──
    CurrencyTotals:
      type: object
      required: [currency, income, expense, net]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net:
          $ref: '#/components/schemas/Money'
          description: Savings of the period (income − expense)
        liquidBalance:
          $ref: '#/components/schemas/Money'
          description: Sum of balances of LIQUID accounts in this currency
        savingsRate:
          description: Savings / income in %, 1 decimal; null when income is zero (undefined)
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        assets: { $ref: '#/components/schemas/Money' }
        liabilities: { $ref: '#/components/schemas/Money' }
        netWorth: { $ref: '#/components/schemas/Money' }
    ConsolidatedTotals:
      type: object
      description: Totals in the reporting currency. Always present; `complete=false` when some amount could not be converted.
      required: [currency, income, expense, net, liquidBalance, assets, liabilities, netWorth, complete, unconverted]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        liquidBalance: { $ref: '#/components/schemas/Money' }
        assets: { $ref: '#/components/schemas/Money' }
        liabilities: { $ref: '#/components/schemas/Money' }
        netWorth: { $ref: '#/components/schemas/Money' }
        savingsRate:
          description: Savings / income in %, 1 decimal; null = not defined
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        complete: { type: boolean }
        unconverted:
          type: array
          description: Native amounts per currency excluded for lack of a rate
          items: { $ref: '#/components/schemas/Money' }
    MoneyVariation:
      type: object
      required: [current, previous, deltaAbs, isNew]
      properties:
        current: { $ref: '#/components/schemas/Money' }
        previous: { $ref: '#/components/schemas/Money' }
        deltaAbs: { $ref: '#/components/schemas/Money' }
        deltaPct:
          description: Variation in %, 2 decimals; null when the previous value is zero
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        isNew: { type: boolean, description: True when there was nothing in the previous period }
    PeriodComparison:
      type: object
      required: [mode, previousPeriod, income, expense, savings]
      properties:
        mode:
          type: string
          enum: [PREVIOUS_PERIOD_TO_DATE, PREVIOUS_PERIOD]
        previousPeriod:
          type: object
          required: [from, to]
          properties:
            from: { $ref: '#/components/schemas/LocalDate' }
            to: { $ref: '#/components/schemas/LocalDate' }
        income: { $ref: '#/components/schemas/MoneyVariation' }
        expense: { $ref: '#/components/schemas/MoneyVariation' }
        savings: { $ref: '#/components/schemas/MoneyVariation' }
    AccountBalanceLine:
      type: object
      required: [accountId, name, type, nature, balance, includeInNetWorth, liquid]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        nature:
          type: string
          enum: [ASSET, LIABILITY]
        balance:
          $ref: '#/components/schemas/Money'
          description: Presented balance in the account currency
        convertedBalance:
          description: Balance in the reporting currency; null when no rate is available
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        rate:
          oneOf:
            - $ref: '#/components/schemas/ResolvedRate'
            - type: 'null'
        includeInNetWorth: { type: boolean }
        liquid: { type: boolean }
    NetWorthBreakdown:
      type: object
      required: [assets, liabilities, netWorth, complete, byCurrency, byAccountType, unvalued]
      properties:
        assets: { $ref: '#/components/schemas/Money' }
        liabilities: { $ref: '#/components/schemas/Money' }
        netWorth: { $ref: '#/components/schemas/Money' }
        complete: { type: boolean }
        byCurrency:
          type: array
          items:
            type: object
            required: [currency, assets, liabilities, net, converted]
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              assets: { $ref: '#/components/schemas/Money' }
              liabilities: { $ref: '#/components/schemas/Money' }
              net:
                $ref: '#/components/schemas/Money'
                description: Native currency
              converted:
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
        byAccountType:
          type: array
          items:
            type: object
            required: [type, amount]
            properties:
              type: { $ref: '#/components/schemas/AccountType' }
              amount:
                $ref: '#/components/schemas/Money'
                description: Reporting currency; liabilities negative
        unvalued:
          type: array
          description: Native amounts that could not be valued (no rate)
          items: { $ref: '#/components/schemas/Money' }
    NetWorthPoint:
      type: object
      additionalProperties: false
      required:
        [period, periodId, asOf, assets, liabilities, netWorth, change, comparable, complete, unconverted, source, closed, partial, ratesUsed]
      properties:
        period:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: Financial period label (`YYYY-MM` of its start, docs/33 D59)
        periodId: { $ref: '#/components/schemas/Uuid' }
        asOf:
          $ref: '#/components/schemas/LocalDate'
          description: Cut date, the end of the period (today for the period in progress)
        assets:
          $ref: '#/components/schemas/DecimalString'
          description: In `reportingCurrency`
        liabilities:
          $ref: '#/components/schemas/DecimalString'
          description: In `reportingCurrency`, positive when owed
        netWorth:
          $ref: '#/components/schemas/DecimalString'
          description: In `reportingCurrency` (assets − liabilities)
        change:
          description: Net worth difference with the previous point of the series; null on the first point
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        comparable:
          type: boolean
          description: False on the first point or when this or the previous point is incomplete
        complete: { type: boolean }
        unconverted:
          type: array
          description: Native amounts without a rate in force at the cut date (excluded from the totals)
          items: { $ref: '#/components/schemas/Money' }
        source:
          type: string
          enum: [COMPUTED, SNAPSHOT]
        closed:
          type: boolean
          description: The period is closed and has a closing snapshot
        partial:
          type: boolean
          description: The period is in progress and the point is computed at today's date
        ratesUsed:
          type: array
          description: Rates used to value this point (empty for snapshot points)
          items: { $ref: '#/components/schemas/ResolvedRate' }
    NetWorthHistory:
      type: object
      additionalProperties: false
      required: [reportingCurrency, points, meta]
      properties:
        reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        points:
          type: array
          items: { $ref: '#/components/schemas/NetWorthPoint' }
        meta:
          type: object
          additionalProperties: false
          required: [generatedAt, timeZone, rateWindowDays, ratesUsed, attributions]
          properties:
            generatedAt: { $ref: '#/components/schemas/Instant' }
            timeZone: { type: string }
            rateWindowDays:
              type: integer
              description: Rate validity window (REPORTING_RATE_VALIDITY_WINDOW), the same as `/reports/summary`.
            dataFreshness: { $ref: '#/components/schemas/Instant' }
            ratesUsed:
              type: array
              items: { $ref: '#/components/schemas/ResolvedRate' }
            attributions:
              type: array
              items: { $ref: '#/components/schemas/RateAttribution' }
    HomeQuestionStatus:
      type: object
      required: [question, status, actionHint]
      properties:
        question:
          type: string
          enum: [Q1, Q2, Q3, Q4, Q5, Q6, Q7, Q8, Q9]
          description: Home questions of docs/00 §6
        status:
          type: string
          enum: [AVAILABLE, NO_DATA, NOT_AVAILABLE_IN_PHASE]
        actionHint: { type: [string, 'null'] }
    ReportSummary:
      type: object
      required: [period, byCurrency, consolidated, accounts, topExpenseCategories, netWorth, questions, meta]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { $ref: '#/components/schemas/LocalDate' }
            to: { $ref: '#/components/schemas/LocalDate' }
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/CurrencyTotals' }
        consolidated: { $ref: '#/components/schemas/ConsolidatedTotals' }
        comparison:
          description: Null when compare=NONE
          oneOf:
            - $ref: '#/components/schemas/PeriodComparison'
            - type: 'null'
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceLine' }
        topExpenseCategories:
          type: array
          items:
            type: object
            required: [categoryId, name, amount, complete]
            properties:
              categoryId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              amount:
                $ref: '#/components/schemas/Money'
                description: Net expense (expenses − refunds) in the reporting currency; may be negative
              complete: { type: boolean }
              previousAmount:
                description: |
                  Net expense of the same category in the comparison period (`comparison.previousPeriod`), in the
                  reporting currency, converted at the rate of each flow's date (zero if it had no flows there). Null
                  when there is no comparison (compare=NONE) or when some previous amount could not be converted.
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
        topIncomeCategories:
          type: array
          description: |
            Top N income categories of the period (same N, ordering and tie-break as `topExpenseCategories`), by net
            income in the reporting currency (FR-REPORTING-004).
          items:
            type: object
            required: [categoryId, name, amount, complete]
            properties:
              categoryId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              amount:
                $ref: '#/components/schemas/Money'
                description: Net income in the reporting currency; may be negative
              complete: { type: boolean }
              previousAmount:
                description: |
                  Net income of the same category in the comparison period, in the reporting currency (zero if it
                  had no flows there). Null when there is no comparison or some previous amount could not be converted.
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
        netWorth: { $ref: '#/components/schemas/NetWorthBreakdown' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/HomeQuestionStatus' }
        meta:
          type: object
          required: [generatedAt, reportingCurrency, approx, timeZone, rateWindowDays, complete]
          properties:
            generatedAt: { $ref: '#/components/schemas/Instant' }
            reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
            approx: { type: boolean, description: True if any consolidated figure uses reference or cross rates }
            timeZone: { type: string, examples: [America/La_Paz] }
            rateWindowDays: { type: integer, minimum: 0 }
            complete: { type: boolean }
            dataFreshness:
              $ref: '#/components/schemas/Instant'
              description: Instant of the latest data included (Phase 1 reads the ledger directly)
            ratesUsed:
              type: array
              items: { $ref: '#/components/schemas/ResolvedRate' }
            attributions:
              type: array
              description: 'Distinct attributions of the provider rates used (e.g. "Fuente: paralelo.bo", CC BY 4.0); clients must display them'
              items: { $ref: '#/components/schemas/RateAttribution' }

    # ── Platform ──
    Operation:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind:
          type: string
          description: Open set (IMPORT_PARSE, IMPORT_COMMIT, FORECAST, EXPORT, WORKSPACE_DELETE, REBUILD, ...)
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        progressPct: { type: integer, minimum: 0, maximum: 100 }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { $ref: '#/components/schemas/Uuid' }
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }

    # ── Notifications (add-alerts, Phase 2) ──
    NotificationType:
      type: string
      description: Open set; later phases add types (upcoming payments, goals, cards, stale rates, imports, deficit).
      pattern: '^[A-Z][A-Z0-9_]*$'
      examples: [BUDGET_THRESHOLD]
      x-extensible-enum: [BUDGET_THRESHOLD, MONTH_CLOSE_PENDING]
    NotificationSeverity:
      type: string
      description: INFO below 100 % of a budget line; WARNING at 100 % or more and for a month pending close.
      enum: [INFO, WARNING, CRITICAL]
    NotificationStatus:
      type: string
      enum: [UNREAD, READ, ARCHIVED]
    NotificationEmailStatus:
      type: string
      description: |
        Aggregated state of the email delivery. `PENDING` covers queued, in progress and waiting for a retry or for
        the end of the quiet hours; `SUPPRESSED` means the email will never be sent (channel disabled, no verified
        address, preference turned off).
      enum: [PENDING, SENT, FAILED, SUPPRESSED]
    NotificationLink:
      type: object
      description: |
        Resource that originated the notification. The app translates it to a route; if the budget line no longer
        exists the plan of the period shows that it is not available any more (the notification is not modified).
      additionalProperties: false
      required: [kind, periodId, periodLabel]
      properties:
        kind:
          type: string
          enum: [BUDGET_LINE, PERIOD_CLOSE]
        periodId: { $ref: '#/components/schemas/Uuid' }
        periodLabel: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        budgetId: { $ref: '#/components/schemas/Uuid' }
        budgetLineId: { $ref: '#/components/schemas/Uuid' }
        targetKind:
          type: string
          enum: [CATEGORY, GROUP, TAG]
        targetId: { $ref: '#/components/schemas/Uuid' }
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, severity, title, body, messageKey, params, link, status, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/NotificationType' }
        severity: { $ref: '#/components/schemas/NotificationSeverity' }
        title:
          type: string
          description: Rendered in the caller's locale (Spanish fallback) from `messageKey` and `params`.
        body: { type: string }
        messageKey:
          type: string
          description: Versioned message key (e.g. `notifications.budget_threshold.v1`).
        params:
          type: object
          description: |
            Facts of the source event (periodLabel, threshold, alsoCrossed, reference and actual as Money, utilization,
            ids); decimals as strings. Never names or free text.
          additionalProperties: true
        link: { $ref: '#/components/schemas/NotificationLink' }
        status: { $ref: '#/components/schemas/NotificationStatus' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        readAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        emailStatus: { $ref: '#/components/schemas/NotificationEmailStatus' }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { $ref: '#/components/schemas/PageInfo' }
    NotificationUnreadCount:
      type: object
      additionalProperties: false
      required: [unread]
      properties:
        unread: { type: integer, minimum: 0 }
    NotificationReadAllResult:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
    QuietHours:
      type: object
      description: Quiet hours in the user's time zone, `[start, end)`; may cross midnight (22:00–07:00). Start and end differ.
      additionalProperties: false
      required: [start, end]
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['22:00'] }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['07:00'] }
    NotificationTypePreference:
      type: object
      additionalProperties: false
      required: [type, inApp, email]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        inApp: { type: boolean }
        email: { type: boolean }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [types, quietHours, includeDetailsInEmail, version]
      properties:
        types:
          type: array
          description: Every notification type of the catalog with its channels.
          items: { $ref: '#/components/schemas/NotificationTypePreference' }
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/QuietHours'
            - type: 'null'
        includeDetailsInEmail:
          type: boolean
          description: Opt-in to amounts and names in the email body. The in-app content never changes with this option.
        version: { type: integer, minimum: 1 }
    NotificationPreferencesInput:
      type: object
      additionalProperties: false
      required: [types, quietHours, includeDetailsInEmail]
      properties:
        types:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/NotificationTypePreference' }
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/QuietHours'
            - type: 'null'
        includeDetailsInEmail: { type: boolean }
