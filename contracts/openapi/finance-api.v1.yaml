        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'VALIDATION_FAILED (non-positive value, base = quote), CURRENCY_NOT_ENABLED, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/fx-rates/latest:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [FX]
      operationId: getLatestFxRate
      summary: Resolve the applicable rate for a pair at an instant (direct, inverse or cross)
      description: |
        Uses the preferred rate type of the pair when `rateType` is omitted; otherwise the most recent rate of any
        type, indicating which. Cross rates are only derived when `allowCross=true` (then `approx=true`).
        For types fed by market rate providers (`PARALLEL` USD/BOB and USDT/BOB, `OFFICIAL` USD/BOB) the selection is
        (fx/market-rate-providers): non-stale rate of the primary provider (`selection=PRIMARY`) → non-stale rate of the
        fallback provider (`FALLBACK`) → the most recent of the last provider rate (`LAST_KNOWN_STALE`, `stale=true`)
        and the last manual rate of the pair (`MANUAL`) within the window → `FX_RATE_NOT_FOUND`. The fallback provider
        has its own staleness threshold (default 180 min; primary 60 min). At the manual level a manual rate of ANOTHER
        type of the pair (e.g. `P2P`) is accepted only if it is recent (age ≤ 24 h by default), deviates at most the
        anomaly threshold (default 5 %) from the latest provider rate of the pair, is not superseded and is not a
        pending/rejected anomaly; then `rateType` ≠ `requestedRateType`. `PARALLEL_BUY` /
        `PARALLEL_SELL` are only used when requested. Provider rates flagged as anomalous and not confirmed are never
        used. Provider rates carry `attribution` (e.g. "Fuente: paralelo.bo", CC BY 4.0) that clients must display next
        to the rate.
      x-openspec-capability: [fx/market-rates, fx/market-rate-providers]
      x-required-role: VIEWER
      parameters:
        - name: base
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: quote
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: asOf
          in: query
          description: Defaults to now
          schema: { $ref: '#/components/schemas/Instant' }
        - name: rateType
          in: query
          schema: { $ref: '#/components/schemas/FxRateTypeInput' }
        - name: allowCross
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Resolved rate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedRate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'FX_RATE_NOT_FOUND (no rate at or before asOf).'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/fx-rates/{fxRateId}:
    parameters:
