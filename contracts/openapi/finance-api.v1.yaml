        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/fx-rates/{fxRateId}/anomaly-review:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/FxRateId'
    post:
      tags: [FxRates]
      operationId: reviewFxRateAnomaly
      summary: Confirm or reject a provider rate flagged as anomalous (it is not used for valuation until confirmed)
      description: |
        The rate itself is immutable; the decision is stored per workspace and audited. A rejected rate is never used and
        never becomes the anomaly baseline.
      x-openspec-capability: fx/market-rate-providers
      x-required-role: EDITOR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxRateAnomalyReview' }
            examples:
              confirm:
                summary: Confirm a +12.31 % jump (12.02 → 13.50)
                value: { decision: CONFIRM, reason: devaluación anunciada }
      responses:
        '200':
          description: The reviewed rate with its anomaly decision
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'FX_RATE_ANOMALY_ALREADY_REVIEWED, IDEMPOTENCY_REQUEST_IN_PROGRESS.'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: 'FX_RATE_NOT_ANOMALOUS, VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED.'
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

