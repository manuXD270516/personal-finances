        Publishes `commitments.SubscriptionPriceChanged.v1` with `origin = MANUAL`.
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPriceInput' }
      responses:
        '201':
          description: Subscription with the new price entry
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (cancelled subscription).'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            SUBSCRIPTION_PRICE_NOT_CHRONOLOGICAL, CURRENCY_MISMATCH, AMOUNT_NOT_POSITIVE, AMOUNT_SCALE_EXCEEDED or CURRENCY_NOT_ENABLED.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/subscriptions/{subscriptionId}/prices/{priceId}/supersede:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/SubscriptionPriceId'
    post:
      tags: [Commitments]
      operationId: supersedeSubscriptionPrice
      summary: Correct a price entry registered by mistake
      description: |
        Registers a replacement with the same effective date; the original is kept, marked as superseded, and stops counting
        for the price in force. A superseded entry admits no other replacement (409 `INVALID_STATUS_TRANSITION`). The recurring
        definition changes for the unsettled charges dated on or after the date. Publishes `SubscriptionPriceChanged.v1` with
        `origin = CORRECTION` only when the resulting price in force towards the future changes.
      x-openspec-capability: [commitments/subscriptions]
      x-required-role: EDITOR
      x-rate-limit: costly
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPriceSupersedeRequest' }
      responses:
        '200':
          description: Updated subscription
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'INVALID_STATUS_TRANSITION (the entry was already superseded, or the subscription is cancelled).'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: >-
            CURRENCY_MISMATCH, AMOUNT_NOT_POSITIVE, AMOUNT_SCALE_EXCEEDED or CURRENCY_NOT_ENABLED.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /workspaces/{workspaceId}/subscriptions/{subscriptionId}/price-proposals/{proposalId}/accept:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/SubscriptionProposalId'
    post:
      tags: [Commitments]
      operationId: acceptSubscriptionPriceProposal
      summary: Accept a detected price change
      description: |
        Appends the proposed price to the history (`origin = PROPOSAL`) with the effective date of the proposal and updates the
        recurring definition for the unsettled charges from that date, without publishing a second price-change fact. When the
