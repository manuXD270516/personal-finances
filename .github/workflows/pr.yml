# PR gate (platform/delivery-pipeline, docs/23 §5.1 y §6). Todos los jobs son checks requeridos en `main`
# (lista en docs/23 §16). Acciones de terceros fijadas por SHA de commit completo; binarios (Trivy, gitleaks)
# por versión + SHA-256 verificado. El comentario junto a cada SHA es el tag de origen verificado.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  TRIVY_SHA256_ARM64: b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  UV_VERSION: 0.12.20

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      # Flags confirmados en SPIKE-01; telemetría desactivada por env (workflow) y por el propio script.
      - run: pnpm spec:validate

  config-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm config:docs:check
      # OpenTofu de `infra/` (N1, runbook de despliegue fase 3): formato y validación SIN credenciales ni backend. La versión
      # cumple `required_version` (>= 1.10) y se revisa a mano con las de Trivy y gitleaks (Renovate no ve este input).
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.10
          tofu_wrapper: false
      - name: OpenTofu fmt y validate (infra/)
        run: |
          tofu fmt -check -recursive -diff infra/
          for d in infra/environments/*/ infra/modules/*/; do
            echo "::group::tofu validate $d"
            (cd "$d" && tofu init -backend=false -input=false -no-color && tofu validate -no-color)
            echo "::endgroup::"
          done

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # oasdiff compara contra origin/main
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # add-api-conventions (design §Contratos #12, docs/10 §1.2): validez OpenAPI 3.1 y reglas PFOS.
      - name: Redocly lint
        run: npx --yes @redocly/cli@2.57.0 lint contracts/openapi/finance-api.v1.yaml
      - name: Spectral (contracts/openapi/.spectral.yaml)
        run: >-
          npx --yes @stoplight/spectral-cli@6.17.0 lint contracts/openapi/finance-api.v1.yaml
          --ruleset contracts/openapi/.spectral.yaml --fail-severity error
      # Cambios incompatibles en /api/v1 (NFR-MAINT-009): la excepción exige el label api-breaking + ADR.
      # Las pruebas con fixtures que fallan a propósito (TC-PLATFORM-API-002) corren en el job `integration`.
      - name: oasdiff breaking contra main
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: |
          git show origin/main:contracts/openapi/finance-api.v1.yaml > "$RUNNER_TEMP/finance-api.main.yaml"
          pnpm contract:breaking "$RUNNER_TEMP/finance-api.main.yaml" "$GITHUB_WORKSPACE/contracts/openapi/finance-api.v1.yaml"

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      # Las pruebas "cada regla falla con su fixture" (TC-PLATFORM-ARCH-001) corren en el job `unit`.
      - run: pnpm arch:check

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo: R11 compara contra origin/main (TC borrados)
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm traceability:check -- --base origin/main
      - name: Matriz de trazabilidad (artefacto)
        if: ${{ !cancelled() }}
        run: pnpm traceability:matrix
      # Financial Regression Suite (docs/16 §11.3): lista derivada de tests/cases; sus tests ya corren completos en
      # `unit` e `integration`. La ejecución agrupada con NIGHTLY=1 (PBT a 10 000 corridas) es el job nightly `regression`.
      - name: Financial Regression Suite (lista, artefacto)
        if: ${{ !cancelled() }}
        run: pnpm traceability:regression
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: traceability-matrix
          path: |
            tests/traceability/matrix.md
            tests/traceability/matrix.json
            tests/traceability/regression-suite.md
            tests/traceability/regression-suite.json
          if-no-files-found: error
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test
      # D283 (fix-nightly-pipeline): la cobertura del shared-kernel (umbrales de packages/shared-kernel/vitest.config.ts) se
      # exige también en el PR, dentro del check requerido `unit`. Sin `if` ni `continue-on-error`; no es un job nuevo.
      - name: Cobertura del shared-kernel (≥ 95 % líneas, ≥ 90 % ramas)
        run: pnpm --filter @pf/shared-kernel run test:coverage

  # Gate del servicio de pronósticos Python (platform/delivery-pipeline, openspec add-ml-forecasting-service, D419). UN solo
  # check llamado `ml`, siempre presente: cuando la PR no toca el servicio ni su contrato los pasos se omiten y el job queda
  # en verde, así puede ser obligatorio en `main` sin bloquear las PR ajenas. Agregarlo a los checks obligatorios es una
  # decisión de seguridad del repositorio y la aplica el owner (CLAUDE.md).
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ml-forecasting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ¿Cambia el servicio o su contrato?
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(services/ml-forecasting/|contracts/ml/|contracts/openapi/ml-forecasting.v1.yaml$|docker/finance-ml.Dockerfile$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en el servicio de pronósticos ni en su contrato: el gate pasa sin ejecutar pasos."
          fi
      - name: Instalar uv (versión fijada) y las dependencias del lockfile
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -m pip install --user "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --frozen
      - name: ruff (lint y formato)
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy --strict
        if: steps.changes.outputs.run == 'true'
        run: uv run mypy --strict .
      # Incluye las propiedades de los intervalos (hypothesis), el determinismo y la verificación de que el OpenAPI que genera
      # el servicio coincide con contracts/openapi/ml-forecasting.v1.yaml (y los ejemplos compartidos con el lado TypeScript).
      - name: pytest (propiedades, contrato y ejemplos compartidos)
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest
      - name: Instalar osv-scanner (versión fijada + SHA-256)
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner && mv osv-scanner "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: osv-scanner (uv.lock)
        if: steps.changes.outputs.run == 'true'
        run: osv-scanner scan source --lockfile uv.lock

  integration:
    runs-on: ubuntu-latest # Docker disponible en los runners Linux hospedados
    # La suite tarda ~22 min; con 25 el margen era de ~2,5 min y un archivo nuevo o un runner lento la cancelaba (2026-10-20, #154).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:integration

  # Cada imagen se construye y escanea en linux/amd64 (filas con el nombre histórico `image (<imagen>)`, checks obligatorios)
  # y en linux/arm64 con runner nativo (filas `image (<imagen>, arm64)`, checks NUEVOS y no obligatorios; C12a, plan B Oracle A1).
  # Las filas arm64 solo construyen (sin push), verifican no-root y pasan Trivy: no exportan artefacto, así que stack-smoke y
  # e2e siguen cargando únicamente las imágenes amd64.
  image:
    name: image (${{ matrix.image }}${{ matrix.arch == 'arm64' && ', arm64' || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [finance-api, finance-web, pfos-postgres, finance-ml, pfos-keycloak]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            trivy_tarball: trivy_0.74.0_Linux-64bit.tar.gz
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            trivy_tarball: trivy_0.74.0_Linux-ARM64.tar.gz
          - image: finance-api
            dockerfile: docker/api.Dockerfile
          - image: finance-web
            dockerfile: docker/web.Dockerfile
          # Imagen de producción N1 (ADR-0027): se construye y escanea en el PR para no descubrir fallas recién en main.
          - image: pfos-postgres
            dockerfile: docker/postgres.Dockerfile
          # Servicio interno de pronósticos (ADR-0033): imagen opcional en N1, escaneada con el mismo criterio.
          - image: finance-ml
            dockerfile: docker/finance-ml.Dockerfile
          # Keycloak con build optimizado (C7): mismo criterio (no-root + Trivy) que las demás imágenes propias.
          - image: pfos-keycloak
            dockerfile: docker/keycloak.Dockerfile
    env:
      IMAGE_REF: pfos/${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (buildx, sin push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha }}
            VERSION=0.0.0-pr.${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")"
          echo "USER=${user}"
          case "${user%%:*}" in ''|0|root) echo "::error::${IMAGE_REF} corre como root"; exit 1;; esac
      - name: Instalar Trivy (versión fijada + SHA-256)
        env:
          TRIVY_TARBALL: ${{ matrix.trivy_tarball }}
          TRIVY_SHA256: ${{ matrix.arch == 'arm64' && env.TRIVY_SHA256_ARM64 || env.TRIVY_SHA256 }}
        run: |
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_TARBALL}"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz -C "$RUNNER_TEMP" trivy && rm trivy.tgz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Falla ante CRITICAL con corrección disponible; excepciones con vencimiento en .trivyignore.yaml.
      - name: Trivy image
        run: >-
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml --no-progress "$IMAGE_REF"
      - name: Exportar imagen para stack-smoke (build once)
        if: matrix.arch == 'amd64'
        run: docker save "$IMAGE_REF" -o "$RUNNER_TEMP/${{ matrix.image }}.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'amd64'
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          if-no-files-found: error
          retention-days: 1

  stack-smoke:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PF_STACK_PREBUILT_IMAGES: '1'
      FINANCE_API_IMAGE: pfos/finance-api:ci
      FINANCE_WEB_IMAGE: pfos/finance-web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Cargar las imágenes del job `image` (sin reconstruir)
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
      # TC-PLATFORM-STACK-*: perfil core healthy, migrate, reset+seed, backup/restore… (tarea 4.3 en Linux).
      - run: pnpm test:stack

  # E2E con Playwright (Chromium) contra el stack Compose desechable `pfos-e2e` con Keycloak real (add-workspace-
  # identity, grupo 9). Prueba las imágenes construidas UNA vez por el job `image` (sin reconstruir). Aún NO es un
  # check requerido de `main` (docs/23 §16: pendiente de agregar a la protección de rama).
  e2e:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PF_STACK_PREBUILT_IMAGES: '1'
      FINANCE_API_IMAGE: pfos/finance-api:ci
      FINANCE_WEB_IMAGE: pfos/finance-web:ci
      FINANCE_ML_IMAGE: pfos/finance-ml:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Cargar las imágenes del job `image` (sin reconstruir)
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
      # Navegador de la versión de @playwright/test fijada en el lockfile (con sus dependencias de sistema).
      - name: Instalar Chromium de Playwright
        run: pnpm --filter @pf/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Instalar Trivy (versión fijada + SHA-256)
        run: |
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz -C "$RUNNER_TEMP" trivy && rm trivy.tgz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Misma política y mismo archivo de excepciones que las imágenes (pnpm-lock.yaml; spikes/ fuera del producto).
      - name: Trivy fs (pnpm-lock.yaml)
        run: >-
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml --skip-dirs spikes --no-progress .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versión fijada + SHA-256)
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Solo los commits que aporta la PR: la historia previa de main contiene falsos positivos conocidos
      # (credenciales de desarrollo de spikes, claves de idempotencia en TC) ya revisados.
      - name: gitleaks (commits de la PR)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose --no-banner --exit-code 1 .
