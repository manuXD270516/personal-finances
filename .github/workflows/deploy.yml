# Deploy a producción N1 (ADR-0027, docs/runbooks/deploy-and-restore.md). SOLO manual (workflow_dispatch) y con
# aprobación: el job `run` usa el environment `production` (required reviewers = owner; deployment branches = main).
# No construye nada: toma los digests que main.yml registró para ese commit (build-once, docs/23 §5.2) y se los pasa
# al host por SSH a través de Tailscale (sin SSH público). El host solo acepta el comando forzado `pfos-deploy`,
# valida los argumentos y despliega; ningún secreto de la aplicación pasa por CI.
#
# Configuración en GitHub (Settings → Environments → production), sin nada en el repo:
#   secrets: DEPLOY_SSH_KEY (privada ed25519 exclusiva del deploy), DEPLOY_SSH_KNOWN_HOSTS (línea de host key pinneada)
#   vars:    DEPLOY_HOST (nombre MagicDNS del host en la tailnet), PFOS_APP_URL (https://app.<dominio>),
#            TS_OIDC_CLIENT_ID / TS_OIDC_AUDIENCE (federación OIDC de Tailscale: sin auth key de larga vida)
# Acciones de terceros fijadas por SHA de commit completo (comentario = tag verificado), igual que main.yml/pr.yml.
name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy (commit de main ya construido por main.yml) | rollback (release anterior) | status'
        type: choice
        options: [deploy, rollback, status]
        default: deploy
      commit_sha:
        description: 'SHA completo (40 hex) de un commit de main con main.yml en verde (solo para deploy)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # nunca cortar un deploy a medias; el siguiente espera

jobs:
  resolve:
    name: resolve (digests de main.yml)
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.refs.outputs.sha }}
      api: ${{ steps.refs.outputs.api }}
      web: ${{ steps.refs.outputs.web }}
      pg: ${{ steps.refs.outputs.pg }}
    steps:
      - name: Validar commit y localizar la corrida de main.yml
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit_sha debe ser un SHA completo de 40 hex"; exit 1; }
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)"
          case "$status" in ahead|identical) ;; *) echo "::error::${SHA} no está en main (${status})"; exit 1;; esac
          run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow main.yml --branch main --commit "$SHA" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [ -n "$run_id" ] || { echo "::error::no hay una corrida exitosa de main.yml para ${SHA}"; exit 1; }
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Leer y validar las referencias por digest
        id: refs
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          ref() {
            local f="$RUNNER_TEMP/digests/$1.json"
            [ -f "$f" ] || { echo "::error::falta el digest de $1 (¿commit anterior a pfos-postgres en main.yml?)"; exit 1; }
            local r; r="$(jq -r .ref "$f")"
            [[ "$r" =~ ^ghcr\.io/manuxd270516/$1@sha256:[0-9a-f]{64}$ ]] || { echo "::error::ref inválida: $r"; exit 1; }
            [ "$(jq -r .tag "$f")" = "sha-${SHA}" ] || { echo "::error::$1 no corresponde a ${SHA}"; exit 1; }
            echo "$r"
          }
          {
            echo "sha=${SHA}"
            echo "api=$(ref finance-api)"
            echo "web=$(ref finance-web)"
            echo "pg=$(ref pfos-postgres)"
          } | tee -a "$GITHUB_OUTPUT"

  run:
    name: ${{ inputs.action }} (production)
    needs: [resolve]
    if: ${{ !cancelled() && (needs.resolve.result == 'success' || (needs.resolve.result == 'skipped' && inputs.action != 'deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PFOS_APP_URL }}
    permissions:
      contents: read
      id-token: write # federación OIDC con Tailscale (sin auth key guardada)
    steps:
      - name: Conectar a la tailnet (nodo efímero tag:pfos-ci)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:pfos-ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Preparar SSH (clave efímera en RUNNER_TEMP, host key pinneada)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] \
            || { echo "::error::faltan secretos del environment production"; exit 1; }
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Ejecutar en el host
        env:
          ACTION: ${{ inputs.action }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ needs.resolve.outputs.sha }}
          API: ${{ needs.resolve.outputs.api }}
          WEB: ${{ needs.resolve.outputs.web }}
          PG: ${{ needs.resolve.outputs.pg }}
        run: |
          case "$ACTION" in
            deploy) remote="deploy ${SHA} ${API} ${WEB} ${PG}" ;;
            *) remote="$ACTION" ;;
          esac
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "pfos-deploy@${DEPLOY_HOST}" "$remote"
          {
            echo "### ${ACTION} (production)"
            if [ "$ACTION" = deploy ]; then
              echo ""
              echo "| imagen | ref |"
              echo "|---|---|"
              echo "| finance-api | \`${API}\` |"
              echo "| finance-web | \`${WEB}\` |"
              echo "| pfos-postgres | \`${PG}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar la clave SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
