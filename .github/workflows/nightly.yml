# Nightly (docs/23 §5.5, docs/16 §5.15/§8/§11.3): pruebas que NO caben en el PR gate. No es un check requerido de
# `main` ni cambia los de `pr.yml`. Jobs independientes (uno que falla no cancela a los demás):
#   regression     Financial Regression Suite derivada de tests/cases (`regression_suite: true`), unit + integración,
#                  con NIGHTLY=1 (property-based tests a 10 000 corridas, semilla aleatoria impresa en cada falla).
#                  Si falla abre o comenta el issue "nightly regression: falló" (D284).
#   mutation       shared-kernel: cobertura (≥ 95 % líneas / ≥ 90 % ramas) y Stryker (mutation score ≥ 80 %);
#                  dominio IDENTITY: cobertura ≥ 90 % (add-workspace-identity 4.1). Si falla abre o comenta el issue
#                  "nightly mutation: falló" (D284).
#   perf           Large Seed (docs/29 §2.3) + benchmarks NFR-PERF-001/002/003/004/005/006 y overhead de RLS (Testcontainers);
#                  falla si un p95 supera su umbral de docs/02 (incluye NFR-PERF-002, búsqueda de texto). Reporte JSON +
#                  Markdown como artefacto. Si falla abre o comenta el issue "nightly perf: umbral superado" (D270).
#                  `issues: write` solo en los jobs que avisan (regression, mutation, perf y fx-smoke-live), cada uno con su
#                  issue y su título; nunca a nivel de workflow.
#   fx-smoke-live  ÚNICO job con red hacia terceros: smoke de los providers de tasas reales. `continue-on-error`:
#                  nunca rompe el pipeline; si falla abre o actualiza un issue para revisar el adapter.
# Acciones fijadas por SHA de commit completo (comentario = tag verificado), igual que pr.yml/main.yml.
#
# RAMA DE EXPERIMENTOS (claude/investigate-perf-under-load-experiments; NO se fusiona nunca, change 48, tarea 3.1):
# este workflow es el de la rama, solo para `workflow_dispatch`. Diferencias con `main`:
#   - `workflow_dispatch` acepta inputs que se exportan como PF_PERF_* (suites, purge, trivial_handler, concurrency,
#     one_consumer, label y los auxiliares throughput_seconds, worker_pool_max y max_connections).
#   - Con `workflow_dispatch` solo corre el job `perf` (regression, mutation y fx-smoke-live no).
#   - El paso de aviso por issue de `perf` está desactivado (no comenta el issue real "nightly perf: umbral superado").
#   - Cada corrida imprime en el log un bloque `PERF-EXPERIMENT <label> >>>` ... `<<<` con medianas por benchmark,
#     foto de carga de fondo, muestreo y extras (pg_stat_statements, EXPLAIN): se recoge con get_job_logs.
# Lanzar fuera de la ventana de las 06:00 UTC: `concurrency: nightly` cancela la corrida en curso.
name: nightly

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 02:00 America/La_Paz (UTC−4, sin horario de verano)
  workflow_dispatch:
    inputs:
      suites:
        description: 'PF_PERF_SUITES: archivos *.perf.ts a correr, en orden y separados por coma (ej. spendable,commitments). Vacío = todos'
        required: false
        default: ''
        type: string
      purge:
        description: 'PF_PERF_PURGE_BACKLOG: purga el backlog residual (outbox y colas events.*) al empezar cada suite'
        required: false
        default: false
        type: boolean
      trivial_handler:
        description: 'PF_PERF_TRIVIAL_HANDLER: handler trivial en los consumidores medidos'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'PF_PERF_CONCURRENCY: concurrencia por consumidor (vacío = la del producto)'
        required: false
        default: ''
        type: string
      one_consumer:
        description: 'PF_PERF_ONE_CONSUMER: un solo consumidor activo (ej. planning.journal-entry-posted)'
        required: false
        default: ''
        type: string
      label:
        description: 'PF_PERF_LABEL: etiqueta del experimento (ej. e1-base-1); activa pg_stat_statements, muestreo, EXPLAIN y el bloque PERF-EXPERIMENT'
        required: false
        default: ''
        type: string
      throughput_seconds:
        description: 'PF_PERF_THROUGHPUT_SECONDS: duración máxima del throughput por consumidor (vacío = 600)'
        required: false
        default: ''
        type: string
      worker_pool_max:
        description: 'PF_PERF_WORKER_POOL_MAX: DATABASE_POOL_MAX del worker del throughput (vacío = el del producto)'
        required: false
        default: ''
        type: string
      max_connections:
        description: 'PF_PERF_MAX_CONNECTIONS: max_connections del PostgreSQL de la suite (vacío = 100)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'

jobs:
  regression:
    name: regression (Financial Regression Suite)
    if: ${{ github.event_name != 'workflow_dispatch' }} # rama de experimentos: solo corre perf
    runs-on: ubuntu-latest # Docker para Testcontainers
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # solo para abrir/comentar el aviso "nightly regression: falló" (fix-nightly-pipeline 8.5, D284)
    env:
      NIGHTLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      # Los tests de integración importan los paquetes del workspace compilados (como `pnpm test:integration`).
      - run: pnpm turbo run build
      - run: pnpm traceability:regression --run
      - name: Resumen
        if: ${{ !cancelled() }}
        run: cat tests/traceability/regression-suite.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: regression-suite
          path: |
            tests/traceability/regression-suite.json
            tests/traceability/regression-suite.md
          if-no-files-found: error
          retention-days: 30
      # D284: si el job falla, abre el issue de aviso o comenta el que ya está abierto con ese título exacto (nunca
      # duplica). Un issue por job: este no se mezcla con los de mutation ni perf.
      - name: Abrir o comentar el aviso de la suite de regresión
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='nightly regression: falló'
          body="$(printf 'El job regression del nightly falló en %s.\n\n%s\n' "$RUN_URL" "$(cat tests/traceability/regression-suite.md 2>/dev/null || echo 'sin reporte')")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  mutation:
    name: mutation (shared-kernel) + cobertura de dominio
    if: ${{ github.event_name != 'workflow_dispatch' }} # rama de experimentos: solo corre perf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # solo para abrir/comentar el aviso "nightly mutation: falló" (fix-nightly-pipeline 8.5, D284)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      # NFR-MAINT-002 / add-ledger-core 2.5: umbrales en packages/shared-kernel/vitest.config.ts y stryker.config.json.
      - name: Cobertura (≥ 95 % líneas, ≥ 90 % ramas)
        run: pnpm --filter @pf/shared-kernel run test:coverage
      - name: Stryker (mutation score ≥ 80 %)
        if: ${{ !cancelled() }}
        run: pnpm --filter @pf/shared-kernel run test:mutation
      # add-workspace-identity 4.1: umbral (≥ 90 % líneas/sentencias/funciones/ramas) en
      # packages/contexts/identity/vitest.config.ts, medido solo sobre src/domain.
      - name: Cobertura del dominio IDENTITY (≥ 90 %)
        if: ${{ !cancelled() }}
        run: pnpm --filter @pf/identity run test:coverage
      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### shared-kernel'
            node -e "const s=require('./packages/shared-kernel/coverage/coverage-summary.json').total;console.log('| métrica | % |\n|---|---|\n| líneas | '+s.lines.pct+' |\n| ramas | '+s.branches.pct+' |')" || true
            echo '### dominio IDENTITY'
            node -e "const s=require('./packages/contexts/identity/coverage/coverage-summary.json').total;console.log('| métrica | % |\n|---|---|\n| líneas | '+s.lines.pct+' |\n| ramas | '+s.branches.pct+' |')" || true
            node -e "const r=require('./packages/shared-kernel/reports/mutation/mutation.json');let k=0,t=0;for(const f of Object.values(r.files))for(const m of f.mutants){if(['Killed','Timeout'].includes(m.status))k++;if(!['CompileError','RuntimeError','Ignored'].includes(m.status))t++;}console.log('\nMutation score: '+(100*k/t).toFixed(2)+' % ('+k+'/'+t+')')" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: shared-kernel-quality
          path: |
            packages/shared-kernel/coverage
            packages/shared-kernel/reports/mutation
            packages/contexts/identity/coverage
          if-no-files-found: warn
          retention-days: 30
      # D284: aviso por issue del job (cobertura del shared-kernel o del dominio IDENTITY, o mutation score). Mismo patrón
      # que perf: busca por título exacto, comenta si existe y crea si no.
      - name: Abrir o comentar el aviso de cobertura y mutación
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='nightly mutation: falló'
          metrics="$({
            echo '### shared-kernel'
            node -e "const s=require('./packages/shared-kernel/coverage/coverage-summary.json').total;console.log('| métrica | % |\n|---|---|\n| líneas | '+s.lines.pct+' |\n| ramas | '+s.branches.pct+' |')" || true
            echo '### dominio IDENTITY'
            node -e "const s=require('./packages/contexts/identity/coverage/coverage-summary.json').total;console.log('| métrica | % |\n|---|---|\n| líneas | '+s.lines.pct+' |\n| ramas | '+s.branches.pct+' |')" || true
            node -e "const r=require('./packages/shared-kernel/reports/mutation/mutation.json');let k=0,t=0;for(const f of Object.values(r.files))for(const m of f.mutants){if(['Killed','Timeout'].includes(m.status))k++;if(!['CompileError','RuntimeError','Ignored'].includes(m.status))t++;}console.log('\nMutation score: '+(100*k/t).toFixed(2)+' % ('+k+'/'+t+')')" || true
          } 2>/dev/null)"
          body="$(printf 'El job mutation del nightly falló en %s.\n\n%s\n' "$RUN_URL" "${metrics:-sin reporte}")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  perf:
    name: perf (Large Seed + NFR-PERF)
    runs-on: ubuntu-latest # Docker para Testcontainers (PostgreSQL 18)
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write # solo para abrir/comentar el aviso "nightly perf: umbral superado" (add-dependency-updates 4.3, D270)
    # Rama de experimentos: los inputs de workflow_dispatch se exportan como variables PF_PERF_* (vacías en el schedule).
    env:
      PF_PERF_SUITES: ${{ inputs.suites }}
      PF_PERF_PURGE_BACKLOG: ${{ inputs.purge && '1' || '' }}
      PF_PERF_TRIVIAL_HANDLER: ${{ inputs.trivial_handler && '1' || '' }}
      PF_PERF_CONCURRENCY: ${{ inputs.concurrency }}
      PF_PERF_ONE_CONSUMER: ${{ inputs.one_consumer }}
      PF_PERF_LABEL: ${{ github.event_name == 'workflow_dispatch' && (inputs.label || format('manual-{0}', github.run_id)) || '' }}
      PF_PERF_THROUGHPUT_SECONDS: ${{ inputs.throughput_seconds }}
      PF_PERF_WORKER_POOL_MAX: ${{ inputs.worker_pool_max }}
      PF_PERF_MAX_CONNECTIONS: ${{ inputs.max_connections }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - run: pnpm turbo run build --filter=@pf/api...
      # Carga ~97 000 transacciones (principal) + 20 satélites por los casos de uso y mide los p95 (docs/02 §PERF).
      - run: pnpm perf:bench
      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          cat reports/perf/perf-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat reports/perf/experiment-block.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: reports/perf
          if-no-files-found: warn
          retention-days: 90
      # D270: si el job falla (un p95 supera su umbral), abre el issue de aviso o comenta el que ya está abierto con ese
      # título exacto (nunca duplica). No es check requerido: el rojo avisa sin bloquear PR.
      # Rama de experimentos: DESACTIVADO (`false &&`) para no comentar el issue real; la condición conserva failure().
      - name: Abrir o comentar el aviso de umbral superado
        if: ${{ false && failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='nightly perf: umbral superado'
          body="$(printf 'El job perf del nightly falló en %s.\n\n%s\n' "$RUN_URL" "$(cat reports/perf/perf-summary.md 2>/dev/null || echo 'sin reporte')")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  fx-smoke-live:
    name: fx-smoke-live (no bloqueante)
    if: ${{ github.event_name != 'workflow_dispatch' }} # rama de experimentos: solo corre perf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # add-market-rate-providers 7.3: nunca rompe el pipeline
    permissions:
      contents: read
      issues: write # solo para abrir/actualizar el aviso de revisión del adapter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-workspace
      - id: smoke
        run: pnpm fx:smoke-live
      - name: Resumen
        if: ${{ !cancelled() }}
        run: cat reports/fx-smoke/fx-smoke.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: fx-smoke-live
          path: reports/fx-smoke
          if-no-files-found: warn
          retention-days: 30
      - name: Abrir o actualizar el aviso de revisión del adapter
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='fx:smoke-live: revisar los adapters de providers de tasas'
          body="$(printf 'El smoke en vivo de los providers falló en %s.\n\n%s\n' "$RUN_URL" "$(cat reports/fx-smoke/fx-smoke.md 2>/dev/null || echo 'sin reporte')")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
