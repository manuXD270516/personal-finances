name: Setup workspace
description: pnpm (versión de packageManager) + Node (.nvmrc) con caché del store de pnpm + pnpm install --frozen-lockfile.
inputs:
  install:
    description: Ejecutar pnpm install --frozen-lockfile
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # Acciones de terceros fijadas por SHA de commit completo (docs/23 §14). Comentario = tag verificado.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lee packageManager de package.json)
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
