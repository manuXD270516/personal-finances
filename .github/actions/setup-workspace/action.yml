name: Setup workspace
description: pnpm (versión de packageManager) + Node (.nvmrc) con caché del store de pnpm + pnpm install --frozen-lockfile.
inputs:
  install:
    description: Ejecutar pnpm install --frozen-lockfile
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # Acciones de terceros fijadas por SHA de commit completo (docs/23 §14). Comentario = tag verificado.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (lee packageManager de package.json)
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
