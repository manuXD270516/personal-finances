# pgBackRest — producción N1 (ADR-0027, docs/30 §4.1, SPIKE-09 §10). SIN SECRETOS: las claves de B2 y la
# passphrase de cifrado llegan por variables de entorno desde /etc/pfos/pgbackrest.env (0600, root):
#   PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET / PGBACKREST_REPO1_CIPHER_PASS
#   PGBACKREST_REPO2_S3_KEY / PGBACKREST_REPO2_S3_KEY_SECRET / PGBACKREST_REPO2_CIPHER_PASS
# y el bucket/endpoint por PGBACKREST_REPO{1,2}_S3_BUCKET / _S3_ENDPOINT / _S3_REGION (salida de `tofu output`).
#
# repo1 = PITR: full semanal + diferencial diario + WAL continuo; retención 14 días (docs/30 §4: PITR 14 d).
# repo2 = mensuales: un full por mes, 12 retenidos (docs/30 §4: `monthly-YYYYMM` 12 meses); solo WAL de
#         consistencia de cada backup (PITR fino solo en repo1).
# Ambos repos en el mismo bucket B2 con prefijos distintos, cifrado del lado cliente (AES-256) e inmutabilidad
# por Object Lock del bucket (modo governance, la clave del host NO tiene `bypassGovernance`).

[global]
repo1-type=s3
repo1-path=/pgbackrest/pitr
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=14
repo1-bundle=y
repo1-block=y

repo2-type=s3
repo2-path=/pgbackrest/monthly
repo2-s3-uri-style=path
repo2-cipher-type=aes-256-cbc
repo2-retention-full-type=count
repo2-retention-full=12
repo2-retention-archive-type=full
repo2-retention-archive=1
repo2-bundle=y

compress-type=zst
compress-level=3
process-max=1
start-fast=y
delta=y

# WAL asíncrono: un proceso en segundo plano sube lotes; `archive-push` confirma cada segmento solo cuando ya está en el repo.
# Spool en el volumen de datos (sobrevive a recrear el contenedor). Con la cola llena (2 GiB) pgBackRest descarta WAL
# para no llenar el disco (rompe la continuidad del PITR: lo detecta `pgbackrest check`, ver runbook §5).
archive-async=y
archive-push-queue-max=2GiB
spool-path=/var/lib/postgresql/pgbackrest-spool
lock-path=/tmp/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=off

[pfos]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
