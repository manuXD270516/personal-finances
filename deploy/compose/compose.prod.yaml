# PFOS — override de PRODUCCIÓN N1 (ADR-0027, SPIKE-09 §9, docs/runbooks/deploy-and-restore.md). Se aplica SOBRE
# compose.yaml (mismas imágenes y mismo contrato de configuración que el modo B local; solo cambian
# direcciones, límites y lo que es exclusivo de desarrollo):
#
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file /etc/pfos/pfos.env \
#     --env-file /var/lib/pfos/release.env --profile core up -d --wait
#
# (lo ejecuta deploy/host/pfos-deploy.sh; release.env solo contiene los digests FINANCE_*_IMAGE/PFOS_POSTGRES_IMAGE)
#
# Host objetivo: AWS Lightsail 2 GB (sa-east-1). Presupuesto de RAM (SPIKE-09 §3 + docs/runbooks §1): uso estable
# esperado ≈ 1.4–1.7 GiB; los límites de abajo son techos por contenedor (su suma supera 2 GiB a propósito: no
# todos llegan al techo a la vez) + 2 GiB de swap del host (cloud-init). Si el PoC mide OOM o swap sostenido,
# subir el plan a 4 GB (sin cambiar este archivo) o pasar al fallback (Oracle A1, ADR-0027).
#
# Diferencias con el modo B local:
# - Imágenes de la app SOLO por digest (FINANCE_*_IMAGE / PFOS_POSTGRES_IMAGE obligatorias); nunca se construye.
# - Solo Caddy publica puertos (80/443). Keycloak queda en loopback del host (PF_BIND_ADDR = dirección de loopback) para su
#   consola de administración vía túnel SSH por Tailscale; el resto no publica nada.
# - Sin mailpit, sin realm de desarrollo (usuarios demo), sin `start-dev`, sin host.docker.internal.
# - PostgreSQL con pgBackRest (WAL a Backblaze B2) y telemetría directa a Grafana Cloud (OTLP, sin Alloy: RAM).
# - Los nombres de interpolación `PF_DEV_*` del archivo base se conservan (contrato del compose base); en el host
#   se generan con valores aleatorios fuertes (deploy/host/etc-pfos/*.env.example) y nunca salen de él.

x-prod-app-env: &prod-app-env
  # Telemetría directa al gateway OTLP de Grafana Cloud (la cabecera de auth va en pfos.env:
  # OTEL_EXPORTER_OTLP_HEADERS, que el SDK lee directamente; config-reference "OpenTelemetry").
  OTEL_EXPORTER_OTLP_ENDPOINT: ${PF_OTLP_ENDPOINT:?definir en /etc/pfos/pfos.env}
  NODE_OPTIONS: --enable-source-maps --max-old-space-size=192

services:
  # ─────────────────────────── edge ───────────────────────────
  caddy:
    profiles: [core]
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    restart: unless-stopped
    environment:
      PF_DOMAIN_APP: ${PF_DOMAIN_APP:?definir en /etc/pfos/pfos.env}
      PF_DOMAIN_AUTH: ${PF_DOMAIN_AUTH:?definir en /etc/pfos/pfos.env}
      PF_ACME_EMAIL: ${PF_ACME_EMAIL:?definir en /etc/pfos/pfos.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '${PF_PUBLIC_BIND_ADDR:-0.0.0.0}:80:80'
      - '${PF_PUBLIC_BIND_ADDR:-0.0.0.0}:443:443'
      - '${PF_PUBLIC_BIND_ADDR:-0.0.0.0}:443:443/udp'
    read_only: true
    tmpfs: ['/tmp:size=16m']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: local
      options: { max-size: '10m', max-file: '3' }
    depends_on:
      finance-web: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      # pf-allow-loopback: healthcheck dentro del contenedor de Caddy contra su propia API de administración
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 64m }

  # ─────────────────────────── deps ───────────────────────────
  postgres:
    image: ${PFOS_POSTGRES_IMAGE:?digest de pfos-postgres (main.yml)}
    pull_policy: missing
    # Memoria acotada para 2 GB + archivado continuo de WAL a B2 (docs/30 §4.1). `archive_timeout` fuerza un
    # segmento cada 5 min como máximo si hubo escrituras → RPO ≤ 5 min (objetivo ≤ 15 min, docs/30 §2) con ~5× menos
    # objetos en B2 que con 60 s (el polling de pg-boss genera WAL casi continuo).
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=512MB
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=pfos archive-push %p
      - -c
      - archive_timeout=300s
      - -c
      - password_encryption=scram-sha-256
    env_file:
      - path: ${PF_PGBACKREST_ENV_FILE:-/etc/pfos/pgbackrest.env}
        required: true
    volumes:
      - ../pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: '1', memory: 384m }

  object-storage:
    environment:
      GOMEMLIMIT: 140MiB
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 192m }

  mailpit:
    # Solo desarrollo: nunca se activa en producción.
    profiles: !override [dev-only]

  keycloak:
    # Modo producción (no `start-dev`): TLS termina en Caddy (cabeceras X-Forwarded-*), caché local (un nodo,
    # sin JGroups) y realm de producción SIN usuarios demo (se importa solo la primera vez).
    command:
      !override [
        'start',
        '--import-realm',
        '--http-enabled=true',
        '--http-port=8080',
        '--proxy-headers=xforwarded',
        '--cache=local',
      ]
    environment:
      # Consola de administración solo por túnel (Caddy devuelve 404 en /admin desde Internet).
      # pf-allow-loopback: consola de administración de Keycloak solo vía túnel al loopback del host, nunca pública
      KC_HOSTNAME_ADMIN: http://localhost:${PF_KEYCLOAK_PORT}
      KC_DB_POOL_MAX_SIZE: '10'
      # Heap acotado para 2 GB (SPIKE-06: funciona con 512 MiB; 545–581 MiB medidos con límite de 1 GiB).
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=20 -XX:+UseSerialGC
      PF_OIDC_CLIENT_SECRET: ${PF_DEV_OIDC_CLIENT_SECRET}
      PF_DEV_OIDC_CLIENT_SECRET: !reset null
      PF_DEV_KC_OWNER_PASSWORD: !reset null
      PF_DEV_KC_EDITOR_PASSWORD: !reset null
      PF_DEV_KC_VIEWER_PASSWORD: !reset null
      PF_DEV_KC_OUTSIDER_PASSWORD: !reset null
    volumes: !override
      - ./keycloak/realm-pfos-prod.json:/opt/keycloak/data/import/realm-pfos-prod.json:ro
    # Se conserva el puerto del archivo base, pero en loopback: PF_BIND_ADDR apunta al loopback en pfos.env.
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 704m }

  # ─────────────────────────── core ───────────────────────────
  migrate:
    image: ${FINANCE_API_IMAGE:?digest de finance-api (main.yml)}
    build: !reset null
    pull_policy: missing
    environment:
      <<: *prod-app-env
    depends_on: !override
      postgres: { condition: service_healthy }
      object-storage: { condition: service_healthy }

  finance-api:
    image: ${FINANCE_API_IMAGE:?digest de finance-api (main.yml)}
    build: !reset null
    pull_policy: missing
    environment:
      <<: *prod-app-env
    ports: !reset []
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy, restart: true }
      object-storage: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1', memory: 320m }

  finance-worker:
    image: ${FINANCE_API_IMAGE:?digest de finance-api (main.yml)}
    build: !reset null
    pull_policy: missing
    environment:
      <<: *prod-app-env
      # Sin proveedor de email elegido (docs/33 D87, add-alerts): solo notificaciones in-app. Sin mailpit en producción.
      EMAIL_DRIVER: none
    extra_hosts: !reset []
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy, restart: true }
      object-storage: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1', memory: 288m }

  finance-web:
    image: ${FINANCE_WEB_IMAGE:?digest de finance-web (main.yml)}
    build: !reset null
    pull_policy: missing
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: '1', memory: 288m }

volumes:
  caddy-data:
  caddy-config:
